<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#220000"/>
      <stop offset="100%" stop-color="#0d0000"/>
    </linearGradient>
    <radialGradient id="eyeR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2222"/>
      <stop offset="100%" stop-color="#990000"/>
    </radialGradient>
    <linearGradient id="wolfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee1111"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- Diagonal accent bars (low opacity, red/orange) -->
  <polygon points="0,0 120,0 0,300" fill="#cc2200" opacity="0.08"/>
  <polygon points="60,0 200,0 60,300 -20,300" fill="#ee4400" opacity="0.05"/>
  <polygon points="150,0 280,0 200,300 80,300" fill="#ff6600" opacity="0.04"/>
  <polygon points="700,0 900,0 900,300 620,300" fill="#880000" opacity="0.1"/>
  <polygon points="750,0 900,0 900,200 660,300" fill="#aa1100" opacity="0.07"/>

  <!-- Red horizontal line accent at top -->
  <rect x="0" y="0" width="900" height="4" fill="#cc0000" opacity="0.8"/>
  <!-- Bottom accent -->
  <rect x="0" y="296" width="900" height="4" fill="#cc0000" opacity="0.5"/>

  <!-- === LEFT SIDE TEXT === -->

  <!-- Warning icon -->
  <text x="48" y="100" font-family="Arial, sans-serif" font-size="36" fill="#ff4400" opacity="0.9">&#9888;</text>

  <!-- Main headline -->
  <text x="48" y="108" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1">WOLF ALERT</text>

  <!-- Subhead -->
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="22" fill="#ffcccc" letter-spacing="0.5">B.B. Wolf Enterprises has entered your area.</text>

  <!-- Detail line -->
  <text x="50" y="178" font-family="Arial, sans-serif" font-size="14" fill="#ff8888" opacity="0.8">Threat Level: CRITICAL &#183; All straw and stick structures at risk</text>

  <!-- Thin red separator -->
  <rect x="48" y="196" width="340" height="2" fill="#cc0000" opacity="0.6"/>

  <!-- CTA Button -->
  <g transform="translate(48, 216)">
    <rect x="0" y="0" width="210" height="46" rx="4" fill="url(#btnGrad)" stroke="#ff4444" stroke-width="1.5"/>
    <text x="105" y="30" font-family="Arial Black, sans-serif" font-size="17" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">UPGRADE NOW &#8594;</text>
  </g>

  <!-- Small text under button -->
  <text x="50" y="278" font-family="Arial, sans-serif" font-size="11" fill="#884444" opacity="0.7">*BrickCore&#8482; Ultimate recommended. Straw/stick warranties void.</text>

  <!-- === RIGHT SIDE — WOLF SILHOUETTE === -->
  <!-- Wolf body — large, partially off right edge, menacing polygon shapes -->
  <g transform="translate(820, 150)">
    <!-- Torso (large trapezoid) -->
    <polygon points="-60,120 60,120 80,-20 -80,-20" fill="url(#wolfGrad)" opacity="0.85"/>

    <!-- Left arm hanging -->
    <polygon points="-80,-10 -120,60 -70,80 -50,10" fill="#383838" opacity="0.8"/>
    <!-- Left hand claw -->
    <polygon points="-120,60 -140,50 -130,75" fill="#444" opacity="0.8"/>
    <polygon points="-120,60 -142,65 -128,82" fill="#444" opacity="0.8"/>

    <!-- Right arm (partially offscreen) -->
    <polygon points="80,-10 110,40 90,70 60,30" fill="#383838" opacity="0.8"/>

    <!-- Neck -->
    <polygon points="-28,-20 28,-20 20,-55 -20,-55" fill="#555" opacity="0.9"/>

    <!-- Head — large polygon -->
    <polygon points="-55,-55 55,-55 65,-10 50,20 -50,20 -65,-10" fill="#686868" opacity="0.9"/>

    <!-- Ears — sharp pointed polygons -->
    <polygon points="-55,-55 -75,-115 -20,-65" fill="#555" opacity="0.9"/>
    <polygon points="55,-55 75,-115 20,-65" fill="#555" opacity="0.9"/>
    <!-- Inner ears -->
    <polygon points="-55,-58 -68,-105 -25,-68" fill="#330000" opacity="0.5"/>
    <polygon points="55,-58 68,-105 25,-68" fill="#330000" opacity="0.5"/>

    <!-- Eyes — glowing red ovals -->
    <ellipse cx="-22" cy="-32" rx="14" ry="11" fill="url(#eyeR)"/>
    <ellipse cx="22" cy="-32" rx="14" ry="11" fill="url(#eyeR)"/>
    <!-- Eye pupils -->
    <ellipse cx="-22" cy="-32" rx="6" ry="8" fill="#110000"/>
    <ellipse cx="22" cy="-32" rx="6" ry="8" fill="#110000"/>
    <!-- Eye glow halo -->
    <ellipse cx="-22" cy="-32" rx="18" ry="14" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.3"/>
    <ellipse cx="22" cy="-32" rx="18" ry="14" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.3"/>

    <!-- Snout -->
    <polygon points="-20,-10 20,-10 28,12 -28,12" fill="#585858" opacity="0.95"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-8" rx="10" ry="6" fill="#1a1a1a"/>
    <!-- Nostrils -->
    <ellipse cx="-4" cy="-7" rx="2.5" ry="2" fill="#000"/>
    <ellipse cx="4" cy="-7" rx="2.5" ry="2" fill="#000"/>

    <!-- Mouth snarl -->
    <path d="M -20,10 Q 0,18 20,10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Fangs -->
    <polygon points="-10,10 -14,22 -6,22" fill="#dddddd"/>
    <polygon points="10,10 14,22 6,22" fill="#dddddd"/>
    <polygon points="-2,10 -5,18 1,18" fill="#cccccc" opacity="0.7"/>
    <polygon points="2,10 5,18 -1,18" fill="#cccccc" opacity="0.7"/>

    <!-- Wind lines from snout — going LEFT toward text area -->
    <line x1="-65" y1="5" x2="-160" y2="10" stroke="#cc2200" stroke-width="2.5" opacity="0.4"/>
    <line x1="-65" y1="12" x2="-155" y2="20" stroke="#cc2200" stroke-width="2" opacity="0.3"/>
    <line x1="-65" y1="-2" x2="-158" y2="0" stroke="#cc2200" stroke-width="2" opacity="0.3"/>
    <line x1="-62" y1="-8" x2="-150" y2="-10" stroke="#cc2200" stroke-width="1.5" opacity="0.2"/>
    <line x1="-60" y1="19" x2="-145" y2="30" stroke="#cc2200" stroke-width="1.5" opacity="0.2"/>
  </g>
</svg>
