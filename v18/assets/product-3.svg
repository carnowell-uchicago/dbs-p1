<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- White background -->
  <rect width="280" height="200" fill="#ffffff"/>
  <!-- Floor shadow -->
  <ellipse cx="140" cy="180" rx="70" ry="9" fill="#d8d8d8"/>

  <defs>
    <linearGradient id="brickWallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b34040"/>
      <stop offset="40%" stop-color="#c05050"/>
      <stop offset="100%" stop-color="#9a3030"/>
    </linearGradient>
    <linearGradient id="roofSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606878"/>
      <stop offset="100%" stop-color="#404850"/>
    </linearGradient>
    <linearGradient id="chimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa3838"/>
      <stop offset="100%" stop-color="#882828"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="100%" stop-color="#ffe080"/>
    </linearGradient>
  </defs>

  <g transform="translate(138, 112)">
    <!-- Main wall -->
    <rect x="-55" y="-44" width="110" height="80" fill="url(#brickWallGrad)" stroke="#7a2020" stroke-width="1.5"/>

    <!-- Brick pattern — alternating rows -->
    <!-- Row heights: every 8px, offset by 14px alternating -->
    <!-- Row 1 (y=-44 to -36) -->
    <rect x="-55" y="-44" width="24" height="8" rx="0" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-29" y="-44" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-3" y="-44" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="23" y="-44" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 2 offset -->
    <rect x="-55" y="-36" width="16" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-37" y="-36" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-11" y="-36" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="15" y="-36" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="41" y="-36" width="14" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 3 -->
    <rect x="-55" y="-28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-29" y="-28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-3" y="-28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="23" y="-28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 4 -->
    <rect x="-55" y="-20" width="16" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-37" y="-20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-11" y="-20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="15" y="-20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="41" y="-20" width="14" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 5 -->
    <rect x="-55" y="-12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-29" y="-12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-3" y="-12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="23" y="-12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 6 -->
    <rect x="-55" y="-4" width="16" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-37" y="-4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-11" y="-4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="15" y="-4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="41" y="-4" width="14" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 7 -->
    <rect x="-55" y="4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-29" y="4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-3" y="4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="23" y="4" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 8 -->
    <rect x="-55" y="12" width="16" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-37" y="12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-11" y="12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="15" y="12" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="41" y="12" width="14" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 9 -->
    <rect x="-55" y="20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-29" y="20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-3" y="20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="23" y="20" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <!-- Row 10 -->
    <rect x="-55" y="28" width="16" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-37" y="28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="-11" y="28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="15" y="28" width="24" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>
    <rect x="41" y="28" width="14" height="8" fill="none" stroke="#7a1818" stroke-width="0.6" opacity="0.8"/>

    <!-- Windows (left) — warm glow -->
    <rect x="-46" y="-32" width="22" height="18" rx="1" fill="url(#windowGlow)" stroke="#ffffff" stroke-width="2"/>
    <line x1="-35" y1="-32" x2="-35" y2="-14" stroke="#888" stroke-width="0.8"/>
    <line x1="-46" y1="-23" x2="-24" y2="-23" stroke="#888" stroke-width="0.8"/>

    <!-- Windows (right) — warm glow -->
    <rect x="24" y="-32" width="22" height="18" rx="1" fill="url(#windowGlow)" stroke="#ffffff" stroke-width="2"/>
    <line x1="35" y1="-32" x2="35" y2="-14" stroke="#888" stroke-width="0.8"/>
    <line x1="24" y1="-23" x2="46" y2="-23" stroke="#888" stroke-width="0.8"/>

    <!-- Door — solid, arched top -->
    <rect x="-14" y="8" width="28" height="28" rx="14" fill="#4a2800" stroke="#2a1400" stroke-width="1.5"/>
    <rect x="-14" y="22" width="28" height="14" fill="#4a2800"/>
    <circle cx="11" cy="27" r="2.5" fill="#c8a020"/>

    <!-- Chimney -->
    <rect x="28" y="-100" width="16" height="60" fill="url(#chimGrad)" stroke="#7a1818" stroke-width="1"/>
    <!-- Chimney brick detail -->
    <line x1="28" y1="-88" x2="44" y2="-88" stroke="#8a2020" stroke-width="0.8"/>
    <line x1="28" y1="-76" x2="44" y2="-76" stroke="#8a2020" stroke-width="0.8"/>
    <line x1="28" y1="-64" x2="44" y2="-64" stroke="#8a2020" stroke-width="0.8"/>
    <!-- Chimney cap -->
    <rect x="25" y="-102" width="22" height="5" rx="1" fill="#555" stroke="#333" stroke-width="0.8"/>
    <!-- Smoke puffs -->
    <circle cx="36" cy="-108" r="5" fill="#cccccc" opacity="0.5"/>
    <circle cx="33" cy="-116" r="4" fill="#cccccc" opacity="0.35"/>
    <circle cx="37" cy="-124" r="3" fill="#cccccc" opacity="0.2"/>

    <!-- Slate roof -->
    <polygon points="-62,-44 62,-44 30,-100 28,-100" fill="url(#roofSlate)" stroke="#303840" stroke-width="1.5"/>
    <!-- Roof tiles suggestion -->
    <line x1="-55" y1="-56" x2="50" y2="-56" stroke="#505860" stroke-width="1" opacity="0.5"/>
    <line x1="-46" y1="-68" x2="40" y2="-68" stroke="#505860" stroke-width="1" opacity="0.5"/>
    <line x1="-36" y1="-80" x2="32" y2="-80" stroke="#505860" stroke-width="1" opacity="0.5"/>
    <line x1="-24" y1="-92" x2="28" y2="-92" stroke="#505860" stroke-width="1" opacity="0.5"/>
    <!-- Eave -->
    <line x1="-62" y1="-44" x2="62" y2="-44" stroke="#282e34" stroke-width="2.5"/>
    <!-- Ridge cap -->
    <line x1="28" y1="-100" x2="30" y2="-100" stroke="#282e34" stroke-width="3"/>
  </g>

  <!-- Gold WOLF RESISTANT badge — top right corner -->
  <g transform="translate(218, 28)">
    <rect x="-38" y="-13" width="76" height="26" rx="13" fill="#d4a820" stroke="#b08010" stroke-width="1.5"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#3a2000" text-anchor="middle">WOLF RESISTANT</text>
    <text x="0" y="9" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#3a2000" text-anchor="middle">&#10003;</text>
  </g>
</svg>
