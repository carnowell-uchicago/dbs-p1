<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- White background — catalog photo style -->
  <rect width="280" height="200" fill="#ffffff"/>
  <!-- Floor shadow -->
  <ellipse cx="140" cy="178" rx="65" ry="8" fill="#e0e0e0"/>

  <defs>
    <linearGradient id="wallGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="50%" stop-color="#a0714f"/>
      <stop offset="100%" stop-color="#7a4f2e"/>
    </linearGradient>
    <linearGradient id="roofGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3518"/>
      <stop offset="100%" stop-color="#7a5030"/>
    </linearGradient>
  </defs>

  <g transform="translate(140,108)">
    <!-- Main wall body — gradient suggests 3D lit from left -->
    <rect x="-48" y="-36" width="96" height="72" rx="2" fill="url(#wallGrad2)" stroke="#5a3518" stroke-width="1.5"/>
    <!-- Vertical plank lines -->
    <line x1="-36" y1="-36" x2="-36" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="-24" y1="-36" x2="-24" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="-12" y1="-36" x2="-12" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="12" y1="-36" x2="12" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="24" y1="-36" x2="24" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>
    <line x1="36" y1="-36" x2="36" y2="36" stroke="#6b4020" stroke-width="1.2" opacity="0.7"/>

    <!-- Door -->
    <rect x="-12" y="8" width="24" height="28" rx="3" fill="#3d1f0a" stroke="#2a1000" stroke-width="1"/>
    <circle cx="9" cy="22" r="2" fill="#a07030"/>

    <!-- Window left -->
    <rect x="-40" y="-24" width="18" height="14" rx="1" fill="#b8d8e8" stroke="#3d1f0a" stroke-width="1"/>
    <line x1="-31" y1="-24" x2="-31" y2="-10" stroke="#3d1f0a" stroke-width="0.8"/>
    <line x1="-40" y1="-17" x2="-22" y2="-17" stroke="#3d1f0a" stroke-width="0.8"/>

    <!-- Window right -->
    <rect x="22" y="-24" width="18" height="14" rx="1" fill="#b8d8e8" stroke="#3d1f0a" stroke-width="1"/>
    <line x1="31" y1="-24" x2="31" y2="-10" stroke="#3d1f0a" stroke-width="0.8"/>
    <line x1="22" y1="-17" x2="40" y2="-17" stroke="#3d1f0a" stroke-width="0.8"/>

    <!-- Crossed-stick roof -->
    <polygon points="-56,-36 56,-36 0,-96" fill="url(#roofGrad2)" stroke="#3d1f0a" stroke-width="1.5"/>
    <!-- Diagonal stick lines -->
    <line x1="-50" y1="-40" x2="0" y2="-94" stroke="#6b3010" stroke-width="2" opacity="0.6"/>
    <line x1="-36" y1="-40" x2="2" y2="-94" stroke="#6b3010" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="-40" x2="4" y2="-94" stroke="#6b3010" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-40" x2="-4" y2="-94" stroke="#6b3010" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="-40" x2="-8" y2="-90" stroke="#6b3010" stroke-width="2" opacity="0.5"/>
    <line x1="36" y1="-40" x2="-14" y2="-86" stroke="#6b3010" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="-40" x2="-18" y2="-82" stroke="#6b3010" stroke-width="2" opacity="0.5"/>
    <!-- Horizontal banding -->
    <line x1="-45" y1="-52" x2="45" y2="-52" stroke="#4a2808" stroke-width="1.8" opacity="0.6"/>
    <line x1="-32" y1="-66" x2="32" y2="-66" stroke="#4a2808" stroke-width="1.8" opacity="0.6"/>
    <line x1="-18" y1="-80" x2="18" y2="-80" stroke="#4a2808" stroke-width="1.8" opacity="0.6"/>
    <!-- Ridge peak sticks crossed at top -->
    <line x1="-8" y1="-86" x2="8" y2="-96" stroke="#3d1f0a" stroke-width="2.5"/>
    <line x1="8" y1="-86" x2="-8" y2="-96" stroke="#3d1f0a" stroke-width="2.5"/>
    <!-- Eave line -->
    <line x1="-56" y1="-36" x2="56" y2="-36" stroke="#3d1f0a" stroke-width="2"/>
  </g>

  <!-- FORECLOSED stamp — bottom-right, 25-degree angle -->
  <g transform="translate(228,162) rotate(-25)">
    <rect x="-36" y="-12" width="72" height="24" rx="3" fill="none" stroke="#cc0000" stroke-width="2.5" opacity="0.85"/>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#cc0000" text-anchor="middle" opacity="0.85" letter-spacing="1">FORECLOSED</text>
  </g>
</svg>
