<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- White background -->
  <rect width="280" height="200" fill="#ffffff"/>
  <!-- Floor shadow -->
  <ellipse cx="140" cy="183" rx="55" ry="7" fill="#e8e8e8"/>

  <defs>
    <linearGradient id="wolfBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </radialGradient>
  </defs>

  <!-- Wolf figure, centered, cartoon-ish hardware product style -->
  <g transform="translate(140, 105)">
    <!-- Body torso -->
    <ellipse cx="0" cy="30" rx="34" ry="38" fill="url(#wolfBodyGrad)" stroke="#484848" stroke-width="1.5"/>

    <!-- Arms/paws -->
    <ellipse cx="-38" cy="28" rx="12" ry="8" fill="#808080" stroke="#484848" stroke-width="1" transform="rotate(-20,-38,28)"/>
    <ellipse cx="38" cy="28" rx="12" ry="8" fill="#808080" stroke="#484848" stroke-width="1" transform="rotate(20,38,28)"/>

    <!-- Neck -->
    <rect x="-14" y="-14" width="28" height="18" rx="4" fill="#888" stroke="#484848" stroke-width="1"/>

    <!-- Head -->
    <ellipse cx="0" cy="-28" rx="32" ry="28" fill="#909090" stroke="#484848" stroke-width="1.5"/>

    <!-- Ears - pointed -->
    <polygon points="-28,-48 -38,-82 -10,-58" fill="#808080" stroke="#484848" stroke-width="1.5"/>
    <polygon points="28,-48 38,-82 10,-58" fill="#808080" stroke="#484848" stroke-width="1.5"/>
    <!-- Inner ears -->
    <polygon points="-26,-50 -33,-74 -14,-60" fill="#c08090" opacity="0.6"/>
    <polygon points="26,-50 33,-74 14,-60" fill="#c08090" opacity="0.6"/>

    <!-- Eyes — red glowing -->
    <ellipse cx="-12" cy="-30" rx="7" ry="6" fill="url(#eyeGlow)" stroke="#880000" stroke-width="1"/>
    <ellipse cx="12" cy="-30" rx="7" ry="6" fill="url(#eyeGlow)" stroke="#880000" stroke-width="1"/>
    <!-- Pupils -->
    <ellipse cx="-12" cy="-30" rx="3" ry="4" fill="#220000"/>
    <ellipse cx="12" cy="-30" rx="3" ry="4" fill="#220000"/>
    <!-- Eye glints -->
    <circle cx="-10" cy="-32" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="14" cy="-32" r="1.5" fill="white" opacity="0.7"/>

    <!-- Snout -->
    <ellipse cx="0" cy="-14" rx="16" ry="12" fill="#a0a0a0" stroke="#606060" stroke-width="1"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-18" rx="7" ry="4" fill="#333"/>
    <!-- Mouth/snarl -->
    <path d="M -8,-8 Q 0,-4 8,-8" fill="none" stroke="#484848" stroke-width="1.5"/>
    <!-- Fang tips -->
    <polygon points="-4,-8 -7,-2 -1,-2" fill="white" stroke="#888" stroke-width="0.5"/>
    <polygon points="4,-8 7,-2 1,-2" fill="white" stroke="#888" stroke-width="0.5"/>

    <!-- Wind lines radiating from snout -->
    <line x1="20" y1="-10" x2="52" y2="-8" stroke="#aaa" stroke-width="1.5" opacity="0.6"/>
    <line x1="18" y1="-4" x2="50" y2="0" stroke="#aaa" stroke-width="1.2" opacity="0.5"/>
    <line x1="16" y1="2" x2="46" y2="8" stroke="#aaa" stroke-width="1" opacity="0.4"/>
    <line x1="-20" y1="-10" x2="-52" y2="-8" stroke="#aaa" stroke-width="1.5" opacity="0.6"/>
    <line x1="-18" y1="-4" x2="-50" y2="0" stroke="#aaa" stroke-width="1.2" opacity="0.5"/>
    <line x1="-16" y1="2" x2="-46" y2="8" stroke="#aaa" stroke-width="1" opacity="0.4"/>

    <!-- Tail -->
    <path d="M 30,50 Q 60,30 55,0 Q 58,-10 50,5" fill="#808080" stroke="#606060" stroke-width="1.5" fill-opacity="0"/>
    <path d="M 30,50 Q 58,25 52,0" fill="none" stroke="#808080" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30,50 Q 58,25 52,0" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- DISCONTINUED stamp — diagonal, over the wolf -->
  <g transform="translate(155, 95) rotate(-20)">
    <!-- Red box background -->
    <rect x="-52" y="-18" width="104" height="36" rx="4" fill="#cc0000" opacity="0.88"/>
    <!-- Circle + strike line overlay -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ff4444" stroke-width="3" opacity="0.6"/>
    <line x1="-24" y1="-20" x2="24" y2="20" stroke="#ff4444" stroke-width="3" opacity="0.6"/>
    <!-- Text -->
    <text x="0" y="-4" font-family="Arial Black, Impact, sans-serif" font-size="10" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1.5">DISCONTINUED</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="7.5" fill="#ffcccc" text-anchor="middle" letter-spacing="0.5">RECALL NOTICE #BB-2024</text>
  </g>
</svg>
