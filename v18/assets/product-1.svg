<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <!-- White background — catalog photo style -->
  <rect width="280" height="200" fill="#ffffff"/>
  <!-- Subtle floor shadow -->
  <ellipse cx="140" cy="178" rx="62" ry="8" fill="#e8e8e8"/>

  <!-- House sitting on invisible shelf, centered -->
  <g transform="translate(140,105)">
    <!-- Walls — golden yellow, slightly off-level for character -->
    <rect x="-44" y="-38" width="90" height="68" rx="2" fill="#f5e6b2" stroke="#c8a84b" stroke-width="1.5"/>
    <!-- Wall texture — horizontal plank suggestion -->
    <line x1="-44" y1="-20" x2="46" y2="-20" stroke="#ddd090" stroke-width="0.8" opacity="0.6"/>
    <line x1="-44" y1="-4" x2="46" y2="-4" stroke="#ddd090" stroke-width="0.8" opacity="0.6"/>
    <line x1="-44" y1="12" x2="46" y2="12" stroke="#ddd090" stroke-width="0.8" opacity="0.6"/>
    <line x1="-44" y1="26" x2="46" y2="26" stroke="#ddd090" stroke-width="0.8" opacity="0.6"/>

    <!-- Door -->
    <rect x="-8" y="10" width="18" height="20" rx="2" fill="#b8860b" stroke="#8B6914" stroke-width="1"/>
    <circle cx="7" cy="20" r="1.5" fill="#d4a017"/>

    <!-- Window left -->
    <rect x="-36" y="-28" width="14" height="12" rx="1" fill="#c8e8f8" stroke="#8B6914" stroke-width="1"/>
    <line x1="-29" y1="-28" x2="-29" y2="-16" stroke="#8B6914" stroke-width="0.7"/>
    <line x1="-36" y1="-22" x2="-22" y2="-22" stroke="#8B6914" stroke-width="0.7"/>

    <!-- Window right -->
    <rect x="22" y="-28" width="14" height="12" rx="1" fill="#c8e8f8" stroke="#8B6914" stroke-width="1"/>
    <line x1="29" y1="-28" x2="29" y2="-16" stroke="#8B6914" stroke-width="0.7"/>
    <line x1="22" y1="-22" x2="36" y2="-22" stroke="#8B6914" stroke-width="0.7"/>

    <!-- Thatched roof — wonky triangle -->
    <polygon points="-52,-38 47,-36 2,-88" fill="#c8960c" stroke="#a07010" stroke-width="1.5"/>
    <!-- Thatch texture lines (diagonal) -->
    <line x1="-42" y1="-48" x2="6" y2="-82" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="-30" y1="-42" x2="10" y2="-83" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="-18" y1="-38" x2="14" y2="-84" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="-6" y1="-37" x2="17" y2="-84" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="4" y1="-38" x2="19" y2="-83" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="14" y1="-38" x2="22" y2="-82" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="24" y1="-38" x2="33" y2="-68" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <line x1="32" y1="-38" x2="38" y2="-58" stroke="#e8b820" stroke-width="1.2" opacity="0.7"/>
    <!-- Horizontal thatch rows -->
    <line x1="-46" y1="-52" x2="38" y2="-52" stroke="#b08010" stroke-width="1.5" opacity="0.5"/>
    <line x1="-40" y1="-62" x2="28" y2="-62" stroke="#b08010" stroke-width="1.5" opacity="0.5"/>
    <line x1="-28" y1="-72" x2="18" y2="-72" stroke="#b08010" stroke-width="1.5" opacity="0.5"/>
    <!-- Eave line -->
    <line x1="-52" y1="-38" x2="47" y2="-36" stroke="#8B6000" stroke-width="2"/>
  </g>

  <!-- FORECLOSED stamp — bottom-right, 25-degree angle -->
  <g transform="translate(228,162) rotate(-25)">
    <rect x="-36" y="-12" width="72" height="24" rx="3" fill="none" stroke="#cc0000" stroke-width="2.5" opacity="0.85"/>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#cc0000" text-anchor="middle" opacity="0.85" letter-spacing="1">FORECLOSED</text>
  </g>
</svg>
