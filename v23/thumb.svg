<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Rockwell', 'Courier New', Georgia, serif">
  <defs>
    <pattern id="cork" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#8B6914"/>
      <circle cx="5" cy="5" r="2.5" fill="#7A5C0A" opacity="0.5"/>
      <circle cx="15" cy="13" r="2" fill="#9B7A1A" opacity="0.4"/>
      <circle cx="10" cy="10" r="1.5" fill="#6A4C0A" opacity="0.3"/>
    </pattern>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Cork background -->
  <rect width="800" height="600" fill="url(#cork)"/>
  <rect width="800" height="600" fill="#7A5800" opacity="0.3"/>

  <!-- Gazette header (top-left, slight tilt) -->
  <g transform="translate(30, 30) rotate(-2)">
    <rect width="220" height="110" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="1.5" filter="url(#paper)"/>
    <rect x="5" y="5" width="210" height="100" rx="1" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="110" y="30" font-size="11" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="3">SWINE VALLEY GAZETTE</text>
    <line x1="10" y1="35" x2="210" y2="35" stroke="#3D1F00" stroke-width="0.8"/>
    <text x="110" y="48" font-size="8" fill="#5C3A1E" text-anchor="middle" letter-spacing="1">EST. 1849 · VOL. XXIII</text>
    <text x="110" y="65" font-size="9" fill="#3D1F00" text-anchor="middle">THREE PIGS SEEK SHELTER</text>
    <text x="110" y="78" font-size="7" fill="#5C3A1E" text-anchor="middle">Wolf activity reported in valley</text>
    <circle cx="110" cy="4" r="5" fill="#CC2200"/>
  </g>

  <!-- Pig 1 notice (left, rotated) -->
  <g transform="translate(20, 180) rotate(-3)">
    <rect width="180" height="230" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="1.5"/>
    <rect x="5" y="5" width="170" height="220" rx="1" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="90" y="24" font-size="10" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="2">PROPERTY NOTICE</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#3D1F00" stroke-width="0.7"/>
    <text x="90" y="42" font-size="8" fill="#5C3A1E" text-anchor="middle">STRAW HOMESTEAD</text>
    <text x="90" y="54" font-size="7" fill="#5C3A1E" text-anchor="middle">Claim No. 001</text>
    <!-- Simple straw house sketch -->
    <polygon points="90,75 55,105 125,105" fill="none" stroke="#3D1F00" stroke-width="1.2"/>
    <rect x="60" y="105" width="60" height="50" fill="none" stroke="#3D1F00" stroke-width="1.2"/>
    <line x1="60" y1="115" x2="120" y2="115" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="60" y1="125" x2="120" y2="125" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="60" y1="135" x2="120" y2="135" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="90" y="175" font-size="7" fill="#3D1F00" text-anchor="middle">Percival Snout, Prop.</text>
    <!-- CONDEMNED stamp overlay -->
    <g transform="rotate(-15, 90, 115)">
      <rect x="25" y="105" width="130" height="35" rx="4" fill="none" stroke="#8B0000" stroke-width="3" opacity="0.85"/>
      <text x="90" y="128" font-size="18" font-weight="900" fill="#8B0000" text-anchor="middle" opacity="0.85" letter-spacing="2">CONDEMNED</text>
    </g>
    <circle cx="90" cy="4" r="5" fill="#CC2200"/>
  </g>

  <!-- WANTED poster - center, prominent, straight -->
  <g transform="translate(270, 60)">
    <rect width="240" height="340" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="2.5"/>
    <rect x="7" y="7" width="226" height="326" rx="1" fill="none" stroke="#3D1F00" stroke-width="1"/>
    <text x="120" y="42" font-size="28" font-weight="900" fill="#3D1F00" text-anchor="middle" letter-spacing="4">WANTED</text>
    <text x="120" y="60" font-size="13" font-weight="bold" fill="#8B0000" text-anchor="middle" letter-spacing="2">DEAD OR ALIVE</text>
    <line x1="20" y1="66" x2="220" y2="66" stroke="#3D1F00" stroke-width="1.2"/>
    <!-- Wolf portrait box -->
    <rect x="40" y="72" width="160" height="155" fill="#E8D5A8" stroke="#3D1F00" stroke-width="1.5"/>
    <!-- Wolf face -->
    <ellipse cx="120" cy="145" rx="60" ry="55" fill="#D4B896" stroke="#3D1F00" stroke-width="1.5"/>
    <polygon points="80,105 70,78 95,100" fill="#C4A882" stroke="#3D1F00" stroke-width="1"/>
    <polygon points="160,105 170,78 145,100" fill="#C4A882" stroke="#3D1F00" stroke-width="1"/>
    <ellipse cx="103" cy="138" rx="8" ry="10" fill="white" stroke="#3D1F00" stroke-width="1"/>
    <ellipse cx="137" cy="138" rx="8" ry="10" fill="white" stroke="#3D1F00" stroke-width="1"/>
    <ellipse cx="105" cy="140" rx="4" ry="6" fill="#1a1a1a"/>
    <ellipse cx="139" cy="140" rx="4" ry="6" fill="#1a1a1a"/>
    <ellipse cx="120" cy="158" rx="12" ry="8" fill="#C4A882" stroke="#3D1F00" stroke-width="1"/>
    <path d="M 100,170 Q 120,185 140,170" fill="none" stroke="#3D1F00" stroke-width="1.5"/>
    <line x1="102" y1="170" x2="98" y2="176" stroke="#3D1F00" stroke-width="1"/>
    <line x1="112" y1="174" x2="110" y2="180" stroke="#3D1F00" stroke-width="1"/>
    <line x1="128" y1="174" x2="130" y2="180" stroke="#3D1F00" stroke-width="1"/>
    <line x1="138" y1="170" x2="142" y2="176" stroke="#3D1F00" stroke-width="1"/>
    <line x1="120" y1="220" x2="120" y2="232" stroke="#3D1F00" stroke-width="1.5"/>
    <text x="120" y="250" font-size="16" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="1">B.B. WOLF</text>
    <text x="120" y="265" font-size="9" font-style="italic" fill="#5C3A1E" text-anchor="middle">Canis lupus hufficus</text>
    <rect x="55" y="275" width="130" height="28" rx="2" fill="#3D1F00"/>
    <text x="120" y="285" font-size="9" fill="#F5E6C8" text-anchor="middle" letter-spacing="1">BOUNTY</text>
    <text x="120" y="298" font-size="13" font-weight="bold" fill="#B8860B" text-anchor="middle">$500</text>
    <text x="120" y="320" font-size="7" fill="#5C3A1E" text-anchor="middle">Unreasonable Lung Capacity</text>
    <circle cx="120" cy="4" r="6" fill="#B8860B" stroke="#7A5C00" stroke-width="1"/>
  </g>

  <!-- Pig 2 notice (right of wanted, slight tilt) -->
  <g transform="translate(540, 50) rotate(3)">
    <rect width="180" height="220" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="1.5"/>
    <rect x="5" y="5" width="170" height="210" rx="1" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="90" y="24" font-size="10" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="2">PROPERTY NOTICE</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#3D1F00" stroke-width="0.7"/>
    <text x="90" y="42" font-size="8" fill="#5C3A1E" text-anchor="middle">STICK HOMESTEAD</text>
    <text x="90" y="54" font-size="7" fill="#5C3A1E" text-anchor="middle">Claim No. 002</text>
    <polygon points="90,72 55,100 125,100" fill="none" stroke="#3D1F00" stroke-width="1.2"/>
    <rect x="60" y="100" width="60" height="45" fill="none" stroke="#3D1F00" stroke-width="1.2"/>
    <line x1="60" y1="100" x2="120" y2="145" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="120" y1="100" x2="60" y2="145" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="90" y="165" font-size="7" fill="#3D1F00" text-anchor="middle">Barnabas Hoof, Prop.</text>
    <g transform="rotate(-15, 90, 108)">
      <rect x="15" y="98" width="150" height="32" rx="4" fill="none" stroke="#8B0000" stroke-width="3" opacity="0.85"/>
      <text x="90" y="119" font-size="16" font-weight="900" fill="#8B0000" text-anchor="middle" opacity="0.85" letter-spacing="2">CONDEMNED</text>
    </g>
    <circle cx="90" cy="4" r="5" fill="#CC2200"/>
  </g>

  <!-- Incident report (bottom-right, tilt) -->
  <g transform="translate(555, 310) rotate(2)">
    <rect width="200" height="170" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="1.5"/>
    <rect x="5" y="5" width="190" height="160" rx="1" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="100" y="24" font-size="9" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="2">INCIDENT REPORT</text>
    <text x="100" y="36" font-size="7" fill="#5C3A1E" text-anchor="middle">Sheriff's Office · Report No. 114–115</text>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="15" y="56" font-size="7" fill="#3D1F00">Called to scene of Snout residence.</text>
    <text x="15" y="68" font-size="7" fill="#3D1F00">Structure had achieved horizontal</text>
    <text x="15" y="80" font-size="7" fill="#3D1F00">configuration. Owner retrieved.</text>
    <text x="15" y="96" font-size="7" fill="#3D1F00">Called to scene of Hoof residence.</text>
    <text x="15" y="108" font-size="7" fill="#3D1F00">Structure: ditto. Both parties now</text>
    <text x="15" y="120" font-size="7" fill="#3D1F00">sheltering at Bristle property.</text>
    <text x="15" y="140" font-size="7" fill="#5C3A1E">Signed: Sheriff Hamhock</text>
    <circle cx="100" cy="4" r="5" fill="#CC2200"/>
  </g>

  <!-- All Clear (bottom-left) -->
  <g transform="translate(220, 440) rotate(-2)">
    <rect width="200" height="120" rx="2" fill="#F5E6C8" stroke="#3D1F00" stroke-width="1.5"/>
    <rect x="5" y="5" width="190" height="110" rx="1" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
    <text x="100" y="26" font-size="11" font-weight="bold" fill="#3D1F00" text-anchor="middle" letter-spacing="2">ALL CLEAR</text>
    <line x1="10" y1="30" x2="190" y2="30" stroke="#3D1F00" stroke-width="0.7"/>
    <text x="100" y="48" font-size="7.5" fill="#3D1F00" text-anchor="middle">Wolf has retreated. All three pigs</text>
    <text x="100" y="62" font-size="7.5" fill="#3D1F00" text-anchor="middle">confirmed safe in Bristle residence.</text>
    <text x="100" y="76" font-size="7.5" fill="#5C3A1E" text-anchor="middle">Case closed pending follow-up re:</text>
    <text x="100" y="90" font-size="7.5" fill="#5C3A1E" text-anchor="middle">deviated septum claims.</text>
    <text x="100" y="108" font-size="7" fill="#B8860B" text-anchor="middle">★ Sheriff Hamhock ★</text>
    <circle cx="100" cy="4" r="5" fill="#CC2200"/>
  </g>

  <!-- Navigation hint -->
  <text x="400" y="585" font-size="11" fill="#F5E6C8" text-anchor="middle" opacity="0.7">Dispatch 1 of 7   ←  →</text>
</svg>
