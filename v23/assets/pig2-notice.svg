<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360">
  <defs>
    <filter id="paper-tex2">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncR type="linear" slope="0.96" intercept="0.03"/>
        <feFuncG type="linear" slope="0.93" intercept="0.05"/>
        <feFuncB type="linear" slope="0.86" intercept="0.04"/>
      </feComponentTransfer>
    </filter>
    <filter id="ink-rough2">
      <feTurbulence type="turbulence" baseFrequency="0.038" numOctaves="2" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Aged paper background -->
  <rect width="280" height="360" fill="#F5E6C8" filter="url(#paper-tex2)"/>
  <!-- Aging stains - slightly different placement -->
  <ellipse cx="240" cy="50" rx="28" ry="20" fill="#C8A96E" opacity="0.14"/>
  <ellipse cx="40" cy="310" rx="24" ry="17" fill="#BFA060" opacity="0.13"/>

  <!-- Outer border -->
  <rect x="8" y="8" width="264" height="344" fill="none" stroke="#3D1F00" stroke-width="2.5"/>
  <rect x="13" y="13" width="254" height="334" fill="none" stroke="#3D1F00" stroke-width="1"/>

  <!-- Corner ornaments -->
  <line x1="8" y1="24" x2="18" y2="24" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="24" y1="8" x2="24" y2="18" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="272" y1="24" x2="262" y2="24" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="256" y1="8" x2="256" y2="18" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="8" y1="336" x2="18" y2="336" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="24" y1="352" x2="24" y2="342" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="272" y1="336" x2="262" y2="336" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="256" y1="352" x2="256" y2="342" stroke="#3D1F00" stroke-width="1.5"/>

  <!-- Header ornament - decorative divider -->
  <line x1="25" y1="35" x2="255" y2="35" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="25" y1="38" x2="255" y2="38" stroke="#3D1F00" stroke-width="0.75"/>
  <circle cx="50" cy="36.5" r="3" fill="#3D1F00"/>
  <polygon points="140,32 144,36.5 140,41 136,36.5" fill="#3D1F00"/>
  <circle cx="230" cy="36.5" r="3" fill="#3D1F00"/>

  <!-- PROPERTY NOTICE header -->
  <text x="140" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3D1F00" letter-spacing="3" filter="url(#ink-rough2)">PROPERTY NOTICE</text>

  <!-- Registry line -->
  <text x="140" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="9" text-anchor="middle" fill="#5A3010">Swine Valley Land Registry · Claim No. 002</text>

  <!-- Divider -->
  <line x1="30" y1="84" x2="250" y2="84" stroke="#3D1F00" stroke-width="1"/>

  <!-- Property description box -->
  <rect x="25" y="92" width="230" height="100" fill="#EDD9A3" stroke="#3D1F00" stroke-width="1.5"/>
  <rect x="28" y="95" width="224" height="94" fill="none" stroke="#3D1F00" stroke-width="0.5"/>
  <text x="140" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3D1F00">STICK HOMESTEAD</text>
  <text x="140" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" text-anchor="middle" fill="#3D1F00">Semi-permanent · Load-bearing: Debatable</text>
  <text x="140" y="139" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" text-anchor="middle" fill="#3D1F00">Ventilation: Excessive</text>
  <text x="140" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" text-anchor="middle" fill="#5A3010">Wolf resistance: Unverified</text>
  <line x1="40" y1="160" x2="240" y2="160" stroke="#3D1F00" stroke-width="0.75"/>
  <text x="140" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" font-style="italic" text-anchor="middle" fill="#3D1F00">Owner: Barnabas Hoof, Proprietor</text>

  <!-- Stick-frame house sketch -->
  <g transform="translate(65, 198)">
    <!-- Ground line -->
    <line x1="0" y1="88" x2="148" y2="88" stroke="#3D1F00" stroke-width="1.5"/>
    <!-- House walls - stick frame style with diagonal lines -->
    <rect x="15" y="30" width="120" height="58" fill="#EDD9A3" stroke="#3D1F00" stroke-width="1.5"/>
    <!-- Diagonal bracing lines on walls (stick frame) -->
    <line x1="15" y1="30" x2="75" y2="88" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="75" y1="30" x2="135" y2="88" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="75" y1="30" x2="15" y2="88" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="135" y1="30" x2="75" y2="88" stroke="#3D1F00" stroke-width="0.75"/>
    <!-- Vertical supports -->
    <line x1="40" y1="30" x2="40" y2="88" stroke="#3D1F00" stroke-width="1"/>
    <line x1="75" y1="30" x2="75" y2="88" stroke="#3D1F00" stroke-width="1"/>
    <line x1="110" y1="30" x2="110" y2="88" stroke="#3D1F00" stroke-width="1"/>
    <!-- Horizontal rails -->
    <line x1="15" y1="55" x2="135" y2="55" stroke="#3D1F00" stroke-width="1"/>
    <!-- Roof - gabled, simple triangles -->
    <polygon points="8,30 75,4 142,30" fill="#EDD9A3" stroke="#3D1F00" stroke-width="1.5"/>
    <!-- Roof stick lines -->
    <line x1="8" y1="30" x2="75" y2="4" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="75" y1="4" x2="142" y2="30" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="30" y1="27" x2="75" y2="7" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="55" y1="23" x2="75" y2="6" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="75" y1="6" x2="95" y2="23" stroke="#3D1F00" stroke-width="0.5"/>
    <line x1="75" y1="7" x2="120" y2="27" stroke="#3D1F00" stroke-width="0.5"/>
    <!-- Door -->
    <rect x="59" y="60" width="28" height="28" rx="2" fill="none" stroke="#3D1F00" stroke-width="1.5"/>
    <!-- Window left -->
    <rect x="22" y="38" width="22" height="18" rx="1" fill="none" stroke="#3D1F00" stroke-width="1"/>
    <line x1="33" y1="38" x2="33" y2="56" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="22" y1="47" x2="44" y2="47" stroke="#3D1F00" stroke-width="0.75"/>
    <!-- Window right -->
    <rect x="98" y="38" width="22" height="18" rx="1" fill="none" stroke="#3D1F00" stroke-width="1"/>
    <line x1="109" y1="38" x2="109" y2="56" stroke="#3D1F00" stroke-width="0.75"/>
    <line x1="98" y1="47" x2="120" y2="47" stroke="#3D1F00" stroke-width="0.75"/>
  </g>

  <!-- Official seal -->
  <circle cx="140" cy="320" r="22" fill="none" stroke="#3D1F00" stroke-width="1.5"/>
  <circle cx="140" cy="320" r="18" fill="none" stroke="#3D1F00" stroke-width="0.75"/>
  <!-- Star in seal -->
  <polygon points="140,304 143,314 154,314 145,320 148,331 140,325 132,331 135,320 126,314 137,314" fill="#3D1F00" opacity="0.7"/>
  <text x="140" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="6" text-anchor="middle" fill="#3D1F00">SWINE VALLEY · EST. 1849</text>

  <!-- Footer text -->
  <text x="140" y="351" font-family="Georgia, 'Times New Roman', serif" font-size="6.5" font-style="italic" text-anchor="middle" fill="#5A3010">Registered in good faith. Valley takes no responsibility for structural integrity.</text>
</svg>
