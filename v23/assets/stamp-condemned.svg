<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <defs>
    <!-- Turbulence for rubber stamp distress effect -->
    <filter id="stamp-distress" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.065" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <!-- Add ink bleed / spread -->
      <feMorphology operator="dilate" radius="0.4" in="displaced" result="spread"/>
      <!-- Erode some ink for worn look -->
      <feMorphology operator="erode" radius="0.2" in="spread" result="worn"/>
      <feComposite in="worn" in2="SourceGraphic" operator="over"/>
    </filter>
    <!-- Subtle noise overlay for ink texture -->
    <filter id="ink-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Transparent background (no rect fill) -->

  <!-- Stamp border + text group with distress filter -->
  <g filter="url(#stamp-distress)">
    <!-- Outer rounded rect border - thick red stamp border -->
    <rect x="5" y="5" width="190" height="70" rx="8" ry="8" fill="none" stroke="#8B0000" stroke-width="5" opacity="0.92"/>
    <!-- Inner border line -->
    <rect x="10" y="10" width="180" height="60" rx="5" ry="5" fill="none" stroke="#8B0000" stroke-width="1.5" opacity="0.75"/>

    <!-- CONDEMNED text - bold, large, letterpress look -->
    <text
      x="100"
      y="54"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="42"
      font-weight="bold"
      text-anchor="middle"
      fill="#8B0000"
      letter-spacing="3"
      opacity="0.95"
    >CONDEMNED</text>
  </g>

  <!-- Additional ink grain overlay for texture -->
  <g filter="url(#ink-grain)" opacity="0.12">
    <rect x="5" y="5" width="190" height="70" rx="8" fill="#8B0000"/>
  </g>

  <!-- Ink bleeding dots / imperfection accents (hand-printed look) -->
  <circle cx="15" cy="15" r="1.5" fill="#8B0000" opacity="0.5"/>
  <circle cx="185" cy="15" r="1.2" fill="#8B0000" opacity="0.45"/>
  <circle cx="12" cy="65" r="1.8" fill="#8B0000" opacity="0.4"/>
  <circle cx="188" cy="67" r="1.3" fill="#8B0000" opacity="0.5"/>
  <!-- Small ink splatter dots near the text -->
  <circle cx="22" cy="40" r="0.8" fill="#8B0000" opacity="0.35"/>
  <circle cx="178" cy="38" r="1" fill="#8B0000" opacity="0.3"/>
  <circle cx="100" cy="8" r="0.7" fill="#8B0000" opacity="0.4"/>
</svg>
