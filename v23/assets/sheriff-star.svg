<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="badge-shine">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="brass-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="45%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7A5C00"/>
    </radialGradient>
    <radialGradient id="brass-center" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C8960D"/>
      <stop offset="100%" stop-color="#8A6800"/>
    </radialGradient>
  </defs>

  <!-- Background shadow/depth -->
  <g transform="translate(62,62)">
    <!-- 6-point star shadow -->
    <polygon points="0,-54 10,-19 44,-19 17,4 27,40 0,20 -27,40 -17,4 -44,-19 -10,-19" fill="#3A2800" opacity="0.25" transform="translate(2,2)"/>
  </g>

  <!-- 6-point star - main shape using two overlapping triangles -->
  <g transform="translate(60,60)">
    <!-- Triangle 1 pointing up -->
    <polygon points="0,-54 47,27 -47,27" fill="url(#brass-grad)" stroke="#7A5C00" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Triangle 2 pointing down -->
    <polygon points="0,54 47,-27 -47,-27" fill="url(#brass-grad)" stroke="#7A5C00" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Overlap center cleanup: fill center in brass -->
    <polygon points="0,-27 23.4,13.5 -23.4,13.5" fill="url(#brass-grad)"/>
    <polygon points="0,27 23.4,-13.5 -23.4,-13.5" fill="url(#brass-grad)"/>

    <!-- Inner highlight lines for 3D effect -->
    <!-- Point tips get subtle lighter edge -->
    <polygon points="0,-54 47,27 -47,27" fill="none" stroke="#D4A017" stroke-width="0.75" opacity="0.6"/>
    <polygon points="0,54 47,-27 -47,-27" fill="none" stroke="#D4A017" stroke-width="0.75" opacity="0.6"/>

    <!-- Small decorative dots between each point (6 dots at compass positions between points) -->
    <!-- At ~30°, 90°, 150°, 210°, 270°, 330° — i.e., between the 6 tips -->
    <circle cx="28" cy="-16" r="3" fill="#7A5C00"/>
    <circle cx="28" cy="16" r="3" fill="#7A5C00"/>
    <circle cx="0" cy="32" r="3" fill="#7A5C00"/>
    <circle cx="-28" cy="16" r="3" fill="#7A5C00"/>
    <circle cx="-28" cy="-16" r="3" fill="#7A5C00"/>
    <circle cx="0" cy="-32" r="3" fill="#7A5C00"/>
    <!-- Dot accent ring -->
    <circle cx="28" cy="-16" r="1.5" fill="#D4A017"/>
    <circle cx="28" cy="16" r="1.5" fill="#D4A017"/>
    <circle cx="0" cy="32" r="1.5" fill="#D4A017"/>
    <circle cx="-28" cy="16" r="1.5" fill="#D4A017"/>
    <circle cx="-28" cy="-16" r="1.5" fill="#D4A017"/>
    <circle cx="0" cy="-32" r="1.5" fill="#D4A017"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="22" fill="url(#brass-center)" stroke="#7A5C00" stroke-width="2"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#D4A017" stroke-width="0.75" opacity="0.8"/>
    <!-- SHERIFF text in circle -->
    <text x="0" y="5" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#3D1F00" letter-spacing="1">SHERIFF</text>

    <!-- Shine / highlight on badge surface -->
    <ellipse cx="-8" cy="-14" rx="12" ry="7" fill="#D4A017" opacity="0.18" transform="rotate(-30)"/>
  </g>
</svg>
