<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncR type="linear" slope="0.95" intercept="0.04"/>
        <feFuncG type="linear" slope="0.92" intercept="0.06"/>
        <feFuncB type="linear" slope="0.85" intercept="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="ink-roughness">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Aged paper background -->
  <rect width="300" height="420" fill="#F5E6C8" filter="url(#paper-texture)"/>
  <!-- Subtle aging stains -->
  <ellipse cx="40" cy="60" rx="30" ry="20" fill="#C8A96E" opacity="0.18"/>
  <ellipse cx="260" cy="380" rx="25" ry="18" fill="#C8A96E" opacity="0.15"/>
  <ellipse cx="150" cy="210" rx="40" ry="30" fill="#D4B87A" opacity="0.08"/>

  <!-- Outer border - double line frame -->
  <rect x="8" y="8" width="284" height="404" fill="none" stroke="#3D1F00" stroke-width="3"/>
  <rect x="14" y="14" width="272" height="392" fill="none" stroke="#3D1F00" stroke-width="1.5"/>

  <!-- Corner ornaments -->
  <!-- Top-left -->
  <line x1="8" y1="30" x2="20" y2="30" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="30" y1="8" x2="30" y2="20" stroke="#3D1F00" stroke-width="1.5"/>
  <rect x="18" y="18" width="8" height="8" fill="#3D1F00"/>
  <!-- Top-right -->
  <line x1="292" y1="30" x2="280" y2="30" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="270" y1="8" x2="270" y2="20" stroke="#3D1F00" stroke-width="1.5"/>
  <rect x="274" y="18" width="8" height="8" fill="#3D1F00"/>
  <!-- Bottom-left -->
  <line x1="8" y1="390" x2="20" y2="390" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="30" y1="412" x2="30" y2="400" stroke="#3D1F00" stroke-width="1.5"/>
  <rect x="18" y="394" width="8" height="8" fill="#3D1F00"/>
  <!-- Bottom-right -->
  <line x1="292" y1="390" x2="280" y2="390" stroke="#3D1F00" stroke-width="1.5"/>
  <line x1="270" y1="412" x2="270" y2="400" stroke="#3D1F00" stroke-width="1.5"/>
  <rect x="274" y="394" width="8" height="8" fill="#3D1F00"/>

  <!-- WANTED text -->
  <text x="150" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#3D1F00" letter-spacing="8" filter="url(#ink-roughness)">WANTED</text>

  <!-- Decorative divider -->
  <line x1="30" y1="66" x2="270" y2="66" stroke="#3D1F00" stroke-width="1.5"/>
  <circle cx="150" cy="66" r="3" fill="#3D1F00"/>

  <!-- DEAD OR ALIVE -->
  <text x="150" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#8B0000" letter-spacing="4">DEAD OR ALIVE</text>

  <!-- Portrait box background -->
  <rect x="60" y="92" width="180" height="175" fill="#EDD9A3" stroke="#3D1F00" stroke-width="2"/>
  <rect x="63" y="95" width="174" height="169" fill="none" stroke="#3D1F00" stroke-width="0.75"/>

  <!-- Wolf face portrait - line art -->
  <!-- Head / face oval -->
  <ellipse cx="150" cy="175" rx="68" ry="72" fill="#EDD9A3" stroke="#3D1F00" stroke-width="2"/>
  <!-- Fur texture lines on face -->
  <path d="M120,130 Q118,125 116,122" stroke="#3D1F00" stroke-width="1" fill="none"/>
  <path d="M130,125 Q129,120 127,117" stroke="#3D1F00" stroke-width="1" fill="none"/>
  <path d="M170,125 Q171,120 173,117" stroke="#3D1F00" stroke-width="1" fill="none"/>
  <path d="M180,130 Q182,125 184,122" stroke="#3D1F00" stroke-width="1" fill="none"/>

  <!-- Left ear -->
  <polygon points="100,140 88,98 118,128" fill="#EDD9A3" stroke="#3D1F00" stroke-width="2"/>
  <polygon points="103,137 93,107 115,130" fill="#C8A070" stroke="none"/>
  <!-- Right ear -->
  <polygon points="200,140 212,98 182,128" fill="#EDD9A3" stroke="#3D1F00" stroke-width="2"/>
  <polygon points="197,137 207,107 185,130" fill="#C8A070" stroke="none"/>

  <!-- Eyes - narrow, menacing -->
  <ellipse cx="128" cy="158" rx="14" ry="7" fill="#2A1800" stroke="#3D1F00" stroke-width="1.5"/>
  <ellipse cx="172" cy="158" rx="14" ry="7" fill="#2A1800" stroke="#3D1F00" stroke-width="1.5"/>
  <!-- Eye pupils -->
  <ellipse cx="129" cy="158" rx="5" ry="5" fill="#1A0A00"/>
  <ellipse cx="173" cy="158" rx="5" ry="5" fill="#1A0A00"/>
  <!-- Eye shine -->
  <circle cx="131" cy="156" r="1.5" fill="#F5E6C8" opacity="0.6"/>
  <circle cx="175" cy="156" r="1.5" fill="#F5E6C8" opacity="0.6"/>
  <!-- Angry brow lines -->
  <line x1="114" y1="147" x2="142" y2="152" stroke="#3D1F00" stroke-width="2.5"/>
  <line x1="186" y1="147" x2="158" y2="152" stroke="#3D1F00" stroke-width="2.5"/>

  <!-- Snout / muzzle -->
  <ellipse cx="150" cy="188" rx="30" ry="22" fill="#D4B87A" stroke="#3D1F00" stroke-width="1.5"/>
  <!-- Nostrils -->
  <ellipse cx="141" cy="182" rx="5" ry="4" fill="#3D1F00"/>
  <ellipse cx="159" cy="182" rx="5" ry="4" fill="#3D1F00"/>
  <!-- Mouth / snarl -->
  <path d="M128,194 Q150,200 172,194" stroke="#3D1F00" stroke-width="1.5" fill="none"/>
  <!-- Teeth showing -->
  <rect x="133" y="195" width="10" height="8" rx="1" fill="#F5F0E8" stroke="#3D1F00" stroke-width="1"/>
  <rect x="146" y="195" width="8" height="9" rx="1" fill="#F5F0E8" stroke="#3D1F00" stroke-width="1"/>
  <rect x="157" y="195" width="10" height="8" rx="1" fill="#F5F0E8" stroke="#3D1F00" stroke-width="1"/>

  <!-- Fur details on chin -->
  <path d="M135,210 Q150,215 165,210" stroke="#3D1F00" stroke-width="1" fill="none"/>
  <path d="M140,218 Q150,222 160,218" stroke="#3D1F00" stroke-width="1" fill="none"/>

  <!-- Name below portrait -->
  <text x="150" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#3D1F00" letter-spacing="5" filter="url(#ink-roughness)">B.B. WOLF</text>

  <!-- Species italic -->
  <text x="150" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" text-anchor="middle" fill="#5A3010">Canis lupus hufficus</text>

  <!-- Divider -->
  <line x1="50" y1="308" x2="250" y2="308" stroke="#3D1F00" stroke-width="1"/>

  <!-- Bounty box -->
  <rect x="70" y="313" width="160" height="32" fill="none" stroke="#3D1F00" stroke-width="2"/>
  <rect x="73" y="316" width="154" height="26" fill="none" stroke="#3D1F00" stroke-width="0.75"/>
  <text x="150" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#3D1F00" letter-spacing="3">BOUNTY: $500</text>

  <!-- Crimes list -->
  <text x="150" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" text-anchor="middle" fill="#3D1F00">For: Criminal Huffing · Malicious Puffing · Destruction of</text>
  <text x="150" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" text-anchor="middle" fill="#3D1F00">Residential Architecture (×2) · Unreasonable Lung Capacity</text>

  <!-- Divider -->
  <line x1="30" y1="376" x2="270" y2="376" stroke="#3D1F00" stroke-width="1"/>

  <!-- Footer -->
  <text x="150" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" text-anchor="middle" fill="#3D1F00">Contact: Sheriff's Office, Swine Valley</text>
  <text x="150" y="403" font-family="Georgia, 'Times New Roman', serif" font-size="7" text-anchor="middle" fill="#5A3010">By order of the Territorial Marshal · Reward paid on positive identification</text>
</svg>
