<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="1024" height="4" patternUnits="userSpaceOnUse">
      <rect width="1024" height="2" fill="rgba(0,0,0,0)" y="0"/>
      <rect width="1024" height="2" fill="rgba(0,0,0,0.18)" y="2"/>
    </pattern>
  </defs>

  <!-- Body background -->
  <rect width="1024" height="768" fill="#0a0a1a"/>

  <!-- CRT bezel -->
  <rect x="162" y="72" width="700" height="576" rx="0" fill="#222233" stroke="#444455" stroke-width="8"/>
  <rect x="162" y="72" width="700" height="576" fill="none" stroke="#111122" stroke-width="2"/>

  <!-- CRT screen inset shadow -->
  <rect x="170" y="80" width="684" height="560" fill="#000010"/>

  <!-- CRT glow -->
  <rect x="170" y="80" width="684" height="560" fill="#00aaff" opacity="0.04"/>

  <!-- Title top bar -->
  <rect x="170" y="80" width="684" height="36" fill="#1a1a2e"/>
  <line x1="170" y1="116" x2="854" y2="116" stroke="#ffff00" stroke-width="3"/>
  <line x1="170" y1="80" x2="854" y2="80" stroke="#ffff00" stroke-width="3"/>
  <text x="512" y="104" text-anchor="middle" fill="#ffff00" font-family="monospace" font-size="14" letter-spacing="3">MEADOW SOFT © 1985</text>

  <!-- CRT screen content -->
  <rect x="170" y="119" width="684" height="521" fill="#1a1a2e"/>

  <!-- Main title text -->
  <text x="512" y="238" text-anchor="middle" fill="#ffff00" font-family="monospace" font-size="42" font-weight="bold" letter-spacing="4">THREE LITTLE</text>
  <text x="512" y="292" text-anchor="middle" fill="#ffff00" font-family="monospace" font-size="42" font-weight="bold" letter-spacing="4">PIGS</text>

  <!-- Subtitle -->
  <text x="512" y="334" text-anchor="middle" fill="#00ffff" font-family="monospace" font-size="14" letter-spacing="3">THE OFFICIAL ADVENTURE</text>

  <!-- Pixel pig sprite (CSS grid-style) -->
  <g transform="translate(462, 360)">
    <!-- Pig head -->
    <rect x="20" y="0" width="60" height="50" fill="#ffaaaa" rx="4"/>
    <!-- Eyes -->
    <rect x="30" y="12" width="10" height="10" fill="#000"/>
    <rect x="60" y="12" width="10" height="10" fill="#000"/>
    <!-- Snout -->
    <rect x="35" y="28" width="30" height="16" fill="#ff8888" rx="3"/>
    <rect x="41" y="32" width="8" height="8" fill="#000" rx="1"/>
    <rect x="51" y="32" width="8" height="8" fill="#000" rx="1"/>
    <!-- Body -->
    <rect x="10" y="50" width="80" height="50" fill="#ffaaaa" rx="3"/>
    <!-- Arms -->
    <rect x="-10" y="54" width="20" height="8" fill="#ffaaaa"/>
    <rect x="90" y="54" width="20" height="8" fill="#ffaaaa"/>
    <!-- Legs -->
    <rect x="18" y="100" width="18" height="22" fill="#ffaaaa"/>
    <rect x="64" y="100" width="18" height="22" fill="#ffaaaa"/>
  </g>

  <!-- "PRESS START" blinking text -->
  <text x="512" y="538" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" letter-spacing="4">PRESS START</text>

  <!-- Bottom HP bar style nav -->
  <rect x="186" y="566" width="652" height="2" fill="#ffff00" opacity="0.3"/>
  <text x="210" y="586" fill="#00ff41" font-family="monospace" font-size="13" letter-spacing="2">[◄ BACK]</text>
  <text x="512" y="586" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">SCREEN 1 / 8</text>
  <text x="814" y="586" text-anchor="end" fill="#00ff41" font-family="monospace" font-size="13" letter-spacing="2">[NEXT ►]</text>

  <!-- Gallery link style -->
  <text x="186" y="606" fill="#ffff00" font-family="monospace" font-size="12" letter-spacing="1" opacity="0.7">[← GALLERY]</text>

  <!-- Scanlines overlay -->
  <rect x="170" y="80" width="684" height="560" fill="url(#scanlines)" opacity="0.5"/>

  <!-- CRT outer glow -->
  <rect x="162" y="72" width="700" height="576" fill="none" stroke="#00aaff" stroke-width="1" opacity="0.2"/>
</svg>
