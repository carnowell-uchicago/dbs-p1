<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 480" width="280" height="480">
  <defs>
    <filter id="back-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="back-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a4a"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </radialGradient>
  </defs>

  <!-- Card background: deep indigo -->
  <rect width="280" height="480" fill="#0d0d2b"/>

  <!-- Outer border -->
  <rect x="0" y="0" width="280" height="480" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <!-- Inner decorative border -->
  <rect x="10" y="10" width="260" height="460" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- Corner ornaments -->
  <text x="12" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="12" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>

  <!-- Crescent moon top-center -->
  <path d="M132 35 Q148 42 145 58 Q128 52 132 35" fill="#D4AF37" opacity="0.9"/>

  <!-- Sun bottom-center -->
  <circle cx="140" cy="448" r="10" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="140" cy="448" r="5" fill="#D4AF37" opacity="0.7"/>
  <!-- Sun rays -->
  <line x1="140" y1="433" x2="140" y2="430" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="140" y1="463" x2="140" y2="466" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="125" y1="448" x2="122" y2="448" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="155" y1="448" x2="158" y2="448" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="129" y1="437" x2="127" y2="435" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="151" y1="437" x2="153" y2="435" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="129" y1="459" x2="127" y2="461" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="151" y1="459" x2="153" y2="461" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Central 8-pointed star / Star of David geometric pattern -->
  <!-- Outer octagram composed of two overlapping squares -->
  <g transform="translate(140,240)">
    <!-- Large square rotated 0° -->
    <rect x="-65" y="-65" width="130" height="130" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
    <!-- Large square rotated 45° -->
    <rect x="-65" y="-65" width="130" height="130" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8" transform="rotate(45)"/>
    <!-- Inner square rotated 0° -->
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <!-- Inner square rotated 45° -->
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6" transform="rotate(45)"/>
    <!-- Diagonal lines from corners -->
    <line x1="-65" y1="-65" x2="65" y2="65" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <line x1="65" y1="-65" x2="-65" y2="65" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <!-- Dots at intersections -->
    <circle cx="0" cy="-65" r="2.5" fill="#D4AF37"/>
    <circle cx="0" cy="65" r="2.5" fill="#D4AF37"/>
    <circle cx="-65" cy="0" r="2.5" fill="#D4AF37"/>
    <circle cx="65" cy="0" r="2.5" fill="#D4AF37"/>
    <circle cx="-46" cy="-46" r="2" fill="#D4AF37" opacity="0.8"/>
    <circle cx="46" cy="-46" r="2" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-46" cy="46" r="2" fill="#D4AF37" opacity="0.8"/>
    <circle cx="46" cy="46" r="2" fill="#D4AF37" opacity="0.8"/>
    <!-- Center ornament -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37" opacity="0.8"/>
  </g>

  <!-- Outer ring of small gold diamonds (◆) evenly spaced around the card -->
  <!-- Top row -->
  <text x="50" y="22" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="90" y="22" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="140" y="22" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="190" y="22" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="230" y="22" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <!-- Bottom row -->
  <text x="50" y="474" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="90" y="474" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="140" y="474" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="190" y="474" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="230" y="474" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <!-- Left column -->
  <text x="15" y="80" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="140" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="200" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="260" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="320" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="380" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="15" y="440" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <!-- Right column -->
  <text x="265" y="80" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="140" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="200" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="260" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="320" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="380" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>
  <text x="265" y="440" font-family="Georgia, serif" font-size="8" fill="#D4AF37" text-anchor="middle" opacity="0.7">◆</text>

  <!-- Subtle texture overlay -->
  <rect x="0" y="0" width="280" height="480" fill="#0d0d2b" opacity="0.04" filter="url(#back-noise)"/>
</svg>
