<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 480" width="280" height="480">
  <defs>
    <filter id="hermit-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="normal" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in" result="textured"/>
      <feBlend in="SourceGraphic" in2="textured" mode="normal" k1="0" k2="1" k3="0.04" k4="0"/>
    </filter>
    <filter id="hermit-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="hermit-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="60%" stop-color="#4a2a6a"/>
      <stop offset="100%" stop-color="#6a3a8a"/>
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFA040" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="280" height="480" fill="#F8F0DC"/>

  <!-- Outer border -->
  <rect x="0" y="0" width="280" height="480" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <!-- Inner decorative border (4px inset from outer stroke edge = 10px from card edge) -->
  <rect x="10" y="10" width="260" height="460" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- Corner ornaments -->
  <text x="12" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="12" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>

  <!-- Card number -->
  <text x="140" y="38" font-family="Georgia, serif" font-size="14" fill="#1a1a0a" text-anchor="middle" letter-spacing="3">IX</text>

  <!-- Illustration area border -->
  <rect x="30" y="50" width="220" height="320" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- Sky background -->
  <rect x="30" y="50" width="220" height="320" fill="url(#hermit-sky)"/>

  <!-- Stars -->
  <circle cx="60" cy="70" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="90" cy="60" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="130" cy="72" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="160" cy="65" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="75" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="230" cy="62" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="75" cy="88" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="115" cy="82" r="1.5" fill="#fff" opacity="0.85"/>
  <circle cx="185" cy="88" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="220" cy="95" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="50" cy="105" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="240" cy="108" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="170" cy="100" r="1" fill="#fff" opacity="0.65"/>
  <!-- Crescent moon -->
  <path d="M195 80 Q210 90 205 105 Q190 95 195 80" fill="#D4AF37" opacity="0.9"/>

  <!-- Distant stick house silhouette (faint, in background) -->
  <g opacity="0.25" fill="#1a0a2a">
    <!-- House outline -->
    <rect x="75" y="240" width="50" height="40"/>
    <polygon points="65,240 150,240 110,215"/>
    <!-- Door -->
    <rect x="93" y="255" width="14" height="25" fill="#2a1a4a" opacity="0.5"/>
    <!-- Stick outlines on house walls -->
    <line x1="75" y1="240" x2="125" y2="240" stroke="#0d0014" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="250" x2="120" y2="250" stroke="#0d0014" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Dark hilltop (ground) -->
  <ellipse cx="140" cy="380" rx="120" ry="45" fill="#1a1a2a"/>
  <rect x="30" y="355" width="220" height="15" fill="#1a1a2a"/>

  <!-- Lantern glow halo -->
  <circle cx="178" cy="240" r="35" fill="url(#lantern-glow)" opacity="0.7"/>

  <!-- Pig figure - grey cloak/robe -->
  <!-- Cloak/robe body -->
  <path d="M115 310 Q110 300 112 270 Q114 250 120 240 L160 240 Q166 250 168 270 Q170 300 165 310 Z" fill="#888" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Cloak hood/shoulders -->
  <path d="M112 250 Q105 240 108 230 Q115 215 140 218 Q165 215 172 230 Q175 240 168 250 Z" fill="#777" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Cloak folds -->
  <line x1="120" y1="255" x2="118" y2="305" stroke="#666" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="250" x2="140" y2="308" stroke="#666" stroke-width="1" opacity="0.5"/>
  <line x1="158" y1="255" x2="160" y2="305" stroke="#666" stroke-width="1" opacity="0.6"/>

  <!-- Pig head (pink, slightly rotated toward viewer) -->
  <ellipse cx="140" cy="218" rx="22" ry="20" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Pig snout -->
  <ellipse cx="140" cy="226" rx="10" ry="7" fill="#D4705A" stroke="#1a1a0a" stroke-width="1"/>
  <circle cx="136" cy="225" r="2.5" fill="#1a1a0a"/>
  <circle cx="144" cy="225" r="2.5" fill="#1a1a0a"/>
  <!-- Pig eyes (contemplative, looking slightly down) -->
  <ellipse cx="131" cy="214" rx="3.5" ry="3" fill="#1a1a0a"/>
  <ellipse cx="150" cy="214" rx="3.5" ry="3" fill="#1a1a0a"/>
  <circle cx="132" cy="213" r="1" fill="#fff"/>
  <circle cx="151" cy="213" r="1" fill="#fff"/>
  <!-- Pig ears -->
  <ellipse cx="122" cy="208" rx="7" ry="8" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <ellipse cx="158" cy="208" rx="7" ry="8" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <ellipse cx="122" cy="208" rx="4" ry="5" fill="#D4705A"/>
  <ellipse cx="158" cy="208" rx="4" ry="5" fill="#D4705A"/>

  <!-- Left arm holding stick bundle (staff) -->
  <path d="M115 250 Q100 255 92 265 Q88 270 95 272" fill="none" stroke="#777" stroke-width="8"/>
  <!-- Stick bundle -->
  <line x1="92" y1="265" x2="85" y2="310" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="263" x2="88" y2="308" stroke="#A0782A" stroke-width="2" stroke-linecap="round"/>
  <line x1="89" y1="267" x2="82" y2="312" stroke="#6B4F10" stroke-width="2" stroke-linecap="round"/>
  <!-- Bundle tie -->
  <path d="M84 285 Q90 283 96 285" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Right arm holding lantern -->
  <path d="M165 250 Q178 255 182 262" fill="none" stroke="#777" stroke-width="8"/>
  <!-- Lantern body -->
  <rect x="176" y="240" rx="3" ry="3" width="16" height="22" fill="#888" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Lantern glass -->
  <rect x="179" y="243" width="10" height="16" fill="#FFE060" opacity="0.85"/>
  <!-- Lantern top -->
  <rect x="174" y="237" width="20" height="4" rx="2" fill="#666" stroke="#1a1a0a" stroke-width="1"/>
  <!-- Lantern handle -->
  <path d="M182 237 Q184 230 186 237" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Lantern flame -->
  <ellipse cx="184" cy="247" rx="3" ry="4" fill="#FF8C00" opacity="0.9"/>

  <!-- Pig feet peeking below cloak -->
  <ellipse cx="128" cy="312" rx="9" ry="5" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>
  <ellipse cx="152" cy="312" rx="9" ry="5" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>

  <!-- Bottom text area decorative lines -->
  <line x1="30" y1="375" x2="250" y2="375" stroke="#D4AF37" stroke-width="0.8"/>
  <line x1="30" y1="455" x2="250" y2="455" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- Card name -->
  <text x="140" y="420" font-family="Georgia, serif" font-size="13" fill="#1a1a0a" text-anchor="middle" letter-spacing="4">THE HERMIT</text>

  <!-- Subtle texture overlay -->
  <rect x="0" y="0" width="280" height="480" fill="#F8F0DC" opacity="0.04" filter="url(#hermit-noise)"/>
</svg>
