<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 480" width="280" height="480">
  <defs>
    <filter id="star-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="star-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="70%" stop-color="#1a1a4a"/>
      <stop offset="100%" stop-color="#2a2060"/>
    </linearGradient>
    <linearGradient id="star-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4F20"/>
      <stop offset="100%" stop-color="#4a3510"/>
    </linearGradient>
    <radialGradient id="big-star-glow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#FFE060" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face-light" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFA040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="280" height="480" fill="#F8F0DC"/>

  <!-- Outer border -->
  <rect x="0" y="0" width="280" height="480" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <!-- Inner decorative border -->
  <rect x="10" y="10" width="260" height="460" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- Corner ornaments -->
  <text x="12" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="22" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="12" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>
  <text x="268" y="474" font-family="Georgia, serif" font-size="12" fill="#D4AF37" text-anchor="middle">◆</text>

  <!-- Card number -->
  <text x="140" y="38" font-family="Georgia, serif" font-size="14" fill="#1a1a0a" text-anchor="middle" letter-spacing="3">XVII</text>

  <!-- Illustration area border -->
  <rect x="30" y="50" width="220" height="320" fill="none" stroke="#D4AF37" stroke-width="1"/>

  <!-- Sky -->
  <rect x="30" y="50" width="220" height="250" fill="url(#star-sky)"/>
  <!-- Ground -->
  <rect x="30" y="300" width="220" height="70" fill="url(#star-ground)"/>

  <!-- Big star glow halo -->
  <ellipse cx="140" cy="118" rx="70" ry="60" fill="url(#big-star-glow)"/>

  <!-- Small background stars -->
  <circle cx="45" cy="65" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="70" cy="72" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="60" r="1.2" fill="#fff" opacity="0.75"/>
  <circle cx="145" cy="58" r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="185" cy="65" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="215" cy="72" r="0.9" fill="#fff" opacity="0.65"/>
  <circle cx="235" cy="60" r="1.2" fill="#fff" opacity="0.75"/>
  <circle cx="55" cy="85" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="225" cy="88" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="98" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="42" cy="102" r="0.9" fill="#fff" opacity="0.55"/>

  <!-- Orbiting brick cluster (left) -->
  <g transform="translate(58, 165) rotate(-20)">
    <rect x="0" y="0" width="22" height="12" fill="#B85C38" stroke="#1a1a0a" stroke-width="1"/>
    <line x1="0" y1="6" x2="22" y2="6" stroke="#8a8a7a" stroke-width="0.5"/>
    <line x1="11" y1="0" x2="11" y2="12" stroke="#8a8a7a" stroke-width="0.5"/>
  </g>
  <!-- Orbiting brick cluster (right-high) -->
  <g transform="translate(198, 140) rotate(15)">
    <rect x="0" y="0" width="22" height="12" fill="#B85C38" stroke="#1a1a0a" stroke-width="1"/>
    <line x1="0" y1="6" x2="22" y2="6" stroke="#8a8a7a" stroke-width="0.5"/>
    <line x1="11" y1="0" x2="11" y2="12" stroke="#8a8a7a" stroke-width="0.5"/>
  </g>
  <!-- Orbiting brick cluster (right-low) -->
  <g transform="translate(205, 190) rotate(-10)">
    <rect x="0" y="0" width="18" height="10" fill="#C87050" stroke="#1a1a0a" stroke-width="1"/>
    <line x1="0" y1="5" x2="18" y2="5" stroke="#8a8a7a" stroke-width="0.5"/>
    <line x1="9" y1="0" x2="9" y2="10" stroke="#8a8a7a" stroke-width="0.5"/>
  </g>
  <!-- Orbit arc lines (subtle dashed) -->
  <ellipse cx="140" cy="200" rx="90" ry="75" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Large 8-pointed star -->
  <g transform="translate(140, 118)">
    <!-- Star rays (elongated) -->
    <polygon points="0,-38 5,-10 0,-5 -5,-10" fill="#D4AF37"/>
    <polygon points="0,38 5,10 0,5 -5,10" fill="#D4AF37"/>
    <polygon points="-38,0 -10,5 -5,0 -10,-5" fill="#D4AF37"/>
    <polygon points="38,0 10,5 5,0 10,-5" fill="#D4AF37"/>
    <polygon points="-27,-27 -5,-8 -3,-3 -8,-5" fill="#D4AF37"/>
    <polygon points="27,27 5,8 3,3 8,5" fill="#D4AF37"/>
    <polygon points="27,-27 5,-8 3,-3 8,-5" fill="#D4AF37"/>
    <polygon points="-27,27 -5,8 -3,3 -8,5" fill="#D4AF37"/>
    <!-- Star center -->
    <circle cx="0" cy="0" r="10" fill="#FFE060" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Brick wall partially built (behind pig) -->
  <g transform="translate(145, 265)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="25" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8"/>
    <rect x="26" y="0" width="25" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8"/>
    <rect x="52" y="0" width="25" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8"/>
    <!-- Row 2 -->
    <rect x="12" y="-11" width="25" height="10" fill="#C07040" stroke="#1a1a0a" stroke-width="0.8"/>
    <rect x="38" y="-11" width="25" height="10" fill="#C07040" stroke="#1a1a0a" stroke-width="0.8"/>
    <rect x="64" y="-11" width="14" height="10" fill="#C07040" stroke="#1a1a0a" stroke-width="0.8"/>
    <!-- Row 3 (partial) -->
    <rect x="0" y="-22" width="25" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8"/>
    <rect x="26" y="-22" width="25" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8"/>
  </g>

  <!-- Ground surface -->
  <ellipse cx="140" cy="302" rx="95" ry="8" fill="#5a4020" opacity="0.5"/>

  <!-- Pig 3 kneeling figure -->
  <!-- Body (linen tunic) -->
  <path d="M118 295 Q112 285 115 265 Q117 252 126 248 L154 248 Q163 252 165 265 Q168 285 162 295 Z" fill="#E8D8A0" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Tunic details/folds -->
  <line x1="128" y1="255" x2="126" y2="292" stroke="#C8B880" stroke-width="1" opacity="0.7"/>
  <line x1="150" y1="255" x2="152" y2="292" stroke="#C8B880" stroke-width="1" opacity="0.7"/>

  <!-- Left arm/hoof (trowel hand) - slightly extended left -->
  <path d="M117 262 Q103 258 95 252" fill="none" stroke="#E8D8A0" stroke-width="7" stroke-linecap="round"/>
  <!-- Trowel -->
  <path d="M95 252 L82 240 L90 235 L103 247 Z" fill="#888" stroke="#1a1a0a" stroke-width="1"/>
  <!-- Trowel handle -->
  <line x1="90" y1="235" x2="83" y2="228" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Hoof -->
  <circle cx="95" cy="252" r="7" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>

  <!-- Right arm/hoof (raised, floating bricks) - slightly extended right-up -->
  <path d="M163 260 Q175 252 183 245" fill="none" stroke="#E8D8A0" stroke-width="7" stroke-linecap="round"/>
  <!-- Hoof -->
  <circle cx="183" cy="245" r="7" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>

  <!-- Pig head -->
  <ellipse cx="140" cy="244" rx="21" ry="19" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <!-- Face light from star above -->
  <ellipse cx="144" cy="240" rx="14" ry="12" fill="url(#face-light)"/>
  <!-- Pig snout -->
  <ellipse cx="140" cy="252" rx="9" ry="6" fill="#D4705A" stroke="#1a1a0a" stroke-width="1"/>
  <circle cx="136" cy="251" r="2" fill="#1a1a0a"/>
  <circle cx="144" cy="251" r="2" fill="#1a1a0a"/>
  <!-- Eyes (focused, calm, looking slightly down at bricks) -->
  <ellipse cx="132" cy="241" rx="3" ry="3" fill="#1a1a0a"/>
  <ellipse cx="149" cy="241" rx="3" ry="3" fill="#1a1a0a"/>
  <circle cx="133" cy="240" r="1" fill="#fff"/>
  <circle cx="150" cy="240" r="1" fill="#fff"/>
  <!-- Pig ears -->
  <ellipse cx="122" cy="235" rx="6" ry="7" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <ellipse cx="158" cy="235" rx="6" ry="7" fill="#E8927A" stroke="#1a1a0a" stroke-width="1.5"/>
  <ellipse cx="122" cy="235" rx="3.5" ry="4.5" fill="#D4705A"/>
  <ellipse cx="158" cy="235" rx="3.5" ry="4.5" fill="#D4705A"/>

  <!-- Kneeling legs/hooves -->
  <ellipse cx="125" cy="297" rx="10" ry="6" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>
  <ellipse cx="155" cy="297" rx="10" ry="6" fill="#E8927A" stroke="#1a1a0a" stroke-width="1"/>

  <!-- Brick being placed (at hoof level) -->
  <rect x="108" y="290" width="28" height="12" fill="#B85C38" stroke="#1a1a0a" stroke-width="1"/>
  <line x1="108" y1="296" x2="136" y2="296" stroke="#8a8a7a" stroke-width="0.5"/>
  <line x1="122" y1="290" x2="122" y2="302" stroke="#8a8a7a" stroke-width="0.5"/>

  <!-- Small stars scattered -->
  <path d="M55 155 L57 148 L59 155 L66 157 L59 159 L57 166 L55 159 L48 157 Z" fill="#D4AF37" opacity="0.85"/>
  <path d="M225 200 L226 195 L228 200 L233 201 L228 203 L226 207 L225 203 L220 201 Z" fill="#D4AF37" opacity="0.7"/>
  <path d="M42 195 L43 192 L44 195 L47 196 L44 197 L43 200 L42 197 L39 196 Z" fill="#D4AF37" opacity="0.6"/>

  <!-- Bottom text area decorative lines -->
  <line x1="30" y1="375" x2="250" y2="375" stroke="#D4AF37" stroke-width="0.8"/>
  <line x1="30" y1="455" x2="250" y2="455" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- Card name -->
  <text x="140" y="420" font-family="Georgia, serif" font-size="13" fill="#1a1a0a" text-anchor="middle" letter-spacing="4">THE STAR</text>

  <!-- Texture overlay -->
  <rect x="0" y="0" width="280" height="480" fill="#F8F0DC" opacity="0.04" filter="url(#star-noise)"/>
</svg>
