<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Palatino Linotype', Georgia, serif">
  <!-- Starfield background -->
  <rect width="800" height="600" fill="#0d0d2b"/>
  <!-- Stars -->
  <circle cx="42" cy="18" r="1" fill="white" opacity="0.8"/>
  <circle cx="130" cy="45" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="220" cy="22" r="0.8" fill="white" opacity="0.9"/>
  <circle cx="310" cy="55" r="1" fill="white" opacity="0.7"/>
  <circle cx="400" cy="15" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="490" cy="38" r="1" fill="white" opacity="0.8"/>
  <circle cx="580" cy="20" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="670" cy="48" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="755" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="75" cy="90" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="195" cy="110" r="1" fill="white" opacity="0.8"/>
  <circle cx="450" cy="80" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="620" cy="95" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="730" cy="105" r="1" fill="white" opacity="0.9"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="16" fill="#D4AF37" letter-spacing="4">✦ THE SPREAD OF THE THREE DWELLINGS ✦</text>
  <line x1="120" y1="52" x2="680" y2="52" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>

  <!-- 8 cards in 4x2 grid -->
  <!-- Row 1 cards: y=70, heights 160 -->
  <!-- Card 1: THE FOOL -->
  <g transform="translate(58, 68) rotate(-2, 58, 68)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="2">I</text>
    <!-- Simple fool illustration: pig at cliff -->
    <rect x="10" y="22" width="68" height="90" fill="#FFF0A0" stroke="#D4AF37" stroke-width="0.5"/>
    <rect x="10" y="85" width="68" height="27" fill="#4a8c3f"/>
    <ellipse cx="44" cy="62" rx="14" ry="14" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="1"/>
    <ellipse cx="44" cy="67" rx="6" ry="4" fill="#e8908a" stroke="#1a1a0a" stroke-width="0.8"/>
    <!-- straw bundle -->
    <line x1="52" y1="55" x2="65" y2="42" stroke="#8B6914" stroke-width="1.5"/>
    <ellipse cx="65" cy="40" rx="5" ry="4" fill="#E8C840" stroke="#8B6914" stroke-width="0.8"/>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="2">THE FOOL</text>
    <!-- gold glow on revealed card -->
  </g>

  <!-- Card 2: THE TOWER (reversed - red tinted) -->
  <g transform="translate(158, 62) rotate(3, 158, 62)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="1">XVI</text>
    <rect x="10" y="22" width="68" height="90" fill="#1a1a3a" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- wolf silhouette -->
    <ellipse cx="25" cy="65" rx="10" ry="12" fill="#555" stroke="#1a1a0a" stroke-width="1"/>
    <!-- force arcs -->
    <path d="M 35,62 Q 52,50 65,55" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.8"/>
    <path d="M 35,67 Q 52,65 68,70" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.8"/>
    <!-- crumbling house -->
    <rect x="55" y="45" width="22" height="30" fill="none" stroke="#888" stroke-width="1" transform="rotate(5, 66, 60)"/>
    <!-- REVERSED indicator -->
    <text x="44" y="108" text-anchor="middle" font-size="5" fill="#8B0000" letter-spacing="1">▼ REVERSED</text>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="1">THE TOWER</text>
  </g>

  <!-- Card 3: WHEEL (reversed) -->
  <g transform="translate(258, 70) rotate(-3, 258, 70)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="2">X</text>
    <rect x="10" y="22" width="68" height="90" fill="#f4a460" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- wheel -->
    <circle cx="44" cy="67" r="26" fill="none" stroke="#8B6914" stroke-width="2"/>
    <circle cx="44" cy="67" r="8" fill="#D4AF37" stroke="#8B6914" stroke-width="1"/>
    <line x1="44" y1="41" x2="44" y2="93" stroke="#8B6914" stroke-width="1"/>
    <line x1="18" y1="67" x2="70" y2="67" stroke="#8B6914" stroke-width="1"/>
    <line x1="25" y1="48" x2="63" y2="86" stroke="#8B6914" stroke-width="1"/>
    <line x1="63" y1="48" x2="25" y2="86" stroke="#8B6914" stroke-width="1"/>
    <text x="44" y="108" text-anchor="middle" font-size="5" fill="#8B0000" letter-spacing="1">▼ REVERSED</text>
    <text x="44" y="126" text-anchor="middle" font-size="5" fill="#1a1a0a" letter-spacing="1">WHEEL OF FORTUNE</text>
  </g>

  <!-- Card 4: THE HERMIT -->
  <g transform="translate(358, 65) rotate(2, 358, 65)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="2">IX</text>
    <rect x="10" y="22" width="68" height="90" fill="#2a1a4a" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- stars -->
    <circle cx="55" cy="32" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="25" cy="38" r="1" fill="white" opacity="0.7"/>
    <circle cx="65" cy="45" r="1" fill="white" opacity="0.8"/>
    <!-- pig with lantern -->
    <ellipse cx="40" cy="75" rx="12" ry="13" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="1"/>
    <rect x="28" y="65" width="24" height="18" fill="#888" stroke="#1a1a0a" stroke-width="0.8" rx="2"/>
    <!-- lantern glow -->
    <ellipse cx="60" cy="72" rx="7" ry="9" fill="#FFD700" opacity="0.8" stroke="#8B6914" stroke-width="1"/>
    <ellipse cx="60" cy="72" rx="12" ry="15" fill="#FFD700" opacity="0.15"/>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="1">THE HERMIT</text>
  </g>

  <!-- Row 2 cards: y=230 -->
  <!-- Card 5: THE TOWER again (reversed) -->
  <g transform="translate(108, 238) rotate(-2, 108, 238)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="1">XVI</text>
    <rect x="10" y="22" width="68" height="90" fill="#1a1a3a" stroke="#D4AF37" stroke-width="0.5"/>
    <ellipse cx="25" cy="65" rx="10" ry="12" fill="#555" stroke="#1a1a0a" stroke-width="1"/>
    <path d="M 35,62 Q 52,50 65,55" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.8"/>
    <path d="M 35,67 Q 52,65 68,70" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.8"/>
    <rect x="55" y="42" width="22" height="32" fill="none" stroke="#666" stroke-width="1" transform="rotate(8,66,58)"/>
    <text x="44" y="108" text-anchor="middle" font-size="5" fill="#8B0000" letter-spacing="1">▼ REVERSED</text>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="1">THE TOWER</text>
  </g>

  <!-- Card 6: THE STAR -->
  <g transform="translate(208, 232) rotate(3, 208, 232)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2" filter="url(#glow)"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="1">XVII</text>
    <rect x="10" y="22" width="68" height="90" fill="#0d0d2b" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- 8-pointed star -->
    <polygon points="44,26 47,36 57,33 50,41 57,49 47,46 44,56 41,46 31,49 38,41 31,33 41,36" fill="#D4AF37" stroke="#8B6914" stroke-width="0.5"/>
    <!-- pig kneeling -->
    <ellipse cx="44" cy="88" rx="11" ry="11" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="1"/>
    <!-- brick -->
    <rect x="38" y="96" width="18" height="10" fill="#B85C38" stroke="#1a1a0a" stroke-width="0.8" rx="1"/>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="2">THE STAR</text>
  </g>

  <!-- Card 7: STRENGTH -->
  <g transform="translate(308, 240) rotate(-1, 308, 240)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="1">VIII</text>
    <rect x="10" y="22" width="68" height="90" fill="#87CEEB" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- brick house -->
    <rect x="18" y="50" width="52" height="56" fill="#B85C38" stroke="#1a1a0a" stroke-width="1.5"/>
    <line x1="18" y1="60" x2="70" y2="60" stroke="#8a8a7a" stroke-width="0.8"/>
    <line x1="18" y1="70" x2="70" y2="70" stroke="#8a8a7a" stroke-width="0.8"/>
    <line x1="18" y1="80" x2="70" y2="80" stroke="#8a8a7a" stroke-width="0.8"/>
    <line x1="18" y1="90" x2="70" y2="90" stroke="#8a8a7a" stroke-width="0.8"/>
    <polygon points="44,28 12,52 76,52" fill="#8B4513" stroke="#1a1a0a" stroke-width="1.5"/>
    <!-- wolf tiny, exhausted -->
    <ellipse cx="14" cy="95" rx="7" ry="8" fill="#888" stroke="#1a1a0a" stroke-width="0.8"/>
    <!-- infinity -->
    <text x="44" y="38" text-anchor="middle" font-size="14" fill="#D4AF37">∞</text>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#1a1a0a" letter-spacing="1">STRENGTH</text>
  </g>

  <!-- Card 8: THE WORLD (glowing) -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="worldglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(408, 235) rotate(2, 408, 235)" filter="url(#worldglow)">
    <rect width="88" height="138" rx="3" fill="#F8F0DC" stroke="#D4AF37" stroke-width="2.5"/>
    <rect x="5" y="5" width="78" height="128" rx="2" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <text x="44" y="18" text-anchor="middle" font-size="7" fill="#1a1a0a" letter-spacing="1">XXI</text>
    <rect x="10" y="22" width="68" height="90" fill="#1a2a1a" stroke="#D4AF37" stroke-width="0.5"/>
    <!-- laurel wreath oval -->
    <ellipse cx="44" cy="67" rx="26" ry="34" fill="none" stroke="#2a5c2a" stroke-width="4"/>
    <!-- warm interior -->
    <ellipse cx="44" cy="67" rx="20" ry="28" fill="#FFA040" opacity="0.6"/>
    <!-- three pig silhouettes -->
    <ellipse cx="35" cy="62" rx="6" ry="7" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="0.8"/>
    <ellipse cx="44" cy="60" rx="6" ry="7" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="0.8"/>
    <ellipse cx="53" cy="62" rx="6" ry="7" fill="#F4A8A0" stroke="#1a1a0a" stroke-width="0.8"/>
    <!-- wolf outside window, sad -->
    <ellipse cx="62" cy="85" rx="5" ry="6" fill="#666" stroke="#1a1a0a" stroke-width="0.5" opacity="0.7"/>
    <text x="44" y="126" text-anchor="middle" font-size="6" fill="#D4AF37" letter-spacing="1">THE WORLD</text>
  </g>

  <!-- Face-down cards (positions not yet revealed — just show card backs) -->
  <!-- Show a stack hint at bottom -->

  <!-- Narration panel -->
  <rect x="50" y="400" width="700" height="100" rx="6" fill="#F8F0DC" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="56" y="406" width="688" height="88" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
  <text x="400" y="426" text-anchor="middle" font-size="10" fill="#8B6914" letter-spacing="3">THE FOOL · Position I: The Seeker</text>
  <line x1="80" y1="432" x2="720" y2="432" stroke="#D4AF37" stroke-width="0.5"/>
  <text x="80" y="450" font-size="11" fill="#1a1a0a" font-style="italic">"The Fool steps forward, bright-eyed, straw in hand. Hope untempered by experience</text>
  <text x="80" y="466" font-size="11" fill="#1a1a0a" font-style="italic">is a kind of courage. It is also a structural liability."</text>
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#D4AF37">✦ Draw the next card ✦   Card 1 of 8</text>

  <!-- Gallery link -->
  <text x="20" y="580" font-size="11" fill="#D4AF37" opacity="0.5">← Gallery</text>
</svg>
