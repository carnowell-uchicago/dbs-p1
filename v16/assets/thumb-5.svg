<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Browser chrome -->
  <rect x="0" y="0" width="360" height="28" fill="#e8e8e8"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="26" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="38" cy="14" r="5" fill="#28c840"/>
  <rect x="60" y="7" width="240" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="180" y="17.5" text-anchor="middle" font-size="8" fill="#666">wolf.co/series-b</text>

  <!-- Very dark bg with slight red tinge -->
  <rect x="0" y="28" width="360" height="242" fill="#0d0005"/>

  <!-- Nav same as wolf.co -->
  <rect x="0" y="28" width="360" height="32" fill="#110005"/>
  <line x1="0" y1="60" x2="360" y2="60" stroke="#2a0010" stroke-width="1"/>
  <text x="20" y="48" font-size="10" font-weight="bold" fill="#fff" letter-spacing="2">WOLF.CO</text>
  <text x="210" y="48" font-size="7" fill="#cc3333" font-weight="bold">SERIES B</text>
  <text x="260" y="48" font-size="8" fill="#666">Portfolio</text>
  <text x="308" y="48" font-size="8" fill="#666">Contact</text>

  <!-- Large dramatic blow - wind lines -->
  <line x1="30" y1="100" x2="200" y2="90" stroke="#440020" stroke-width="3"/>
  <line x1="20" y1="120" x2="210" y2="110" stroke="#550025" stroke-width="4"/>
  <line x1="25" y1="140" x2="205" y2="135" stroke="#440020" stroke-width="3"/>
  <line x1="30" y1="155" x2="195" y2="150" stroke="#330015" stroke-width="2.5"/>

  <!-- Stick debris flying -->
  <line x1="220" y1="95" x2="280" y2="80" stroke="#c08040" stroke-width="2" transform="rotate(15,250,87)"/>
  <line x1="235" y1="110" x2="310" y2="115" stroke="#8a5820" stroke-width="1.5" transform="rotate(-10,272,112)"/>
  <line x1="225" y1="130" x2="295" y2="140" stroke="#c08040" stroke-width="2" transform="rotate(8,260,135)"/>
  <line x1="240" y1="148" x2="300" y2="160" stroke="#8a5820" stroke-width="1.5" transform="rotate(-5,270,154)"/>
  <line x1="210" y1="165" x2="280" y2="170" stroke="#c08040" stroke-width="2" transform="rotate(12,245,167)"/>
  <!-- Roof piece flying off -->
  <polygon points="220,85 255,78 240,98" fill="#c08040" opacity="0.8" transform="rotate(20,238,88)"/>

  <!-- Wolf snout in corner -->
  <ellipse cx="55" cy="135" rx="40" ry="30" fill="#111" stroke="#222" stroke-width="1"/>
  <ellipse cx="72" cy="145" rx="18" ry="12" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
  <circle cx="52" cy="122" r="5" fill="#cc0000"/>
  <circle cx="52" cy="122" r="2.5" fill="#ff3333"/>

  <!-- Text -->
  <text x="180" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Series B: Stick Market.</text>
  <text x="180" y="220" text-anchor="middle" font-size="7.5" fill="#882222">Lung capacity: alarming. Runway: gone.</text>

  <!-- funding bar -->
  <rect x="80" y="232" width="200" height="6" rx="3" fill="#1a0010"/>
  <rect x="80" y="232" width="190" height="6" rx="3" fill="#cc0000" opacity="0.8"/>
  <text x="180" y="250" text-anchor="middle" font-size="7" fill="#666">$42M raised · House demolished · Pivoting</text>
</svg>
