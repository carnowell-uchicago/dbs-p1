<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Browser chrome -->
  <rect x="0" y="0" width="360" height="28" fill="#e8e8e8"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="26" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="38" cy="14" r="5" fill="#28c840"/>
  <rect x="60" y="7" width="240" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="180" y="17.5" text-anchor="middle" font-size="8" fill="#666">stickstack.io</text>

  <!-- Background: light wood tone -->
  <rect x="0" y="28" width="360" height="242" fill="#faf5ee"/>

  <!-- Nav -->
  <rect x="0" y="28" width="360" height="32" fill="#fff"/>
  <line x1="0" y1="60" x2="360" y2="60" stroke="#e0d5c0" stroke-width="1"/>
  <text x="20" y="48" font-size="10" font-weight="bold" fill="#3a2800" letter-spacing="0.5">STICKSTACK®</text>
  <text x="210" y="48" font-size="8" fill="#8a7060">Enterprise</text>
  <text x="265" y="48" font-size="8" fill="#8a7060">Solutions</text>
  <text x="320" y="48" font-size="8" fill="#8a7060">Docs</text>

  <!-- Stick house -->
  <!-- Ground -->
  <rect x="40" y="198" width="280" height="8" rx="2" fill="#c8b090" opacity="0.5"/>
  <!-- Walls made of sticks -->
  <rect x="110" y="148" width="140" height="52" fill="#d4a870"/>
  <!-- Stick texture - horizontal -->
  <line x1="110" y1="163" x2="250" y2="163" stroke="#8a5820" stroke-width="2"/>
  <line x1="110" y1="174" x2="250" y2="174" stroke="#8a5820" stroke-width="2"/>
  <line x1="110" y1="185" x2="250" y2="185" stroke="#8a5820" stroke-width="2"/>
  <line x1="110" y1="196" x2="250" y2="196" stroke="#8a5820" stroke-width="2"/>
  <!-- Stick texture - vertical joins -->
  <line x1="140" y1="148" x2="140" y2="200" stroke="#8a5820" stroke-width="1"/>
  <line x1="180" y1="148" x2="180" y2="200" stroke="#8a5820" stroke-width="1"/>
  <line x1="220" y1="148" x2="220" y2="200" stroke="#8a5820" stroke-width="1"/>
  <!-- Door -->
  <rect x="162" y="168" width="36" height="32" rx="2" fill="#7a4010"/>
  <!-- Roof: timber A-frame -->
  <polygon points="90,150 180,95 270,150" fill="#c08040" stroke="#7a4010" stroke-width="2"/>
  <!-- Timber lines on roof -->
  <line x1="130" y1="120" x2="180" y2="95" stroke="#7a4010" stroke-width="2"/>
  <line x1="230" y1="120" x2="180" y2="95" stroke="#7a4010" stroke-width="2"/>
  <line x1="180" y1="95" x2="180" y2="150" stroke="#7a4010" stroke-width="2"/>

  <!-- Text -->
  <text x="180" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a1800">Enterprise Timber Solutions</text>
  <text x="180" y="242" text-anchor="middle" font-size="8" fill="#8a6040">Upgrade from straw. Scale your shelter.</text>

  <!-- CTA -->
  <rect x="130" y="250" width="100" height="16" rx="3" fill="#8a5820"/>
  <text x="180" y="261" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">REQUEST A DEMO</text>
</svg>
