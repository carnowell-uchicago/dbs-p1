<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Browser chrome -->
  <rect x="0" y="0" width="360" height="28" fill="#e8e8e8"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="26" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="38" cy="14" r="5" fill="#28c840"/>
  <rect x="60" y="7" width="240" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="180" y="17.5" text-anchor="middle" font-size="8" fill="#666">strawhaus.com</text>

  <!-- Background: warm yellow/straw -->
  <rect x="0" y="28" width="360" height="242" fill="#fffbef"/>

  <!-- Nav -->
  <rect x="0" y="28" width="360" height="32" fill="#fff" stroke="#eee" stroke-width="0"/>
  <line x1="0" y1="60" x2="360" y2="60" stroke="#eeedd0" stroke-width="1"/>
  <text x="20" y="48" font-size="10" font-weight="bold" fill="#222" letter-spacing="1">STRAWHAUS™</text>
  <text x="220" y="48" font-size="8" fill="#888">Product</text>
  <text x="268" y="48" font-size="8" fill="#888">Pricing</text>
  <text x="316" y="48" font-size="8" fill="#888">Docs</text>

  <!-- Hero straw house illustration -->
  <!-- Ground -->
  <rect x="40" y="195" width="280" height="10" rx="2" fill="#d4c87a" opacity="0.4"/>
  <!-- House shape: walls -->
  <rect x="120" y="150" width="120" height="50" fill="#e8d97a" stroke="#c8b84a" stroke-width="2"/>
  <!-- Straw texture lines -->
  <line x1="120" y1="165" x2="240" y2="165" stroke="#c8b84a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="120" y1="178" x2="240" y2="178" stroke="#c8b84a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="120" y1="191" x2="240" y2="191" stroke="#c8b84a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Door -->
  <rect x="163" y="170" width="34" height="30" rx="2" fill="#b8944a"/>
  <!-- Roof triangle -->
  <polygon points="100,152 180,100 260,152" fill="#d4c040" stroke="#b8a030" stroke-width="2"/>
  <!-- Straw on roof -->
  <line x1="140" y1="135" x2="160" y2="152" stroke="#b8a030" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="155" y1="125" x2="175" y2="152" stroke="#b8a030" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="170" y1="118" x2="185" y2="152" stroke="#b8a030" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="190" y1="118" x2="200" y2="152" stroke="#b8a030" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="205" y1="125" x2="215" y2="152" stroke="#b8a030" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Headline -->
  <text x="180" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a2200">Ship Fast. Iterate Later.</text>
  <text x="180" y="248" text-anchor="middle" font-size="8" fill="#8a7a30">Premium straw architecture for the modern pig.</text>

  <!-- CTA -->
  <rect x="140" y="254" width="80" height="18" rx="3" fill="#c8a030"/>
  <text x="180" y="266" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">Get Started →</text>
</svg>
