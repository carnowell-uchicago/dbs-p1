<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Browser chrome -->
  <rect x="0" y="0" width="360" height="28" fill="#e8e8e8"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57"/>
  <circle cx="26" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="38" cy="14" r="5" fill="#28c840"/>
  <rect x="60" y="7" width="240" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="180" y="17.5" text-anchor="middle" font-size="8" fill="#666">wolf.co</text>

  <!-- Dark background -->
  <rect x="0" y="28" width="360" height="242" fill="#0d0d0d"/>

  <!-- Nav -->
  <rect x="0" y="28" width="360" height="32" fill="#111"/>
  <line x1="0" y1="60" x2="360" y2="60" stroke="#2a2a2a" stroke-width="1"/>
  <text x="20" y="48" font-size="10" font-weight="bold" fill="#fff" letter-spacing="2">WOLF.CO</text>
  <text x="220" y="48" font-size="8" fill="#888">About</text>
  <text x="258" y="48" font-size="8" fill="#888">Portfolio</text>
  <text x="310" y="48" font-size="8" fill="#888">Contact</text>

  <!-- Wolf silhouette -->
  <!-- Body -->
  <ellipse cx="180" cy="155" rx="55" ry="38" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="215" cy="120" rx="32" ry="28" fill="#222" stroke="#333" stroke-width="1"/>
  <!-- Snout -->
  <ellipse cx="237" cy="128" rx="14" ry="10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Eyes - glowing red -->
  <circle cx="210" cy="113" r="4" fill="#cc0000"/>
  <circle cx="210" cy="113" r="2" fill="#ff3333"/>
  <circle cx="224" cy="113" r="4" fill="#cc0000"/>
  <circle cx="224" cy="113" r="2" fill="#ff3333"/>
  <!-- Ears -->
  <polygon points="195,95 200,75 210,95" fill="#222" stroke="#333" stroke-width="1"/>
  <polygon points="220,92 228,72 235,92" fill="#222" stroke="#333" stroke-width="1"/>
  <!-- Breath lines (huffing) -->
  <line x1="252" y1="122" x2="285" y2="118" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="252" y1="128" x2="290" y2="130" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="252" y1="134" x2="280" y2="138" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Straw debris -->
  <line x1="290" y1="140" x2="320" y2="125" stroke="#d4c040" stroke-width="1.5"/>
  <line x1="300" y1="155" x2="335" y2="145" stroke="#d4c040" stroke-width="1.5"/>
  <line x1="280" y1="165" x2="310" y2="160" stroke="#d4c040" stroke-width="1.5"/>

  <!-- Text -->
  <text x="180" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" letter-spacing="1">Market Entry.</text>
  <text x="180" y="235" text-anchor="middle" font-size="8" fill="#666">One huff was all it took.</text>
  <rect x="140" y="244" width="80" height="16" rx="2" fill="#cc0000"/>
  <text x="180" y="255" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">VIEW PORTFOLIO</text>
</svg>
