  <clipPath id="insuranceClip">
    <rect x="614" y="60" width="182" height="226" rx="10"/>
  </clipPath>
  <rect x="614" y="60" width="182" height="102" fill="#2b6cb0" clip-path="url(#insuranceClip)"/>
  <!-- Shield shape -->
  <polygon points="705,70 735,70 735,104 705,122 675,104 675,70" fill="#ffffff"/>
  <text x="705" y="101" text-anchor="middle" fill="#2b6cb0" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900">M</text>

  <!-- Ad body -->
  <text x="620" y="176" fill="#a0aec0" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="0.04em">Sponsored</text>
  <text x="620" y="190" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">Meadow Mutual Insurance</text>
  <text x="620" y="204" fill="#2d3748" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">Is your home prepared</text>
  <text x="620" y="216" fill="#2d3748" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">for the unexpected?</text>
  <text x="620" y="228" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="10">Huffing &amp; puffing covered.</text>
  <!-- CTA -->
  <rect x="620" y="234" width="162" height="24" rx="5" fill="#3182ce"/>
  <text x="701" y="251" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">Get Coverage</text>
  <text x="790" y="276" text-anchor="end" fill="#a0aec0" font-family="Arial,Helvetica,sans-serif" font-size="9">Why am I seeing this ad? ▾</text>


  <!-- ══════════════════════════════════════════
       BOTTOM NAV BAR
  ══════════════════════════════════════════ -->
  <rect x="0" y="548" width="800" height="52" fill="#ffffff"/>
  <line x1="0" y1="548" x2="800" y2="548" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Prev button (disabled state) -->
  <rect x="266" y="558" width="90" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
  <text x="311" y="579" text-anchor="middle" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" opacity="0.35">← Prev</text>

  <!-- Screen counter -->
  <text x="400" y="579" text-anchor="middle" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">Screen 1 / 6</text>

  <!-- Next button (active) -->
  <rect x="444" y="558" width="90" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="489" y="579" text-anchor="middle" fill="#3182ce" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">Next →</text>

</svg>
