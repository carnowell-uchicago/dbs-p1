<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">

  <!-- Page background -->
  <rect width="800" height="600" fill="#f0f4f8"/>

  <!-- ── STICKY HEADER ── -->
  <rect width="800" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="28" text-anchor="middle" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="-0.2">MeadowFeed</text>
  <text x="400" y="44" text-anchor="middle" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">What's happening in the forest</text>

  <!-- Gallery link pill (top-left) -->
  <rect x="8" y="14" width="82" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="49" y="31" text-anchor="middle" fill="#3182ce" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">← Gallery</text>


  <!-- ══════════════════════════════════════════
       LEFT SIDEBAR — Brick & Co. ad
  ══════════════════════════════════════════ -->
  <!-- Card background -->
  <rect x="4" y="60" width="182" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Ad image area: terra-cotta brick background, clipped by top radius -->
  <clipPath id="brickClip">
    <rect x="4" y="60" width="182" height="226" rx="10"/>
  </clipPath>
  <rect x="4" y="60" width="182" height="102" fill="#c45c3a" clip-path="url(#brickClip)"/>
  <!-- Brick rows -->
  <rect x="12" y="70" width="58" height="14" rx="2" fill="#8b3a20"/>
  <rect x="74"  y="70" width="42" height="14" rx="2" fill="#a84a2c"/>
  <rect x="120" y="70" width="58" height="14" rx="2" fill="#d97850"/>
  <rect x="12"  y="88" width="42" height="14" rx="2" fill="#d97850"/>
  <rect x="58"  y="88" width="58" height="14" rx="2" fill="#8b3a20"/>
  <rect x="120" y="88" width="58" height="14" rx="2" fill="#a84a2c"/>
  <rect x="12"  y="106" width="56" height="14" rx="2" fill="#a84a2c"/>
  <rect x="72"  y="106" width="46" height="14" rx="2" fill="#d97850"/>
  <rect x="122" y="106" width="56" height="14" rx="2" fill="#8b3a20"/>

  <!-- Ad body -->
  <text x="10" y="176" fill="#a0aec0" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="0.04em">Sponsored</text>
  <text x="10" y="190" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Brick &amp; Co.</text>
  <text x="10" y="204" fill="#2d3748" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">Build it once. Build it right.</text>
  <text x="10" y="216" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="10">Premium kiln-fired bricks.</text>
  <text x="10" y="228" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="10">Wolf-resistant.</text>
  <!-- CTA -->
  <rect x="10" y="234" width="162" height="24" rx="5" fill="#3182ce"/>
  <text x="91" y="251" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">Get a Free Quote</text>
  <text x="176" y="276" text-anchor="end" fill="#a0aec0" font-family="Arial,Helvetica,sans-serif" font-size="9">Why am I seeing this ad? ▾</text>


  <!-- ══════════════════════════════════════════
       CENTER FEED
  ══════════════════════════════════════════ -->

  <!-- Screen label -->
  <text x="192" y="74" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="0.8">DAY 1 · IT BEGINS</text>

  <!-- ── Post 1: Straw Pig ── -->
  <rect x="192" y="78" width="416" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="220" cy="104" r="17" fill="#d69e2e"/>
  <text x="220" y="110" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">S</text>
  <text x="244" y="100" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Straw Pig</text>
  <text x="244" y="114" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">@pig1_straw · 3d ago</text>
  <text x="196" y="134" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">Just left home!! Starting my new chapter 🏠 Building my</text>
  <text x="196" y="150" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">place today, shouldn't take long #NewBeginnings</text>
  <text x="196" y="162" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">♥ 42  ↺ 8  💬 6</text>

  <!-- ── Post 2: Stick Pig ── -->
  <rect x="192" y="172" width="416" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="220" cy="198" r="17" fill="#744210"/>
  <text x="220" y="204" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">T</text>
  <text x="244" y="194" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Stick Pig</text>
  <text x="244" y="208" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">@pig2_sticks · 3d ago</text>
  <text x="196" y="228" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">Same! Taking a bit more time with mine but should be</text>
  <text x="196" y="244" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">done by the weekend. Sticks &gt; straw, sorry bro 😅</text>
  <text x="196" y="256" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">♥ 31  ↺ 4  💬 3</text>

  <!-- ── Post 3: Brick Pig ── -->
  <rect x="192" y="266" width="416" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="220" cy="292" r="17" fill="#4a5568"/>
  <text x="220" y="298" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">B</text>
  <text x="244" y="288" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Brick Pig</text>
  <text x="244" y="302" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">@pig3bricks · 3d ago</text>
  <text x="196" y="322" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">Week one of construction. Bricks are heavy. My brothers</text>
  <text x="196" y="338" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">think I'm overdoing it. Maybe I am. We'll see.</text>
  <text x="196" y="350" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">♥ 19  ↺ 2  💬 1</text>

  <!-- ── Post 4: Big Bad Wolf ── -->
  <rect x="192" y="360" width="416" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="220" cy="384" r="17" fill="#c53030"/>
  <text x="220" y="390" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">W</text>
  <text x="244" y="380" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Big Bad Wolf</text>
  <text x="244" y="394" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">@bigbadwolf · 3d ago</text>
  <text x="196" y="414" fill="#1a202c" font-family="Arial,Helvetica,sans-serif" font-size="12">Heard three little pigs just moved to the meadow. Interesting.</text>
  <text x="196" y="430" fill="#718096" font-family="Arial,Helvetica,sans-serif" font-size="11">♥ 7  ↺ 1  💬 0</text>

  <!-- ── Faint continuation hint ── -->
  <rect x="192" y="444" width="416" height="6" rx="3" fill="#e2e8f0" opacity="0.6"/>
  <rect x="192" y="456" width="300" height="6" rx="3" fill="#e2e8f0" opacity="0.4"/>
  <rect x="192" y="468" width="200" height="6" rx="3" fill="#e2e8f0" opacity="0.2"/>


  <!-- ══════════════════════════════════════════
       RIGHT SIDEBAR — Meadow Mutual Insurance ad
  ══════════════════════════════════════════ -->
  <rect x="614" y="60" width="182" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

