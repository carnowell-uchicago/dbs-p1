<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#992211"/>
      <stop offset="100%" stop-color="#882211"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="90" cy="158" rx="76" ry="6" fill="#00000033" stroke="none"/>

  <!-- Chimney -->
  <rect x="118" y="22" width="22" height="46" rx="2" fill="#CC4422" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Chimney bricks -->
  <rect x="118" y="26" width="10" height="7" rx="1" fill="#BB3311" stroke="#D9C4A8" stroke-width="1"/>
  <rect x="130" y="26" width="10" height="7" rx="1" fill="#BB3311" stroke="#D9C4A8" stroke-width="1"/>
  <rect x="118" y="35" width="10" height="7" rx="1" fill="#BB3311" stroke="#D9C4A8" stroke-width="1"/>
  <rect x="130" y="35" width="10" height="7" rx="1" fill="#BB3311" stroke="#D9C4A8" stroke-width="1"/>
  <!-- Chimney top cap -->
  <rect x="114" y="20" width="30" height="6" rx="2" fill="#882211" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Smoke curl -->
  <path d="M 122 20 Q 118 12 124 8 Q 130 4 126 -2" fill="none" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
  <path d="M 130 18 Q 136 10 130 4" fill="none" stroke="#BBBBBB" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Roof -->
  <polygon points="12,82 90,18 168,82" fill="url(#roofGrad)" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
  <!-- Roof ridge tiles -->
  <line x1="50" y1="66" x2="130" y2="66" stroke="#772211" stroke-width="2"/>
  <line x1="32" y1="76" x2="148" y2="76" stroke="#772211" stroke-width="2"/>

  <!-- Wall background (mortar color) -->
  <rect x="18" y="80" width="144" height="76" rx="2" fill="#D9C4A8" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Brick rows — alternating offset -->
  <!-- Row 1 -->
  <rect x="20" y="82" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="56" y="82" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="92" y="82" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="128" y="82" width="32" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>

  <!-- Row 2 (offset) -->
  <rect x="20" y="96" width="18" height="12" rx="2" fill="#BB3B1E" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="40" y="96" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="76" y="96" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="112" y="96" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="148" y="96" width="14" height="12" rx="2" fill="#BB3B1E" stroke="#D9C4A8" stroke-width="1.5"/>

  <!-- Row 3 -->
  <rect x="20" y="110" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="56" y="110" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="92" y="110" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="128" y="110" width="32" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>

  <!-- Row 4 (offset) -->
  <rect x="20" y="124" width="18" height="12" rx="2" fill="#BB3B1E" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="40" y="124" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="76" y="124" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="112" y="124" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="148" y="124" width="14" height="12" rx="2" fill="#BB3B1E" stroke="#D9C4A8" stroke-width="1.5"/>

  <!-- Row 5 -->
  <rect x="20" y="138" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="56" y="138" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="92" y="138" width="34" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>
  <rect x="128" y="138" width="32" height="12" rx="2" fill="#CC4422" stroke="#D9C4A8" stroke-width="1.5"/>

  <!-- Wall outline (on top of bricks) -->
  <rect x="18" y="80" width="144" height="76" rx="2" fill="none" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Left window -->
  <rect x="28" y="88" width="34" height="30" rx="3" fill="#B8D4EF" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Window frame -->
  <line x1="45" y1="88" x2="45" y2="118" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="28" y1="103" x2="62" y2="103" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Window sill -->
  <rect x="26" y="116" width="38" height="5" rx="2" fill="#D9C4A8" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Happy face in left window (charming detail) -->
  <circle cx="37" cy="96" r="2.5" fill="#1A1A1A"/>
  <circle cx="53" cy="96" r="2.5" fill="#1A1A1A"/>
  <path d="M 37 105 Q 45 110 53 105" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Right window -->
  <rect x="118" y="88" width="34" height="30" rx="3" fill="#B8D4EF" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="135" y1="88" x2="135" y2="118" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="118" y1="103" x2="152" y2="103" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="116" y="116" width="38" height="5" rx="2" fill="#D9C4A8" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Door (solid, center) -->
  <path d="M 70,156 L 70,120 Q 70,108 83,108 Q 96,108 96,120 L 96,156 Z" fill="#4A2800" stroke="#1A1A1A" stroke-width="3.5"/>
  <!-- Door panels -->
  <rect x="74" y="112" width="9" height="12" rx="2" fill="#3A1E00" stroke="#5C3810" stroke-width="1.5"/>
  <rect x="86" y="112" width="9" height="12" rx="2" fill="#3A1E00" stroke="#5C3810" stroke-width="1.5"/>
  <rect x="74" y="128" width="9" height="14" rx="2" fill="#3A1E00" stroke="#5C3810" stroke-width="1.5"/>
  <rect x="86" y="128" width="9" height="14" rx="2" fill="#3A1E00" stroke="#5C3810" stroke-width="1.5"/>
  <!-- Doorknob -->
  <circle cx="68" cy="136" r="4" fill="#D4A020" stroke="#1A1A1A" stroke-width="2"/>
</svg>
