<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160">
  <defs>
    <linearGradient id="stickWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5020"/>
      <stop offset="50%" stop-color="#8B5E2A"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="90" cy="158" rx="72" ry="6" fill="#00000022" stroke="none"/>

  <!-- Wall background (slightly unsteady) -->
  <polygon points="24,152 28,80 152,82 156,152" fill="url(#stickWallGrad)" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wall sticks — diagonal overlapping sticks pattern -->
  <!-- Left-leaning sticks -->
  <line x1="28" y1="84" x2="90" y2="152" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>
  <line x1="52" y1="80" x2="114" y2="152" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="80" x2="138" y2="152" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="82" x2="156" y2="152" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>

  <!-- Right-leaning sticks -->
  <line x1="28" y1="120" x2="90" y2="82" stroke="#6B4416" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="152" x2="114" y2="80" stroke="#6B4416" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="152" x2="138" y2="82" stroke="#6B4416" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="152" x2="156" y2="100" stroke="#6B4416" stroke-width="4" stroke-linecap="round"/>

  <!-- Horizontal lashing sticks -->
  <line x1="26" y1="100" x2="154" y2="102" stroke="#A07040" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="122" x2="155" y2="122" stroke="#A07040" stroke-width="4" stroke-linecap="round"/>
  <line x1="24" y1="142" x2="156" y2="142" stroke="#A07040" stroke-width="4" stroke-linecap="round"/>

  <!-- Roof (crossed sticks, pointed) -->
  <!-- Roof fill -->
  <polygon points="14,84 90,14 166,86" fill="#8B5E2A" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Crossed sticks on roof left side -->
  <line x1="14" y1="84" x2="90" y2="14" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>
  <line x1="22" y1="84" x2="90" y2="22" stroke="#C4924A" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="84" x2="90" y2="36" stroke="#6B4416" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="84" x2="90" y2="50" stroke="#A07040" stroke-width="3" stroke-linecap="round"/>

  <!-- Crossed sticks on roof right side -->
  <line x1="166" y1="86" x2="90" y2="14" stroke="#C4924A" stroke-width="5" stroke-linecap="round"/>
  <line x1="158" y1="86" x2="90" y2="22" stroke="#C4924A" stroke-width="4" stroke-linecap="round"/>
  <line x1="144" y1="86" x2="90" y2="36" stroke="#6B4416" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="130" y1="84" x2="90" y2="50" stroke="#A07040" stroke-width="3" stroke-linecap="round"/>

  <!-- Horizontal roof sticks -->
  <line x1="48" y1="64" x2="132" y2="66" stroke="#7A5020" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="78" x2="148" y2="80" stroke="#7A5020" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sticks sticking out past roof peak -->
  <line x1="86" y1="14" x2="84" y2="4" stroke="#8B5E2A" stroke-width="4" stroke-linecap="round"/>
  <line x1="92" y1="14" x2="96" y2="2" stroke="#8B5E2A" stroke-width="4" stroke-linecap="round"/>

  <!-- Window (small square, left) -->
  <rect x="40" y="96" width="26" height="26" rx="3" fill="#B8D0E8" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="53" y1="96" x2="53" y2="122" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="40" y1="109" x2="66" y2="109" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Door (arched, center-right) -->
  <path d="M 106,152 L 106,118 Q 106,106 118,106 Q 130,106 130,118 L 130,152 Z" fill="#5C3010" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Door grain -->
  <line x1="110" y1="112" x2="110" y2="152" stroke="#3E1E08" stroke-width="1.5"/>
  <line x1="118" y1="108" x2="118" y2="152" stroke="#3E1E08" stroke-width="1.5"/>
  <line x1="126" y1="112" x2="126" y2="152" stroke="#3E1E08" stroke-width="1.5"/>
  <!-- Door knob -->
  <circle cx="104" cy="132" r="3.5" fill="#D4A020" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
