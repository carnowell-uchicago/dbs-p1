<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160">
  <defs>
    <radialGradient id="wolfBodyGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8080A0"/>
      <stop offset="100%" stop-color="#6B6B8A"/>
    </radialGradient>
    <radialGradient id="wolfBellyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#B8B8D8"/>
      <stop offset="100%" stop-color="#A0A0C0"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C0C0E0"/>
      <stop offset="100%" stop-color="#A0A0C0"/>
    </radialGradient>
  </defs>

  <!-- Body leaning forward -->
  <ellipse cx="62" cy="115" rx="40" ry="34" fill="url(#wolfBodyGrad)" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Belly patch -->
  <ellipse cx="62" cy="118" rx="26" ry="22" fill="url(#wolfBellyGrad)" stroke="none"/>

  <!-- Tail (up behind) -->
  <path d="M 96 108 Q 128 85 120 65 Q 116 55 108 62" fill="none" stroke="#6B6B8A" stroke-width="10" stroke-linecap="round"/>
  <path d="M 96 108 Q 128 85 120 65 Q 116 55 108 62" fill="none" stroke="#8080A0" stroke-width="5" stroke-linecap="round"/>

  <!-- Left ear (back) -->
  <polygon points="40,42 28,12 52,28" fill="#6B6B8A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="40,38 33,20 48,28" fill="#9090B0" stroke="none"/>

  <!-- Head -->
  <ellipse cx="72" cy="58" rx="34" ry="30" fill="url(#wolfBodyGrad)" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Right ear (front) -->
  <polygon points="100,38 114,10 116,36" fill="#6B6B8A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="102,36 112,18 114,34" fill="#9090B0" stroke="none"/>

  <!-- Puffed left cheek (exaggerated) -->
  <ellipse cx="44" cy="66" rx="22" ry="18" fill="url(#cheekGrad)" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Puffed right cheek (exaggerated) -->
  <ellipse cx="100" cy="64" rx="22" ry="18" fill="url(#cheekGrad)" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Snout/muzzle -->
  <ellipse cx="105" cy="68" rx="20" ry="14" fill="#8888AA" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Nostrils -->
  <ellipse cx="100" cy="67" rx="3" ry="2" fill="#4A4A6A" stroke="none"/>
  <ellipse cx="110" cy="67" rx="3" ry="2" fill="#4A4A6A" stroke="none"/>

  <!-- Left eye (angry, squinting) -->
  <ellipse cx="58" cy="50" rx="9" ry="7" fill="white" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="60" cy="52" rx="5" ry="4.5" fill="#FF4444"/>
  <ellipse cx="61" cy="51" rx="2.5" ry="2.5" fill="#1A1A1A"/>
  <circle cx="62" cy="50" r="1" fill="white"/>
  <!-- Angry brow left -->
  <path d="M 50 44 Q 58 40 67 43" fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right eye (angry) -->
  <ellipse cx="86" cy="50" rx="9" ry="7" fill="white" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="87" cy="52" rx="5" ry="4.5" fill="#FF4444"/>
  <ellipse cx="88" cy="51" rx="2.5" ry="2.5" fill="#1A1A1A"/>
  <circle cx="89" cy="50" r="1" fill="white"/>
  <!-- Angry brow right -->
  <path d="M 78 43 Q 86 40 95 44" fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mouth / teeth showing -->
  <path d="M 96 76 Q 105 83 118 77" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <polygon points="100,76 103,83 106,76" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="108,75 111,82 114,75" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Wind lines blowing from snout -->
  <path d="M 124 60 Q 136 54 138 48" fill="none" stroke="#A0D4FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 126 68 Q 140 65 142 60" fill="none" stroke="#A0D4FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 125 76 Q 138 77 140 72" fill="none" stroke="#A0D4FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 122 52 Q 132 44 132 36" fill="none" stroke="#A0D4FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 126 82 Q 137 86 136 79" fill="none" stroke="#A0D4FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front legs/paws -->
  <rect x="36" y="136" width="18" height="20" rx="7" fill="#6B6B8A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="62" y="138" width="18" height="20" rx="7" fill="#6B6B8A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Paw details -->
  <path d="M 38 156 Q 45 160 54 156" fill="none" stroke="#4A4A6A" stroke-width="2"/>
  <path d="M 64 158 Q 71 162 80 158" fill="none" stroke="#4A4A6A" stroke-width="2"/>
</svg>
