<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FAC4CC"/>
      <stop offset="100%" stop-color="#F4A7B0"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FAC4CC"/>
      <stop offset="100%" stop-color="#F4A7B0"/>
    </radialGradient>
  </defs>

  <!-- Curly tail -->
  <path d="M 28 75 Q 15 68 16 58 Q 17 48 26 50 Q 32 52 28 60" fill="none" stroke="#E88A9A" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="65" cy="95" rx="42" ry="36" fill="url(#bodyGrad)" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Left ear (back) -->
  <polygon points="45,28 38,8 54,18" fill="#E88A9A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="72" cy="48" r="32" fill="url(#headGrad)" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Right ear (front) -->
  <polygon points="88,26 96,8 100,24" fill="#E88A9A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="82" cy="40" r="8" fill="white" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="84" cy="40" r="4" fill="#1A1A1A"/>
  <circle cx="85" cy="38" r="1.5" fill="white"/>

  <!-- Snout -->
  <ellipse cx="90" cy="56" rx="16" ry="12" fill="#E88A9A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Nostrils -->
  <ellipse cx="85" cy="58" rx="3.5" ry="2.5" fill="#C06070" stroke="none"/>
  <ellipse cx="95" cy="58" rx="3.5" ry="2.5" fill="#C06070" stroke="none"/>

  <!-- Smile -->
  <path d="M 80 65 Q 90 71 100 65" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

  <!-- Front legs -->
  <rect x="50" y="122" width="16" height="18" rx="6" fill="#F4A7B0" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="74" y="122" width="16" height="18" rx="6" fill="#F4A7B0" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Back legs -->
  <rect x="26" y="120" width="14" height="16" rx="5" fill="#EE9EAA" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="99" y="120" width="14" height="16" rx="5" fill="#EE9EAA" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Hooves -->
  <ellipse cx="58" cy="140" rx="9" ry="4" fill="#C06878" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="82" cy="140" rx="9" ry="4" fill="#C06878" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="33" cy="137" rx="8" ry="4" fill="#C06878" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="106" cy="137" rx="8" ry="4" fill="#C06878" stroke="#1A1A1A" stroke-width="2.5"/>
</svg>
