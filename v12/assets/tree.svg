  <circle cx="50" cy="50" r="11" fill="#2E882E" stroke="none"/>
  <circle cx="36" cy="62" r="12" fill="#2E882E" stroke="none"/>

  <!-- Main foliage circle -->
  <circle cx="35" cy="42" r="28" fill="#3AAA3A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Foliage texture spots (lighter) -->
  <circle cx="24" cy="34" r="7" fill="#48C248" stroke="none"/>
  <circle cx="44" cy="28" r="6" fill="#48C248" stroke="none"/>
  <circle cx="28" cy="52" r="5" fill="#48C248" stroke="none"/>
  <circle cx="46" cy="48" r="6" fill="#48C248" stroke="none"/>

  <!-- Foliage outline (on top of everything) -->
