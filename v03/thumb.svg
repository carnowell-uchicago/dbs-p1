<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <!-- Deep dark background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14203a"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect width="1024" height="768" fill="url(#glow)"/>

  <!-- Top label -->
  <text x="512" y="200" text-anchor="middle" fill="#8899aa" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="6" font-weight="normal">A NATURAL HISTORY</text>

  <!-- Thin accent line above title -->
  <line x1="320" y1="220" x2="704" y2="220" stroke="#8899aa" stroke-width="0.5" opacity="0.6"/>

  <!-- Main title -->
  <text x="512" y="360" text-anchor="middle" fill="#e8e2d4" font-family="Arial,Helvetica,sans-serif" font-size="200" font-weight="100" letter-spacing="-4" opacity="0.95">THREE</text>

  <!-- Thin accent line below title -->
  <line x1="320" y1="384" x2="704" y2="384" stroke="#8899aa" stroke-width="0.5" opacity="0.6"/>

  <!-- Subtitle / chapter counter -->
  <text x="512" y="420" text-anchor="middle" fill="#8899aa" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="5">DIRECTED BY NATURE ITSELF</text>

  <!-- Amber verdict accent at bottom -->
  <text x="512" y="580" text-anchor="middle" fill="#c9a96e" font-family="Georgia,serif" font-size="17" font-style="italic" opacity="0.7">"In the meadowlands of the Northern Plains,</text>
  <text x="512" y="606" text-anchor="middle" fill="#c9a96e" font-family="Georgia,serif" font-size="17" font-style="italic" opacity="0.7">three remarkable siblings prepare to leave the family den."</text>

  <!-- Chapter nav pills -->
  <rect x="398" y="648" width="100" height="32" rx="2" fill="none" stroke="#e8e2d4" stroke-width="1" opacity="0.2"/>
  <text x="448" y="669" text-anchor="middle" fill="#e8e2d4" font-family="Arial,sans-serif" font-size="12" opacity="0.5">← Back</text>
  <rect x="526" y="648" width="100" height="32" rx="2" fill="none" stroke="#e8e2d4" stroke-width="1" opacity="0.2"/>
  <text x="576" y="669" text-anchor="middle" fill="#e8e2d4" font-family="Arial,sans-serif" font-size="12" opacity="0.5">Next →</text>
  <text x="512" y="716" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="11" opacity="0.6">Chapter 1 / 7</text>
</svg>
