<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <radialGradient id="alpha-sky" cx="50%" cy="0%">
      <stop offset="0%" stop-color="#0a1525"/>
      <stop offset="100%" stop-color="#050a15"/>
    </radialGradient>
    <radialGradient id="dome-grad" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#d8d8d8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#b0b0b8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8888a0" stop-opacity="1"/>
    </radialGradient>
    <filter id="dome-blur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background: dark space/planetary surface -->
  <rect width="400" height="280" fill="url(#alpha-sky)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="15" cy="10" r="0.7"/>
    <circle cx="40" cy="5" r="1"/>
    <circle cx="80" cy="15" r="0.8"/>
    <circle cx="120" cy="8" r="0.6"/>
    <circle cx="200" cy="12" r="0.9"/>
    <circle cx="280" cy="6" r="0.7"/>
    <circle cx="330" cy="18" r="1"/>
    <circle cx="370" cy="10" r="0.8"/>
    <circle cx="390" cy="30" r="0.6"/>
    <circle cx="355" cy="40" r="0.7"/>
    <circle cx="20" cy="55" r="0.9"/>
    <circle cx="60" cy="48" r="0.6"/>
    <circle cx="150" cy="35" r="0.8"/>
    <circle cx="250" cy="20" r="0.7"/>
  </g>

  <!-- Planetary surface (rocky, barren) -->
  <path d="M 0,200 Q 50,185 100,195 Q 150,205 200,190 Q 250,175 300,188 Q 350,200 400,185 L 400,280 L 0,280 Z" fill="#1a1208"/>
  <!-- Surface rocks -->
  <ellipse cx="50" cy="205" rx="20" ry="6" fill="#120d06"/>
  <ellipse cx="320" cy="200" rx="15" ry="5" fill="#120d06"/>
  <ellipse cx="380" cy="210" rx="10" ry="4" fill="#120d06"/>

  <!-- Inflatable dome - slightly irregular/sagging shape -->
  <!-- Shadow base -->
  <ellipse cx="200" cy="197" rx="80" ry="10" fill="#0d0a05" opacity="0.6"/>

  <!-- Main dome body - irregular, slightly deflated looking -->
  <path d="M 125,195 Q 128,140 150,115 Q 168,95 195,90 Q 215,88 232,95 Q 255,108 268,135 Q 278,158 275,195 Z"
        fill="url(#dome-grad)" stroke="#9090a8" stroke-width="1.5"/>

  <!-- Inflation seam lines - slightly wavy/wrinkled -->
  <path d="M 155,195 Q 158,155 165,120 Q 168,112 170,110" stroke="#8888a0" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 175,195 Q 177,150 183,118 Q 185,110 186,108" stroke="#8888a0" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 200,195 Q 200,145 200,110 Q 200,105 200,103" stroke="#8888a0" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 225,195 Q 223,150 217,118 Q 215,110 214,108" stroke="#8888a0" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <path d="M 248,195 Q 244,158 235,122 Q 232,112 230,110" stroke="#8888a0" stroke-width="1" fill="none" stroke-dasharray="4,2"/>

  <!-- Horizontal inflation rings - wavy -->
  <path d="M 135,175 Q 165,170 200,170 Q 238,170 265,175" stroke="#9090a8" stroke-width="0.8" fill="none"/>
  <path d="M 140,155 Q 165,149 200,149 Q 238,149 260,155" stroke="#9090a8" stroke-width="0.8" fill="none"/>
  <path d="M 148,136 Q 168,129 200,129 Q 232,129 252,136" stroke="#9090a8" stroke-width="0.8" fill="none"/>
  <path d="M 158,118 Q 174,112 200,112 Q 226,112 242,118" stroke="#9090a8" stroke-width="0.8" fill="none"/>

  <!-- Dome leaning slightly - small wrinkle at base -->
  <path d="M 125,195 Q 122,192 120,190 Q 123,188 128,192" fill="#8888a0" opacity="0.5"/>

  <!-- Porthole window with worried pig -->
  <circle cx="200" cy="152" r="20" fill="#1a2a3a" stroke="#7070a0" stroke-width="2.5"/>
  <circle cx="200" cy="152" r="16" fill="#1e3048" stroke="#5060a0" stroke-width="1"/>
  <!-- Circular frame bolts -->
  <circle cx="200" cy="133" r="2.5" fill="#7070a0"/>
  <circle cx="200" cy="171" r="2.5" fill="#7070a0"/>
  <circle cx="181" cy="152" r="2.5" fill="#7070a0"/>
  <circle cx="219" cy="152" r="2.5" fill="#7070a0"/>
  <!-- Worried pig face in window -->
  <circle cx="200" cy="149" r="9" fill="#f0a080"/>
  <ellipse cx="200" cy="154" rx="6" ry="4.5" fill="#e09070"/>
  <!-- Snout -->
  <ellipse cx="198" cy="155" rx="1.8" ry="2" fill="#c06050"/>
  <ellipse cx="202" cy="155" rx="1.8" ry="2" fill="#c06050"/>
  <!-- Worried eyes -->
  <ellipse cx="196" cy="147" rx="2" ry="2.5" fill="#333"/>
  <ellipse cx="204" cy="147" rx="2" ry="2.5" fill="#333"/>
  <circle cx="196.8" cy="146" r="0.8" fill="white"/>
  <circle cx="204.8" cy="146" r="0.8" fill="white"/>
  <!-- Worried brow -->
  <path d="M 193,144 Q 196,142 199,143.5" stroke="#8a5030" stroke-width="1" fill="none"/>
  <path d="M 201,143.5 Q 204,142 207,144" stroke="#8a5030" stroke-width="1" fill="none"/>
  <!-- Sweat drop -->
  <path d="M 208,143 Q 210,140 209,137" stroke="#6090cc" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="209" cy="136.5" rx="1.5" ry="2" fill="#6090cc"/>

  <!-- Emergency exit hatch at base -->
  <rect x="183" y="183" width="34" height="18" rx="3" fill="#c0c0d0" stroke="#8080b0" stroke-width="1.5"/>
  <text x="200" y="195" font-family="'Courier New', Courier, monospace" font-size="5" fill="#555" text-anchor="middle">EMRG EXIT</text>
  <!-- Hatch handle -->
  <rect x="196" y="186" width="8" height="3" rx="1.5" fill="#888" stroke="#666" stroke-width="0.5"/>
  <!-- Hatch barely sealed indicator -->
  <circle cx="192" cy="187" r="2" fill="#ffaa00"/>
  <text x="192" y="186" font-family="monospace" font-size="4" fill="#330" text-anchor="middle">!</text>

  <!-- Callout lines and labels -->
  <!-- Polyethylene skin -->
  <line x1="152" y1="130" x2="75" y2="80" stroke="#e8e8f0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <circle cx="75" cy="80" r="1.5" fill="#e8e8f0"/>
  <text x="5" y="78" font-family="'Courier New', Courier, monospace" font-size="7" fill="#e8e8f0">POLYETHYLENE SKIN (2.3mm)</text>

  <!-- Straw-equivalent insulation -->
  <line x1="245" y1="125" x2="315" y2="70" stroke="#e8e8f0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <circle cx="315" cy="70" r="1.5" fill="#e8e8f0"/>
  <text x="318" y="73" font-family="'Courier New', Courier, monospace" font-size="7" fill="#e8e8f0">STRAW-EQUIV. INSULATION</text>

  <!-- Emergency exit label -->
  <line x1="217" y1="190" x2="310" y2="155" stroke="#ffaa00" stroke-width="0.8" stroke-dasharray="3,2"/>
  <circle cx="310" cy="155" r="1.5" fill="#ffaa00"/>
  <text x="313" y="158" font-family="'Courier New', Courier, monospace" font-size="7" fill="#ffaa00">EMERGENCY EXIT (PRIMARY)</text>

  <!-- Pressure seal label -->
  <line x1="183" y1="188" x2="80" y2="170" stroke="#ff3333" stroke-width="0.8" stroke-dasharray="3,2"/>
  <circle cx="80" cy="170" r="1.5" fill="#ff3333"/>
  <text x="5" y="168" font-family="'Courier New', Courier, monospace" font-size="7" fill="#ff3333">PRESSURE SEAL (QUESTIONABLE)</text>

  <!-- Warning triangle -->
  <polygon points="258,88 268,105 248,105" fill="none" stroke="#ffaa00" stroke-width="2"/>
  <text x="258" y="102" font-family="monospace" font-size="9" fill="#ffaa00" text-anchor="middle">!</text>

  <!-- Status readout bar at bottom -->
  <rect x="0" y="245" width="400" height="35" fill="#0a0f1f" opacity="0.9"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#0b3d91" stroke-width="1.5"/>
  <text x="12" y="261" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#aaa">STRUCTURAL INTEGRITY:</text>
  <text x="140" y="261" font-family="'Courier New', Courier, monospace" font-size="7.5" font-weight="bold" fill="#ff3333">12%</text>
  <text x="162" y="261" font-family="'Courier New', Courier, monospace" font-size="8" fill="#ffaa00"> ⚠</text>
  <text x="185" y="261" font-family="'Courier New', Courier, monospace" font-size="7" fill="#555">|</text>
  <text x="192" y="261" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#aaa">WOLF RESISTANCE:</text>
  <text x="298" y="261" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#ff3333">NOT RATED</text>
  <text x="12" y="273" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#aaa">ASSEMBLY TIME:</text>
  <text x="112" y="273" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#e8e8f0">4 MIN</text>
  <text x="160" y="273" font-family="'Courier New', Courier, monospace" font-size="7" fill="#555">|</text>
  <text x="168" y="273" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#aaa">DESIGNATION:</text>
  <text x="248" y="273" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#e8e8f0">HALMUM-1 (STRAW CLASS)</text>

  <!-- Small grid overlay for technical feel -->
  <g stroke="#0b3d91" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>
</svg>
