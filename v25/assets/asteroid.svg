<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <pattern id="crosshatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="asteroid-grad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#7a6040"/>
      <stop offset="50%" stop-color="#5a4428"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <filter id="blur-trail">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Space background -->
  <rect width="300" height="200" fill="#050a1a"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="10" cy="15" r="0.8"/>
    <circle cx="35" cy="8" r="1"/>
    <circle cx="60" cy="20" r="0.7"/>
    <circle cx="20" cy="45" r="0.9"/>
    <circle cx="5" cy="80" r="0.6"/>
    <circle cx="45" cy="70" r="1.1"/>
    <circle cx="15" cy="110" r="0.8"/>
    <circle cx="38" cy="135" r="0.7"/>
    <circle cx="10" cy="160" r="1"/>
    <circle cx="50" cy="185" r="0.8"/>
    <circle cx="80" cy="5" r="0.9"/>
    <circle cx="100" cy="25" r="0.7"/>
    <circle cx="120" cy="10" r="1"/>
    <circle cx="85" cy="180" r="0.8"/>
    <circle cx="115" cy="165" r="0.6"/>
    <circle cx="260" cy="10" r="1"/>
    <circle cx="280" cy="30" r="0.8"/>
    <circle cx="295" cy="55" r="0.7"/>
    <circle cx="275" cy="80" r="0.9"/>
    <circle cx="290" cy="120" r="0.6"/>
    <circle cx="255" cy="175" r="1"/>
    <circle cx="285" cy="160" r="0.8"/>
    <circle cx="295" cy="185" r="0.7"/>
    <circle cx="130" cy="190" r="0.9"/>
    <circle cx="160" cy="5" r="0.8"/>
    <circle cx="200" cy="15" r="0.6"/>
    <circle cx="230" cy="8" r="1"/>
  </g>

  <!-- Motion blur trail behind asteroid -->
  <path d="M 20,85 Q 60,90 110,100" stroke="#6a4020" stroke-width="18" stroke-linecap="round" opacity="0.2" filter="url(#blur-trail)"/>
  <path d="M 30,88 Q 70,92 110,100" stroke="#8a5530" stroke-width="10" stroke-linecap="round" opacity="0.3" filter="url(#blur-trail)"/>
  <path d="M 45,91 Q 80,94 110,100" stroke="#aa6640" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- Red trajectory arrow from left -->
  <defs>
    <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#ff3333"/>
    </marker>
  </defs>
  <line x1="5" y1="100" x2="108" y2="100" stroke="#ff3333" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#red-arrow)" opacity="0.8"/>

  <!-- Asteroid body - irregular polygon shape -->
  <polygon points="155,55 185,45 215,52 238,72 245,100 240,128 220,148 190,155 162,148 140,128 132,100 138,72" fill="url(#asteroid-grad)" stroke="#6a4020" stroke-width="1.5"/>

  <!-- Crosshatch texture overlay on asteroid -->
  <polygon points="155,55 185,45 215,52 238,72 245,100 240,128 220,148 190,155 162,148 140,128 132,100 138,72" fill="url(#crosshatch)" opacity="0.3"/>

  <!-- Surface detail / lighter patches -->
  <ellipse cx="175" cy="72" rx="18" ry="12" fill="#7a6040" opacity="0.5" transform="rotate(-20,175,72)"/>
  <ellipse cx="210" cy="120" rx="14" ry="9" fill="#7a6040" opacity="0.4" transform="rotate(15,210,120)"/>
  <ellipse cx="160" cy="125" rx="10" ry="7" fill="#8a7050" opacity="0.5" transform="rotate(-10,160,125)"/>

  <!-- Craters -->
  <circle cx="175" cy="82" r="14" fill="none" stroke="#3a2810" stroke-width="2"/>
  <circle cx="175" cy="82" r="9" fill="#4a3018" opacity="0.7"/>
  <circle cx="175" cy="82" r="4" fill="#2a1808"/>

  <circle cx="210" cy="108" r="10" fill="none" stroke="#3a2810" stroke-width="1.5"/>
  <circle cx="210" cy="108" r="6" fill="#4a3018" opacity="0.6"/>

  <circle cx="158" cy="100" r="7" fill="none" stroke="#3a2810" stroke-width="1.5"/>
  <circle cx="158" cy="100" r="4" fill="#4a3018" opacity="0.5"/>

  <circle cx="200" cy="135" r="8" fill="none" stroke="#3a2810" stroke-width="1.5"/>
  <circle cx="200" cy="135" r="5" fill="#4a3018" opacity="0.5"/>

  <circle cx="185" cy="60" r="5" fill="none" stroke="#3a2810" stroke-width="1"/>
  <circle cx="185" cy="60" r="3" fill="#4a3018" opacity="0.5"/>

  <!-- WOLFSBERG-2019 callout line and label -->
  <line x1="245" y1="72" x2="270" y2="50" stroke="#e8e8f0" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="270" cy="50" r="2" fill="#e8e8f0"/>
  <text x="272" y="48" font-family="'Courier New', Courier, monospace" font-size="8" font-weight="bold" fill="#e8e8f0">WOLFSBERG-2019</text>

  <!-- Technical label: MASS -->
  <line x1="132" y1="88" x2="95" y2="65" stroke="#aaa" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="95" cy="65" r="1.5" fill="#aaa"/>
  <text x="5" y="62" font-family="'Courier New', Courier, monospace" font-size="7" fill="#aaa">MASS: INDETERMINATE</text>

  <!-- Technical label: VELOCITY -->
  <line x1="132" y1="110" x2="90" y2="110" stroke="#aaa" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="90" cy="110" r="1.5" fill="#aaa"/>
  <text x="5" y="113" font-family="'Courier New', Courier, monospace" font-size="7" fill="#aaa">VELOCITY: EXTREME</text>

  <!-- Technical label: THREAT CLASS -->
  <line x1="132" y1="130" x2="90" y2="140" stroke="#ff3333" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="90" cy="140" r="1.5" fill="#ff3333"/>
  <text x="5" y="143" font-family="'Courier New', Courier, monospace" font-size="7" fill="#ff3333">THREAT CLASS: ALPHA-WOLF</text>

  <!-- Classification box bottom-right -->
  <rect x="165" y="165" width="130" height="28" rx="2" fill="#0a0f1f" stroke="#ff3333" stroke-width="1.5"/>
  <line x1="165" y1="172" x2="295" y2="172" stroke="#ff3333" stroke-width="0.5"/>
  <text x="230" y="170" font-family="'Courier New', Courier, monospace" font-size="6" fill="#ff3333" text-anchor="middle">CLASSIFIED</text>
  <text x="230" y="181" font-family="'Courier New', Courier, monospace" font-size="5.5" fill="#e8e8f0" text-anchor="middle">SSA THREAT REGISTRY</text>
  <text x="230" y="189" font-family="'Courier New', Courier, monospace" font-size="5" fill="#888" text-anchor="middle">DOC-REF: SSA-TR-2019-0047</text>
</svg>
