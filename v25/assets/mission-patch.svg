<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="patch-clip">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
    <radialGradient id="space-bg" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
  </defs>

  <!-- Base circle with space background -->
  <circle cx="100" cy="100" r="94" fill="#D4AF37"/>
  <circle cx="100" cy="100" r="90" fill="url(#space-bg)"/>

  <!-- Stars -->
  <g fill="white" clip-path="url(#patch-clip)">
    <circle cx="25" cy="40" r="0.9"/>
    <circle cx="45" cy="25" r="1.1"/>
    <circle cx="70" cy="18" r="0.7"/>
    <circle cx="130" cy="20" r="1"/>
    <circle cx="160" cy="35" r="0.8"/>
    <circle cx="172" cy="65" r="1.1"/>
    <circle cx="175" cy="130" r="0.8"/>
    <circle cx="35" cy="155" r="0.9"/>
    <circle cx="18" cy="100" r="0.7"/>
    <circle cx="32" cy="80" r="1"/>
    <circle cx="168" cy="160" r="0.8"/>
    <circle cx="140" cy="175" r="1"/>
    <circle cx="55" cy="170" r="0.7"/>
    <circle cx="15" cy="130" r="0.9"/>
  </g>

  <!-- Planetary surface (rocky ground at bottom) -->
  <path d="M 10,145 Q 30,135 55,140 Q 75,145 100,138 Q 125,131 145,140 Q 165,148 190,140 L 190,190 L 10,190 Z" fill="#2a1a0a" clip-path="url(#patch-clip)"/>
  <!-- Surface rocks/craters -->
  <ellipse cx="40" cy="150" rx="12" ry="4" fill="#1e1208" clip-path="url(#patch-clip)"/>
  <ellipse cx="155" cy="148" rx="10" ry="3" fill="#1e1208" clip-path="url(#patch-clip)"/>

  <!-- Fortress / bunker structure on surface -->
  <!-- Main body -->
  <rect x="72" y="95" width="56" height="48" rx="3" fill="#c8c8b0" stroke="#888" stroke-width="1.5" clip-path="url(#patch-clip)"/>
  <!-- Brick pattern on fortress -->
  <g stroke="#aaa" stroke-width="0.5" fill="none" clip-path="url(#patch-clip)">
    <line x1="72" y1="107" x2="128" y2="107"/>
    <line x1="72" y1="119" x2="128" y2="119"/>
    <line x1="72" y1="131" x2="128" y2="131"/>
    <line x1="85" y1="95" x2="85" y2="107"/>
    <line x1="98" y1="95" x2="98" y2="107"/>
    <line x1="111" y1="95" x2="111" y2="107"/>
    <line x1="78" y1="107" x2="78" y2="119"/>
    <line x1="91" y1="107" x2="91" y2="119"/>
    <line x1="104" y1="107" x2="104" y2="119"/>
    <line x1="117" y1="107" x2="117" y2="119"/>
    <line x1="85" y1="119" x2="85" y2="131"/>
    <line x1="98" y1="119" x2="98" y2="131"/>
    <line x1="111" y1="119" x2="111" y2="131"/>
    <line x1="78" y1="131" x2="78" y2="143"/>
    <line x1="91" y1="131" x2="91" y2="143"/>
    <line x1="104" y1="131" x2="104" y2="143"/>
    <line x1="117" y1="131" x2="117" y2="143"/>
  </g>
  <!-- Fortress roof/battlements -->
  <rect x="70" y="88" width="60" height="10" rx="2" fill="#b0b090" stroke="#888" stroke-width="1"/>
  <rect x="73" y="83" width="8" height="8" rx="1" fill="#b0b090" stroke="#888" stroke-width="1"/>
  <rect x="87" y="83" width="8" height="8" rx="1" fill="#b0b090" stroke="#888" stroke-width="1"/>
  <rect x="101" y="83" width="8" height="8" rx="1" fill="#b0b090" stroke="#888" stroke-width="1"/>
  <rect x="115" y="83" width="8" height="8" rx="1" fill="#b0b090" stroke="#888" stroke-width="1"/>

  <!-- Fortress door -->
  <rect x="93" y="126" width="14" height="17" rx="7" fill="#3a2800"/>

  <!-- Porthole window with pig silhouette -->
  <circle cx="100" cy="112" r="7" fill="#1a3a5c" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Pig face tiny silhouette -->
  <circle cx="100" cy="111" r="3.5" fill="#f5c0a0"/>
  <ellipse cx="100" cy="113.5" rx="2.5" ry="1.8" fill="#e8a090"/>
  <ellipse cx="99" cy="113.8" rx="0.8" ry="0.9" fill="#c07060"/>
  <ellipse cx="101" cy="113.8" rx="0.8" ry="0.9" fill="#c07060"/>

  <!-- Asteroid (red-orange) approaching from top-right -->
  <g clip-path="url(#patch-clip)">
    <!-- Motion trail -->
    <path d="M 175,18 L 158,38" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
    <!-- Asteroid body -->
    <polygon points="162,38 172,30 178,40 170,48 158,44" fill="#cc4400"/>
    <polygon points="163,40 169,33 175,42 168,46 160,44" fill="#e05500"/>
    <!-- Craters on asteroid -->
    <circle cx="167" cy="40" r="2.5" fill="#aa3300"/>
    <circle cx="172" cy="35" r="1.5" fill="#aa3300"/>
  </g>

  <!-- Deflection arc (green arrow showing asteroid deflecting off fortress) -->
  <path d="M 155,55 Q 140,70 148,85" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" marker-end="url(#green-arrow)"/>
  <defs>
    <marker id="green-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#00ff88"/>
    </marker>
  </defs>

  <!-- Stars between asteroid and fortress -->
  <circle cx="50" cy="55" r="1" fill="white"/>
  <circle cx="65" cy="40" r="1.3" fill="white"/>
  <circle cx="145" cy="60" r="1" fill="white"/>

  <!-- Gold outer text ring -->
  <path id="patch-top" d="M 12,100 A 88,88 0 0,1 188,100" fill="none"/>
  <text font-family="'Arial Narrow', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#D4AF37" letter-spacing="1.5">
    <textPath href="#patch-top" startOffset="4%">OPERATION BRISTLE FORTRESS</textPath>
  </text>

  <path id="patch-bottom" d="M 12,100 A 88,88 0 0,0 188,100" fill="none"/>
  <text font-family="'Arial Narrow', Arial, sans-serif" font-size="10" font-weight="bold" fill="#D4AF37" letter-spacing="1">
    <textPath href="#patch-bottom" startOffset="8%">PER LATERES AD ASTRA</textPath>
  </text>

  <!-- Gold border rings -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#D4AF37" stroke-width="1"/>
</svg>
