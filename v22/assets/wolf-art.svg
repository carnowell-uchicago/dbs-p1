    <path d="M147,197 Q109,197 73,201 Q41,205 18,198"/>
    <path d="M149,207 Q113,220 79,222 Q47,224 22,234"/>
    <!-- Short speed lines near mouth -->
    <line x1="155" y1="183" x2="108" y2="162"/>
    <line x1="153" y1="191" x2="104" y2="178"/>
    <line x1="151" y1="199" x2="101" y2="194"/>
    <line x1="152" y1="208" x2="103" y2="214"/>
    <line x1="154" y1="216" x2="110" y2="230"/>
  </g>

  <!-- Intensity marks around head (anger lines) -->
  <g stroke="#1a0a00" stroke-width="0.8" fill="none" opacity="0.5">
    <line x1="268" y1="88" x2="285" y2="70"/>
    <line x1="262" y1="82" x2="278" y2="62"/>
    <line x1="274" y1="96" x2="295" y2="82"/>
    <line x1="128" y1="88" x2="111" y2="70"/>
    <line x1="135" y1="82" x2="119" y2="62"/>
    <line x1="122" y1="96" x2="101" y2="82"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="195" cy="470" rx="115" ry="11" fill="#b09070" opacity="0.35"/>

  <!-- Stat block footer -->
  <rect x="22" y="444" width="356" height="42" fill="#f0e5c8" stroke="#8b0000" stroke-width="1.5"/>
  <line x1="22" y1="455" x2="378" y2="455" stroke="#8b0000" stroke-width="0.5"/>
  <text x="200" y="452" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#8b0000" font-weight="bold" letter-spacing="2">ACTIONS</text>
  <text x="200" y="464" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#333">Huff &amp; Puff. DC 16 CON save or structure destroyed. On fail, all creatures inside take 4d10 bludgeoning.</text>
  <text x="200" y="476" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#333">Bite: +8 to hit, 5 ft., 2d10+4 piercing. · Claw: +8 to hit, 10 ft., 2d6+4 slashing. · STR 22 · DEX 14 · CON 18</text>
</svg>
