  <!-- ===== BREATH / FORCE LINES from left side of mouth ===== -->
  <g stroke="#8b0000" stroke-width="1.3" fill="none" opacity="0.85">
    <!-- Main radial lines -->
    <line x1="152" y1="192" x2="30" y2="146"/>
    <line x1="148" y1="200" x2="20" y2="196"/>
    <line x1="150" y1="208" x2="25" y2="252"/>
    <line x1="156" y1="187" x2="50" y2="120"/>
    <line x1="144" y1="194" x2="17" y2="170"/>
    <line x1="146" y1="212" x2="28" y2="268"/>
    <line x1="158" y1="183" x2="75" y2="110"/>
    <!-- Wavy breath bands -->
