  <polygon points="392,8 368,8 392,32" fill="#8b0000"/>
  <polygon points="8,492 32,492 8,468" fill="#8b0000"/>
  <polygon points="392,492 368,492 392,468" fill="#8b0000"/>

  <!-- Title banner -->
  <rect x="22" y="18" width="356" height="30" fill="#8b0000"/>
  <text x="200" y="39" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#f4ead5" font-weight="bold" letter-spacing="4">BIG BAD WOLF</text>

  <!-- Subtitle type line -->
  <text x="200" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#5a3a1a" font-style="italic">Large Beast (Huffington), Chaotic Evil</text>

  <!-- ===== WOLF ILLUSTRATION ===== -->

  <!-- Left Ear -->
  <polygon points="140,132 112,52 178,118" fill="#e0c898" stroke="#1a0a00" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="143,124 120,65 170,112" fill="#c09070"/>
  <polygon points="140,132 112,52 178,118" fill="url(#hatch45)" opacity="0.3"/>

  <!-- Right Ear -->
  <polygon points="260,132 288,52 222,118" fill="#e0c898" stroke="#1a0a00" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="257,124 280,65 230,112" fill="#c09070"/>

  <!-- Head base -->
  <ellipse cx="200" cy="162" rx="78" ry="72" fill="#e8d8b5" stroke="#1a0a00" stroke-width="2.5"/>
  <!-- Head shadow right side -->
  <rect x="215" y="92" width="80" height="144" fill="url(#hatch45)" opacity="0.35" clip-path="url(#head-clip)"/>

  <!-- Muzzle / snout -->
  <path d="M157,170 Q178,208 200,213 Q222,208 243,170" fill="#d8c09a" stroke="#1a0a00" stroke-width="1.5"/>

  <!-- Open mouth (gaping) -->
