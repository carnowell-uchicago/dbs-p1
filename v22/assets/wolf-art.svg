  <g stroke="#8a6a40" stroke-width="0.7" fill="none">
    <path d="M298,345 Q306,335 308,348"/>
    <path d="M310,340 Q318,330 320,343"/>
    <path d="M322,338 Q330,330 330,342"/>
    <path d="M332,340 Q340,334 338,346"/>
