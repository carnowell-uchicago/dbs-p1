  <rect x="228" y="404" width="56" height="74" fill="url(#xhatch)" opacity="0.3" clip-path="url(#rleg-clip)"/>
  <!-- Right foot claws -->
  <g stroke="#1a0a00" stroke-width="1.5" fill="#d8c890">
    <path d="M276,465 Q288,480 295,470"/>
    <path d="M266,469 Q276,485 283,475"/>
    <path d="M254,470 Q263,486 270,477"/>
    <path d="M243,467 Q250,483 257,474"/>
  </g>

  <!-- TAIL (behind right side) -->
  <path d="M280,342 Q322,320 350,338 Q370,358 357,383 Q337,395 320,375 Q310,350 287,357 Q274,362 277,347Z" fill="#d8c090" stroke="#1a0a00" stroke-width="1.5"/>
  <ellipse cx="354" cy="378" rx="20" ry="13" fill="#f0e8d0" stroke="#1a0a00" stroke-width="1"/>
