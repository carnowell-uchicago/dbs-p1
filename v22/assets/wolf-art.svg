    <polygon points="183,181 188,201 193,181"/>
    <polygon points="196,181 201,202 206,181"/>
    <polygon points="209,181 214,201 219,181"/>
    <polygon points="221,181 226,200 232,181"/>
  </g>
  <!-- Lower teeth -->
  <g fill="#f0e8d0" stroke="#1a0a00" stroke-width="0.8">
    <polygon points="176,198 180,184 184,198"/>
    <polygon points="196,200 200,186 204,200"/>
    <polygon points="216,198 220,184 224,198"/>
  </g>
