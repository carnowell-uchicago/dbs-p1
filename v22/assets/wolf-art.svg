  <ellipse cx="200" cy="170" rx="18" ry="12" fill="#1a0a00"/>
  <ellipse cx="194" cy="167" rx="5" ry="4" fill="#3d3d3d"/>
  <ellipse cx="206" cy="167" rx="5" ry="4" fill="#3d3d3d"/>

