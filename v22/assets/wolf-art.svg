<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <pattern id="hatch45" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#7a6040" stroke-width="0.8"/>
    </pattern>
    <pattern id="xhatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
