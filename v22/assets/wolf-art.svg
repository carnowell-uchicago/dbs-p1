    <path d="M346,297 Q364,307 358,320 Q344,309 346,297Z"/>
    <path d="M350,287 Q369,293 365,306 Q351,296 350,287Z"/>
    <path d="M350,277 Q369,280 367,293 Q353,286 350,277Z"/>
