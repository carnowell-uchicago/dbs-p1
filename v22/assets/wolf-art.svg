  <ellipse cx="237" cy="138" rx="14" ry="11" fill="#1a0a00"/>
  <ellipse cx="163" cy="138" rx="9" ry="8" fill="#d4a017"/>
  <ellipse cx="237" cy="138" rx="9" ry="8" fill="#d4a017"/>
