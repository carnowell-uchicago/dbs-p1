      <line x1="0" y1="0" x2="6" y2="6" stroke="#5a4030" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#c4a870" stop-opacity="0.25"/>
    </radialGradient>
    <clipPath id="head-clip"><ellipse cx="200" cy="162" rx="78" ry="72"/></clipPath>
    <clipPath id="neck-clip">
      <path d="M148,220 Q175,234 200,237 Q225,234 252,220 L260,256 Q235,268 200,270 Q165,268 140,256 Z"/>
    </clipPath>
    <clipPath id="torso-clip"><ellipse cx="200" cy="322" rx="90" ry="100"/></clipPath>
    <clipPath id="larm-clip">
      <path d="M125,280 Q90,267 68,290 Q55,310 72,332 Q98,340 128,312 L130,280Z"/>
    </clipPath>
    <clipPath id="rarm-clip">
      <path d="M275,270 Q308,250 335,264 Q355,280 342,308 Q318,320 285,302 L272,280Z"/>
    </clipPath>
    <clipPath id="lleg-clip">
      <path d="M150,408 Q132,430 120,452 Q124,470 150,467 Q167,462 170,442 Q170,420 160,408Z"/>
    </clipPath>
    <clipPath id="rleg-clip">
      <path d="M248,408 Q268,430 278,452 Q274,470 248,467 Q231,462 228,442 Q228,420 240,408Z"/>
    </clipPath>
  </defs>

  <!-- Parchment background -->
  <rect width="400" height="500" fill="#f4ead5"/>
  <rect width="400" height="500" fill="url(#vignette)"/>

  <!-- Outer thick border -->
