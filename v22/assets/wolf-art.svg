    <path d="M174,272 Q180,263 186,272"/>
    <path d="M188,267 Q195,257 202,267"/>
    <path d="M205,267 Q212,257 218,267"/>
    <path d="M173,287 Q180,278 187,287"/>
    <path d="M194,284 Q201,274 208,284"/>
    <path d="M211,287 Q218,278 224,287"/>
    <path d="M175,302 Q182,293 188,302"/>
    <path d="M193,300 Q200,291 207,300"/>
    <path d="M210,302 Q217,293 223,302"/>
  </g>

  <!-- LEFT ARM - extended, clawing -->
  <path d="M125,280 Q90,267 68,290 Q55,310 72,332 Q98,340 128,312 L130,280Z" fill="#e0c898" stroke="#1a0a00" stroke-width="2"/>
  <rect x="50" y="258" width="85" height="90" fill="url(#hatch45)" opacity="0.4" clip-path="url(#larm-clip)"/>
  <!-- Left claws -->
  <g stroke="#1a0a00" stroke-width="1.5" fill="#d8c890">
