<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 16-point starburst polygon: alternating long (r=95) and short (r=58) points, mathematically precise -->
  <polygon
    points="
      100.0,5.0 111.3,43.1 136.4,12.2 132.2,51.8
      167.2,32.8 148.2,67.8 187.8,63.6 156.9,88.7
      195.0,100.0 156.9,111.3 187.8,136.4 148.2,132.2
      167.2,167.2 132.2,148.2 136.4,187.8 111.3,156.9
      100.0,195.0 88.7,156.9 63.6,187.8 67.8,148.2
      32.8,167.2 51.8,132.2 12.2,136.4 43.1,111.3
      5.0,100.0 43.1,88.7 12.2,63.6 51.8,67.8
      32.8,32.8 67.8,51.8 63.6,12.2 88.7,43.1
    "
    fill="#FFD700"
    stroke="#CC0000"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Inner circle to give text area contrast -->
  <circle cx="100" cy="100" r="52" fill="#FFD700" stroke="#CC0000" stroke-width="1.5"/>
  <!-- "AS SEEN ON" small bold text -->
  <text
    x="100" y="87"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="13"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="1"
  >AS SEEN ON</text>
  <!-- "TV" large bold red text -->
  <text
    x="100" y="128"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="52"
    fill="#CC0000"
    text-anchor="middle"
    stroke="#800000"
    stroke-width="1"
  >TV</text>
</svg>
