<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280">
  <!-- ====== BEFORE (left half) — grey/desaturated ====== -->
  <rect x="0" y="0" width="248" height="260" fill="#CCCCCC"/>

  <!-- Ground line -->
  <line x1="0" y1="210" x2="248" y2="210" stroke="#999" stroke-width="2"/>

  <!-- Straw house — leaning/crumbling -->
  <g transform="rotate(-8, 100, 160)">
    <!-- House body -->
    <rect x="55" y="145" width="90" height="65" fill="#D4B483" stroke="#9B7B3C" stroke-width="2"/>
    <!-- Roof (triangle, broken edge) -->
    <polygon points="40,145 100,95 155,145" fill="#B8902A" stroke="#7A5C00" stroke-width="2"/>
    <!-- Roof crack -->
    <polyline points="80,115 88,130 75,140" stroke="#7A5C00" stroke-width="1.5" fill="none"/>
    <!-- Door -->
    <rect x="85" y="180" width="20" height="30" rx="10" ry="10" fill="#7A5C00"/>
    <!-- Straw lines on walls -->
    <line x1="60" y1="155" x2="140" y2="155" stroke="#9B7B3C" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="60" y1="165" x2="140" y2="165" stroke="#9B7B3C" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="60" y1="175" x2="140" y2="175" stroke="#9B7B3C" stroke-width="1" stroke-dasharray="6,4"/>
    <!-- Falling debris -->
    <rect x="50" y="135" width="8" height="4" fill="#D4B483" stroke="#9B7B3C" stroke-width="1" transform="rotate(30,54,137)"/>
    <rect x="148" y="140" width="6" height="3" fill="#D4B483" stroke="#9B7B3C" stroke-width="1" transform="rotate(-20,151,141)"/>
  </g>

  <!-- Wolf silhouette (left side, blowing) -->
  <g fill="#888888">
    <!-- Body -->
    <ellipse cx="22" cy="170" rx="16" ry="20"/>
    <!-- Head -->
    <circle cx="30" cy="152" r="12"/>
    <!-- Snout/jaw -->
    <ellipse cx="38" cy="157" rx="10" ry="7"/>
    <!-- Ear left -->
    <polygon points="22,142 18,130 28,140"/>
    <!-- Ear right -->
    <polygon points="32,141 36,129 38,141"/>
    <!-- Tail -->
    <path d="M 8,180 Q -5,195 5,205" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Force arrow -->
  <g>
    <line x1="48" y1="162" x2="78" y2="162" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="52" y="157" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#CC0000">87.3 N →</text>
  </g>

  <!-- Red X overlay -->
  <g stroke="#CC0000" stroke-width="14" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="10" x2="228" y2="250"/>
    <line x1="228" y1="10" x2="20" y2="250"/>
  </g>

  <!-- BEFORE label -->
  <rect x="0" y="0" width="248" height="30" fill="#444444"/>
  <text x="124" y="21" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13"
    fill="#FFFFFF" text-anchor="middle">BEFORE — B. Badwolf™ Attack Simulation</text>

  <!-- ====== DIVIDER ====== -->
  <rect x="246" y="0" width="8" height="260" fill="#111111"/>
  <!-- VS badge -->
  <circle cx="250" cy="130" r="22" fill="#111111" stroke="#FFD700" stroke-width="3"/>
  <text x="250" y="137" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16"
    fill="#FFD700" text-anchor="middle">VS</text>

  <!-- ====== AFTER (right half) — bright, warm ====== -->
  <rect x="254" y="0" width="246" height="260" fill="#FFF8E7"/>

  <!-- Ground line -->
  <line x1="254" y1="210" x2="500" y2="210" stroke="#888" stroke-width="2"/>

  <!-- Brick house — solid, gleaming -->
  <!-- House body with brick grid -->
  <rect x="310" y="140" width="110" height="70" fill="#C0392B" stroke="#7B241C" stroke-width="2"/>
  <!-- Brick pattern -->
  <g stroke="#7B241C" stroke-width="1" fill="none">
    <!-- Horizontal mortar lines -->
    <line x1="310" y1="155" x2="420" y2="155"/>
    <line x1="310" y1="168" x2="420" y2="168"/>
    <line x1="310" y1="181" x2="420" y2="181"/>
    <line x1="310" y1="194" x2="420" y2="194"/>
    <!-- Vertical mortar lines, offset per row -->
    <line x1="342" y1="140" x2="342" y2="155"/>
    <line x1="374" y1="140" x2="374" y2="155"/>
    <line x1="406" y1="140" x2="406" y2="155"/>
    <line x1="326" y1="155" x2="326" y2="168"/>
    <line x1="358" y1="155" x2="358" y2="168"/>
    <line x1="390" y1="155" x2="390" y2="168"/>
    <line x1="342" y1="168" x2="342" y2="181"/>
    <line x1="374" y1="168" x2="374" y2="181"/>
    <line x1="406" y1="168" x2="406" y2="181"/>
    <line x1="326" y1="181" x2="326" y2="194"/>
    <line x1="358" y1="181" x2="358" y2="194"/>
    <line x1="390" y1="181" x2="390" y2="194"/>
    <line x1="342" y1="194" x2="342" y2="210"/>
    <line x1="374" y1="194" x2="374" y2="210"/>
    <line x1="406" y1="194" x2="406" y2="210"/>
  </g>
  <!-- Roof -->
  <polygon points="295,140 365,88 435,140" fill="#7B241C" stroke="#5B1A13" stroke-width="2"/>
  <!-- Chimney -->
  <rect x="395" y="95" width="14" height="30" fill="#7B241C" stroke="#5B1A13" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="352" y="174" width="22" height="36" rx="11" ry="11" fill="#5B1A13"/>
  <!-- Window -->
  <rect x="316" y="150" width="18" height="16" rx="3" fill="#ADE8F4" stroke="#7B241C" stroke-width="1.5"/>
  <rect x="396" y="150" width="18" height="16" rx="3" fill="#ADE8F4" stroke="#7B241C" stroke-width="1.5"/>
  <!-- Shine effect -->
  <ellipse cx="370" cy="100" rx="20" ry="8" fill="white" opacity="0.25" transform="rotate(-30,370,100)"/>

  <!-- Green check overlay -->
  <g stroke="#27AE60" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" fill="none">
    <polyline points="270,130 340,200 480,60"/>
  </g>

  <!-- AFTER label -->
  <rect x="254" y="0" width="246" height="30" fill="#1A7A1A"/>
  <text x="377" y="21" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11"
    fill="#FFFFFF" text-anchor="middle">AFTER — PIGSAFE™ ELITE BRICK BUNDLE</text>

  <!-- ====== Bottom disclaimer strip ====== -->
  <rect x="0" y="260" width="500" height="20" fill="#111111"/>
  <text x="250" y="274" font-family="Arial, sans-serif" font-style="italic" font-size="9"
    fill="#AAAAAA" text-anchor="middle">DRAMATIC RECONSTRUCTION. Actual wolf may vary.</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#CC0000"/>
    </marker>
  </defs>
</svg>
