<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <!-- Background (transparent / very dark) -->
  <rect x="0" y="0" width="300" height="160" fill="transparent"/>

  <!-- TV lower-third chyron bar -->
  <rect x="0" y="95" width="300" height="60" fill="#1C1C1C" opacity="0.94"/>

  <!-- Red accent stripe on left edge -->
  <rect x="0" y="95" width="6" height="60" fill="#CC0000"/>

  <!-- Wolf mugshot box -->
  <rect x="12" y="100" width="48" height="48" fill="#3A3A3A" stroke="#555555" stroke-width="1.5" rx="2"/>
  <!-- Wolf silhouette in box -->
  <g fill="#888888" transform="translate(12,100)">
    <!-- Head -->
    <circle cx="24" cy="18" r="10"/>
    <!-- Ears -->
    <polygon points="15,10 12,2 20,10"/>
    <polygon points="33,10 36,2 28,10"/>
    <!-- Snout -->
    <ellipse cx="28" cy="22" rx="7" ry="5"/>
    <!-- Nose dot -->
    <circle cx="30" cy="20" r="1.5" fill="#555"/>
    <!-- Body/shoulders -->
    <ellipse cx="24" cy="40" rx="14" ry="10"/>
  </g>
  <!-- Mugshot label -->
  <text x="36" y="152" font-family="Arial, sans-serif" font-size="6.5" fill="#888888" text-anchor="middle">SUSPECT</text>

  <!-- Name: B. BADWOLF -->
  <text
    x="70" y="122"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="18"
    fill="#FFFFFF"
    letter-spacing="1"
  >B. BADWOLF</text>

  <!-- Subtitle: Verified Attacker · stars -->
  <text
    x="70" y="142"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#CCCCCC"
  >Verified Attacker · </text>
  <!-- Stars: 1 gold, 4 grey -->
  <text
    x="182" y="142"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#FFD700"
  >★</text>
  <text
    x="194" y="142"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#666666"
  >☆☆☆☆</text>

  <!-- "LIVE" badge top-right -->
  <rect x="255" y="100" width="38" height="18" rx="3" fill="#CC0000"/>
  <text
    x="274" y="113"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="11"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="1.5"
  >LIVE</text>

  <!-- Decorative top bar (thin gold line above chyron) -->
  <rect x="0" y="93" width="300" height="2.5" fill="#FFD700"/>
</svg>
