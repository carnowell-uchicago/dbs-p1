<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Helvetica Neue',Arial,sans-serif">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>

  <!-- Fixed header -->
  <rect width="400" height="52" fill="white"/>
  <rect y="52" width="400" height="1" fill="#e0e0e0"/>
  <!-- Logo -->
  <text x="16" y="34" font-size="18" font-weight="900" fill="#006aff">PigZillow</text>
  <!-- Search bar -->
  <rect x="110" y="14" width="200" height="26" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="120" y="31" font-size="11" fill="#999">Pig's Hollow, MD</text>
  <!-- Nav links -->
  <text x="322" y="30" font-size="9" fill="#444">Buy</text>
  <text x="345" y="30" font-size="9" fill="#444">Rent</text>
  <text x="368" y="30" font-size="9" fill="#444">Sell</text>

  <!-- Left panel — listing card -->
  <rect x="0" y="53" width="230" height="195" fill="#f0f2f5"/>
  <!-- Scene header (blue) -->
  <rect x="8" y="61" width="214" height="38" rx="6" fill="#006aff"/>
  <text x="18" y="76" font-size="9" font-weight="700" fill="white">CHAPTER 1 — THE STRAW HOUSE</text>
  <text x="18" y="90" font-size="8" fill="rgba(255,255,255,0.85)">1 Meadow Lane, Pig's Hollow, MD  ·  $89,000</text>
  <!-- Listing card -->
  <rect x="8" y="107" width="214" height="133" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Photo area -->
  <rect x="8" y="107" width="214" height="55" rx="6" fill="#dbe8f5"/>
  <rect x="8" y="134" width="214" height="28" fill="#dbe8f5"/>
  <!-- House silhouette -->
  <polygon points="100,112 85,130 115,130" fill="#aac4de"/>
  <rect x="89" y="130" width="26" height="18" fill="#aac4de"/>
  <text x="15" y="122" font-size="7" fill="#555">🏠</text>
  <!-- Badge -->
  <rect x="15" y="115" width="44" height="14" rx="3" fill="#006aff"/>
  <text x="19" y="125" font-size="8" font-weight="700" fill="white">FOR SALE</text>
  <!-- Listing details -->
  <text x="16" y="177" font-size="12" font-weight="800" fill="#1a1a1a">$89,000</text>
  <text x="16" y="191" font-size="8" fill="#555">1 Meadow Lane · Pig's Hollow, MD</text>
  <text x="16" y="203" font-size="8" fill="#767676">Compact straw construction · 0 bd · 1 ba · 180 sq ft</text>
  <!-- Activity row -->
  <rect x="16" y="211" width="198" height="16" rx="3" fill="#fff8e1"/>
  <text x="22" y="222" font-size="7" fill="#b45309">⚠ Structural concern flagged by inspector</text>
  <!-- Agent strip -->
  <rect x="16" y="230" width="198" height="1" fill="#f0f0f0"/>
  <text x="16" y="240" font-size="7" fill="#006aff">Agent: Bacon Realty Group</text>

  <!-- Right panel — map -->
  <rect x="230" y="53" width="170" height="195" fill="#e8f0fe"/>
  <!-- Map base -->
  <rect x="238" y="61" width="154" height="145" rx="4" fill="#e8eef7"/>
  <!-- Roads -->
  <line x1="238" y1="134" x2="392" y2="134" stroke="white" stroke-width="3"/>
  <line x1="315" y1="61" x2="315" y2="206" stroke="white" stroke-width="3"/>
  <!-- Map pins -->
  <!-- Pin 1 — active/blue -->
  <circle cx="275" cy="110" r="8" fill="#006aff"/>
  <text x="271" y="114" font-size="9" fill="white" font-weight="700">1</text>
  <!-- Pin 2 — inactive/grey -->
  <circle cx="340" cy="95" r="7" fill="#999"/>
  <text x="336" y="99" font-size="8" fill="white" font-weight="700">2</text>
  <!-- Pin 3 — inactive/grey -->
  <circle cx="360" cy="155" r="7" fill="#999"/>
  <text x="356" y="159" font-size="8" fill="white" font-weight="700">3</text>
  <!-- Wolf pin — grey -->
  <circle cx="290" cy="160" r="6" fill="#444"/>
  <text x="286" y="164" font-size="8" fill="white">🐺</text>
  <!-- Map caption -->
  <rect x="238" y="210" width="154" height="30" rx="3" fill="white"/>
  <text x="248" y="222" font-size="7" fill="#555">Pig One's meadow property — </text>
  <text x="248" y="232" font-size="7" fill="#555">cheaply built but optimistically priced</text>

  <!-- Chapter pill nav bar -->
  <rect x="0" y="248" width="400" height="52" fill="white"/>
  <rect y="248" width="400" height="1" fill="#e0e0e0"/>
  <!-- Prev button -->
  <rect x="8" y="258" width="50" height="26" rx="4" fill="#f0f0f0"/>
  <text x="18" y="275" font-size="10" fill="#444">← Back</text>
  <!-- Chapter pills -->
  <rect x="66" y="258" width="56" height="26" rx="13" fill="#006aff"/>
  <text x="74" y="275" font-size="8" fill="white" font-weight="700">Overview</text>
  <rect x="128" y="258" width="52" height="26" rx="13" fill="#f0f0f0"/>
  <text x="136" y="275" font-size="8" fill="#555">Ch 1: Straw</text>
  <rect x="186" y="258" width="52" height="26" rx="13" fill="#f0f0f0"/>
  <text x="194" y="275" font-size="8" fill="#555">Ch 2: Sticks</text>
  <rect x="244" y="258" width="50" height="26" rx="13" fill="#f0f0f0"/>
  <text x="249" y="275" font-size="8" fill="#555">Ch 3: Brick</text>
  <!-- Next button -->
  <rect x="336" y="258" width="56" height="26" rx="4" fill="#006aff"/>
  <text x="347" y="275" font-size="10" fill="white" font-weight="700">Next →</text>
</svg>
