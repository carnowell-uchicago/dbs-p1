<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9ab0"/>
      <stop offset="100%" stop-color="#b0c8d8"/>
    </linearGradient>
    <linearGradient id="grass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a4a"/>
      <stop offset="100%" stop-color="#3d6030"/>
    </linearGradient>
    <linearGradient id="logWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6340"/>
      <stop offset="100%" stop-color="#6b4a28"/>
    </linearGradient>
    <filter id="overcast">
      <feColorMatrix type="saturate" values="0.7"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Overcast sky -->
  <rect width="400" height="280" fill="url(#sky2)"/>

  <!-- Heavy clouds -->
  <ellipse cx="80" cy="45" rx="80" ry="30" fill="#c8d8e4" opacity="0.9"/>
  <ellipse cx="120" cy="30" rx="60" ry="25" fill="#d8e4ec" opacity="0.9"/>
  <ellipse cx="50" cy="55" rx="50" ry="22" fill="#bfcfd8" opacity="0.85"/>

  <ellipse cx="290" cy="50" rx="90" ry="32" fill="#c0d0dc" opacity="0.9"/>
  <ellipse cx="330" cy="35" rx="65" ry="24" fill="#ccd8e2" opacity="0.9"/>
  <ellipse cx="370" cy="60" rx="45" ry="20" fill="#b8c8d4" opacity="0.85"/>

  <!-- Trees in background -->
  <!-- Left tree cluster -->
  <g opacity="0.85">
    <rect x="30" y="140" width="10" height="55" fill="#5a3a1a"/>
    <ellipse cx="35" cy="135" rx="26" ry="32" fill="#2d5a2a"/>
    <ellipse cx="35" cy="125" rx="20" ry="24" fill="#3a6a32"/>
    <rect x="60" y="148" width="8" height="47" fill="#5a3a1a"/>
    <ellipse cx="64" cy="143" rx="22" ry="28" fill="#2a5228"/>
    <ellipse cx="64" cy="134" rx="17" ry="21" fill="#356030"/>
  </g>
  <!-- Right tree cluster -->
  <g opacity="0.85">
    <rect x="350" y="148" width="10" height="47" fill="#5a3a1a"/>
    <ellipse cx="355" cy="143" rx="26" ry="30" fill="#2d5a2a"/>
    <ellipse cx="355" cy="133" rx="20" ry="23" fill="#3a6a32"/>
    <rect x="375" y="152" width="8" height="43" fill="#5a3a1a"/>
    <ellipse cx="379" cy="147" rx="22" ry="27" fill="#2a5228"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="195" width="400" height="85" fill="url(#grass2)"/>

  <!-- House body: log/plank vertical walls -->
  <rect x="100" y="120" width="200" height="75" fill="url(#logWall)" filter="url(#shadow2)"/>
  <!-- Vertical plank lines -->
  <g stroke="#5a3a1a" stroke-width="2" opacity="0.6">
    <line x1="115" y1="120" x2="115" y2="195"/>
    <line x1="130" y1="120" x2="130" y2="195"/>
    <line x1="145" y1="120" x2="145" y2="195"/>
    <line x1="160" y1="120" x2="160" y2="195"/>
    <line x1="175" y1="120" x2="175" y2="195"/>
    <line x1="190" y1="120" x2="190" y2="195"/>
    <line x1="205" y1="120" x2="205" y2="195"/>
    <line x1="220" y1="120" x2="220" y2="195"/>
    <line x1="235" y1="120" x2="235" y2="195"/>
    <line x1="250" y1="120" x2="250" y2="195"/>
    <line x1="265" y1="120" x2="265" y2="195"/>
    <line x1="280" y1="120" x2="280" y2="195"/>
  </g>
  <!-- Horizontal log ring lines -->
  <g stroke="#c8966a" stroke-width="1" opacity="0.4">
    <line x1="100" y1="135" x2="300" y2="135"/>
    <line x1="100" y1="152" x2="300" y2="152"/>
    <line x1="100" y1="168" x2="300" y2="168"/>
    <line x1="100" y1="184" x2="300" y2="184"/>
  </g>

  <!-- Roof - pitched, crossed sticks texture -->
  <polygon points="85,125 200,65 315,125" fill="#8B6340"/>
  <!-- Roof stick cross-hatch -->
  <g stroke="#6b4a28" stroke-width="2" opacity="0.7">
    <!-- Left-leaning sticks -->
    <line x1="130" y1="102" x2="155" y2="88"/>
    <line x1="110" y1="115" x2="135" y2="100"/>
    <line x1="155" y1="90" x2="180" y2="78"/>
    <line x1="178" y1="78" x2="200" y2="69"/>
    <line x1="200" y1="69" x2="225" y2="78"/>
    <line x1="225" y1="80" x2="248" y2="90"/>
    <line x1="248" y1="92" x2="270" y2="104"/>
    <line x1="270" y1="106" x2="290" y2="117"/>
    <!-- Right-leaning sticks across -->
    <line x1="120" y1="110" x2="100" y2="118"/>
    <line x1="145" y1="97" x2="125" y2="107"/>
    <line x1="170" y1="84" x2="150" y2="96"/>
    <line x1="195" y1="74" x2="173" y2="85"/>
    <line x1="220" y1="74" x2="198" y2="76"/>
    <line x1="245" y1="85" x2="222" y2="76"/>
    <line x1="270" y1="99" x2="248" y2="87"/>
    <line x1="295" y1="114" x2="272" y2="101"/>
    <line x1="310" y1="122" x2="290" y2="113"/>
  </g>
  <!-- Gaps in roof (weak structure) -->
  <g fill="#7a9ab0" opacity="0.35">
    <ellipse cx="155" cy="90" rx="6" ry="4"/>
    <ellipse cx="240" cy="85" rx="5" ry="3.5"/>
    <ellipse cx="195" cy="100" rx="4" ry="3"/>
  </g>

  <!-- Left window with stick-frame shutters -->
  <rect x="115" y="135" width="44" height="36" fill="#c8d8e4" rx="1"/>
  <rect x="115" y="135" width="44" height="36" fill="none" stroke="#6b4a28" stroke-width="3" rx="1"/>
  <line x1="137" y1="135" x2="137" y2="171" stroke="#6b4a28" stroke-width="2"/>
  <line x1="115" y1="153" x2="159" y2="153" stroke="#6b4a28" stroke-width="2"/>
  <!-- Shutter left -->
  <g opacity="0.9">
    <rect x="106" y="135" width="10" height="36" fill="#8B6340" rx="1"/>
    <line x1="106" y1="143" x2="116" y2="143" stroke="#6b4a28" stroke-width="1.5"/>
    <line x1="106" y1="153" x2="116" y2="153" stroke="#6b4a28" stroke-width="1.5"/>
    <line x1="106" y1="163" x2="116" y2="163" stroke="#6b4a28" stroke-width="1.5"/>
  </g>

  <!-- Right window with stick-frame shutters -->
  <rect x="241" y="135" width="44" height="36" fill="#c8d8e4" rx="1"/>
  <rect x="241" y="135" width="44" height="36" fill="none" stroke="#6b4a28" stroke-width="3" rx="1"/>
  <line x1="263" y1="135" x2="263" y2="171" stroke="#6b4a28" stroke-width="2"/>
  <line x1="241" y1="153" x2="285" y2="153" stroke="#6b4a28" stroke-width="2"/>
  <!-- Shutter right -->
  <g opacity="0.9">
    <rect x="284" y="135" width="10" height="36" fill="#8B6340" rx="1"/>
    <line x1="284" y1="143" x2="294" y2="143" stroke="#6b4a28" stroke-width="1.5"/>
    <line x1="284" y1="153" x2="294" y2="153" stroke="#6b4a28" stroke-width="1.5"/>
    <line x1="284" y1="163" x2="294" y2="163" stroke="#6b4a28" stroke-width="1.5"/>
  </g>

  <!-- Door -->
  <rect x="179" y="155" width="42" height="40" fill="#4a2a0a" rx="2"/>
  <rect x="179" y="155" width="42" height="3" fill="#3a1e06"/>
  <circle cx="215" cy="175" r="3" fill="#a08030"/>
  <!-- Door arch -->
  <ellipse cx="200" cy="155" rx="21" ry="7" fill="#3a1e06"/>

  <!-- FOR SALE sign -->
  <g transform="translate(315,168)">
    <rect x="0" y="0" width="60" height="34" fill="white" stroke="#cc2222" stroke-width="2" rx="2"/>
    <text x="30" y="13" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#cc2222" text-anchor="middle">FOR SALE</text>
    <text x="30" y="27" font-family="Arial, sans-serif" font-size="6" fill="#555" text-anchor="middle">PigRealty.com</text>
    <line x1="30" y1="34" x2="30" y2="50" stroke="#888" stroke-width="2"/>
    <line x1="19" y1="50" x2="41" y2="50" stroke="#888" stroke-width="2"/>
  </g>

  <!-- Scattered sticks in yard -->
  <g stroke="#8B6340" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="35" y1="210" x2="60" y2="205"/>
    <line x1="40" y1="220" x2="55" y2="215"/>
    <line x1="350" y1="205" x2="375" y2="212"/>
    <line x1="355" y1="218" x2="380" y2="210"/>
    <line x1="90" y1="215" x2="115" y2="210"/>
    <line x1="285" y1="218" x2="310" y2="212"/>
  </g>

  <!-- Photo watermark-style text -->
  <text x="8" y="272" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.7">2 Forest Edge Dr, Pig's Hollow MD · Listed by PigRealty.com</text>
</svg>
