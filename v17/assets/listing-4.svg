<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="60%" stop-color="#2d3a52"/>
      <stop offset="100%" stop-color="#3d4a5f"/>
    </linearGradient>
    <linearGradient id="ground4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3328"/>
      <stop offset="100%" stop-color="#28241c"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="archDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000aa"/>
    </filter>
    <filter id="gloom">
      <feColorMatrix type="saturate" values="0.3"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.7"/>
        <feFuncG type="linear" slope="0.7"/>
        <feFuncB type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="darkVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Dark gloomy sky -->
  <rect width="400" height="280" fill="url(#sky4)"/>

  <!-- Dark clouds -->
  <ellipse cx="100" cy="35" rx="90" ry="28" fill="#252a38" opacity="0.9"/>
  <ellipse cx="140" cy="22" rx="70" ry="22" fill="#1e222e" opacity="0.9"/>
  <ellipse cx="60" cy="48" rx="60" ry="20" fill="#1c2030" opacity="0.85"/>
  <ellipse cx="300" cy="30" rx="100" ry="30" fill="#22283a" opacity="0.9"/>
  <ellipse cx="360" cy="18" rx="65" ry="22" fill="#1a1e2a" opacity="0.9"/>

  <!-- Distant gloomy landscape -->
  <!-- Far trees (dark silhouettes) -->
  <g opacity="0.6" fill="#1a2230">
    <rect x="10" y="130" width="6" height="60"/>
    <ellipse cx="13" cy="128" rx="14" ry="20"/>
    <rect x="28" y="135" width="5" height="55"/>
    <ellipse cx="30" cy="133" rx="11" ry="16"/>
    <rect x="355" y="132" width="6" height="58"/>
    <ellipse cx="358" cy="130" rx="13" ry="18"/>
    <rect x="374" y="138" width="5" height="52"/>
    <ellipse cx="376" cy="136" rx="10" ry="15"/>
  </g>

  <!-- Ground - muddy, dark -->
  <rect x="0" y="195" width="400" height="85" fill="url(#ground4)"/>
  <!-- Puddles -->
  <ellipse cx="90" cy="220" rx="22" ry="7" fill="#2a3a4a" opacity="0.7"/>
  <ellipse cx="320" cy="235" rx="18" ry="5" fill="#2a3a4a" opacity="0.6"/>
  <ellipse cx="180" cy="245" rx="30" ry="6" fill="#2a3a4a" opacity="0.5"/>

  <!-- Bridge/underpass structure -->
  <!-- Bridge deck on top -->
  <rect x="0" y="82" width="400" height="30" fill="url(#bridgeGrad)" filter="url(#darkShadow)"/>
  <!-- Bridge stone texture -->
  <g stroke="#3a3a42" stroke-width="1" opacity="0.5">
    <line x1="0" y1="92" x2="400" y2="92"/>
    <line x1="0" y1="102" x2="400" y2="102"/>
    <!-- Vertical stone joints -->
    <line x1="40" y1="82" x2="40" y2="112"/>
    <line x1="80" y1="82" x2="80" y2="112"/>
    <line x1="120" y1="82" x2="120" y2="112"/>
    <line x1="160" y1="82" x2="160" y2="112"/>
    <line x1="200" y1="82" x2="200" y2="112"/>
    <line x1="240" y1="82" x2="240" y2="112"/>
    <line x1="280" y1="82" x2="280" y2="112"/>
    <line x1="320" y1="82" x2="320" y2="112"/>
    <line x1="360" y1="82" x2="360" y2="112"/>
  </g>

  <!-- Left bridge pier/wall -->
  <rect x="0" y="112" width="110" height="85" fill="#35353d"/>
  <!-- Stone texture left -->
  <g stroke="#2a2a32" stroke-width="1" opacity="0.6">
    <line x1="0" y1="125" x2="110" y2="125"/>
    <line x1="0" y1="140" x2="110" y2="140"/>
    <line x1="0" y1="155" x2="110" y2="155"/>
    <line x1="0" y1="170" x2="110" y2="170"/>
    <line x1="0" y1="185" x2="110" y2="185"/>
    <line x1="25" y1="112" x2="25" y2="197"/>
    <line x1="50" y1="112" x2="50" y2="197"/>
    <line x1="75" y1="112" x2="75" y2="197"/>
    <line x1="100" y1="112" x2="100" y2="197"/>
  </g>

  <!-- Right bridge pier/wall -->
  <rect x="290" y="112" width="110" height="85" fill="#35353d"/>
  <!-- Stone texture right -->
  <g stroke="#2a2a32" stroke-width="1" opacity="0.6">
    <line x1="290" y1="125" x2="400" y2="125"/>
    <line x1="290" y1="140" x2="400" y2="140"/>
    <line x1="290" y1="155" x2="400" y2="155"/>
    <line x1="290" y1="170" x2="400" y2="170"/>
    <line x1="290" y1="185" x2="400" y2="185"/>
    <line x1="315" y1="112" x2="315" y2="197"/>
    <line x1="340" y1="112" x2="340" y2="197"/>
    <line x1="365" y1="112" x2="365" y2="197"/>
    <line x1="390" y1="112" x2="390" y2="197"/>
  </g>

  <!-- Arch opening (the dark void under the bridge) -->
  <path d="M 110,195 L 110,155 Q 110,112 200,112 Q 290,112 290,155 L 290,195 Z" fill="url(#archDark)"/>
  <!-- Deep shadow in arch -->
  <ellipse cx="200" cy="175" rx="80" ry="40" fill="#000000" opacity="0.7"/>

  <!-- Scattered debris inside arch -->
  <g stroke="#8B6340" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
    <line x1="130" y1="190" x2="155" y2="185"/>
    <line x1="135" y1="197" x2="152" y2="191"/>
    <line x1="240" y1="188" x2="268" y2="183"/>
    <line x1="245" y1="195" x2="270" y2="190"/>
    <line x1="170" y1="192" x2="195" y2="196"/>
  </g>
  <!-- Straw bits -->
  <g stroke="#c4841a" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <line x1="145" y1="188" x2="158" y2="183"/>
    <line x1="142" y1="193" x2="160" y2="189"/>
    <line x1="255" y1="186" x2="272" y2="182"/>
  </g>

  <!-- Broken bricks/debris -->
  <g fill="#4a4a52" opacity="0.7">
    <polygon points="135,194 145,190 148,197 138,199"/>
    <polygon points="250,191 260,188 263,196 253,198"/>
    <polygon points="185,196 192,194 194,200 187,201"/>
  </g>

  <!-- Wolf paw prints in dirt -->
  <g fill="#2a2218" opacity="0.6">
    <!-- Left print -->
    <ellipse cx="148" cy="220" rx="5" ry="4" transform="rotate(-15, 148, 220)"/>
    <ellipse cx="143" cy="214" rx="2" ry="2.5"/>
    <ellipse cx="148" cy="212" rx="2" ry="2.5"/>
    <ellipse cx="154" cy="213" rx="2" ry="2.5"/>
    <ellipse cx="157" cy="217" rx="2" ry="2.5"/>
    <!-- Right print -->
    <ellipse cx="210" cy="230" rx="5" ry="4" transform="rotate(10, 210, 230)"/>
    <ellipse cx="205" cy="224" rx="2" ry="2.5"/>
    <ellipse cx="210" cy="222" rx="2" ry="2.5"/>
    <ellipse cx="216" cy="223" rx="2" ry="2.5"/>
    <ellipse cx="218" cy="228" rx="2" ry="2.5"/>
    <!-- Another print -->
    <ellipse cx="260" cy="215" rx="5" ry="4" transform="rotate(-5, 260, 215)"/>
    <ellipse cx="255" cy="209" rx="2" ry="2.5"/>
    <ellipse cx="260" cy="207" rx="2" ry="2.5"/>
    <ellipse cx="266" cy="208" rx="2" ry="2.5"/>
    <ellipse cx="268" cy="213" rx="2" ry="2.5"/>
  </g>

  <!-- Hand-scrawled "MAKE OFFER" sign (crude, taped/stapled) -->
  <g transform="translate(155, 145)">
    <!-- Torn, rotated paper piece -->
    <polygon points="0,0 88,3 90,40 -2,38" fill="#e8e0c8" transform="rotate(-4, 45, 20)"/>
    <!-- Tape strip -->
    <rect x="30" y="-5" width="30" height="8" fill="#c8c090" opacity="0.6" transform="rotate(-4, 45, 0)"/>
    <!-- Scrawled text - rough, wobbly -->
    <text x="45" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3a2a18" text-anchor="middle" transform="rotate(-4, 45, 20)">MAKE OFFER</text>
    <text x="45" y="30" font-family="'Courier New', monospace" font-size="6" fill="#5a4a30" text-anchor="middle" transform="rotate(-4, 45, 20)">AS-IS (no discl.)</text>
  </g>

  <!-- Dripping/leaking water from bridge -->
  <g stroke="#2a3a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="155" y1="112" x2="154" y2="128"/>
    <line x1="200" y1="112" x2="199" y2="132"/>
    <line x1="250" y1="112" x2="249" y2="122"/>
  </g>
  <circle cx="154" cy="130" r="2" fill="#2a3a4a" opacity="0.5"/>
  <circle cx="199" cy="134" r="2" fill="#2a3a4a" opacity="0.5"/>

  <!-- Dark vignette overlay -->
  <rect width="400" height="280" fill="url(#darkVignette)"/>

  <!-- Eerie green light flicker inside arch -->
  <ellipse cx="200" cy="165" rx="50" ry="20" fill="#1a3a1a" opacity="0.25"/>

  <!-- Photo watermark-style text -->
  <text x="8" y="272" font-family="Arial, sans-serif" font-size="9" fill="#aaa" opacity="0.8">Under I-40 Overpass, Pig's Hollow MD · Price Reduced</text>
</svg>
