  <ellipse cx="145" cy="198" rx="32" ry="8" fill="#5aaa3a" opacity="0.8"/>
  <ellipse cx="255" cy="198" rx="32" ry="8" fill="#5aaa3a" opacity="0.8"/>
  <!-- Garden flowers -->
