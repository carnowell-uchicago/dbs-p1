    <rect x="155" y="134" width="28" height="10" rx="0.5"/>
    <rect x="185" y="134" width="28" height="10" rx="0.5"/>
    <rect x="215" y="134" width="28" height="10" rx="0.5"/>
    <rect x="245" y="134" width="28" height="10" rx="0.5"/>
    <rect x="275" y="134" width="30" height="10" rx="0.5"/>
