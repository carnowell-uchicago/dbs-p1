    <line x1="140" y1="194" x2="140" y2="202"/>
    <line x1="150" y1="196" x2="150" y2="202"/>
    <line x1="160" y1="194" x2="160" y2="202"/>
    <line x1="245" y1="196" x2="245" y2="202"/>
    <line x1="255" y1="194" x2="255" y2="202"/>
    <line x1="265" y1="196" x2="265" y2="202"/>
    <line x1="275" y1="194" x2="275" y2="202"/>
  </g>

  <!-- FOR SALE sign (subtle, premium) -->
  <g transform="translate(18,162)">
    <rect x="0" y="0" width="62" height="34" fill="white" stroke="#cc2222" stroke-width="2.5" rx="3"/>
    <text x="31" y="13" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#cc2222" text-anchor="middle">FOR SALE</text>
    <text x="31" y="27" font-family="Arial, sans-serif" font-size="6" fill="#555" text-anchor="middle">PigRealty.com</text>
    <line x1="31" y1="34" x2="31" y2="50" stroke="#888" stroke-width="2"/>
    <line x1="20" y1="50" x2="42" y2="50" stroke="#888" stroke-width="2"/>
  </g>

  <!-- Golden hour light overlay -->
  <rect width="400" height="280" fill="#ff8c00" opacity="0.06"/>

  <!-- Photo watermark-style text -->
  <text x="8" y="272" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.75">3 BrickCore Way, Pig's Hollow MD · Listed by PigRealty.com</text>
