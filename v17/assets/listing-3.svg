    <circle cx="130" cy="196" r="3" fill="#ff6688"/>
    <circle cx="140" cy="194" r="2.5" fill="#ffaa00"/>
    <circle cx="150" cy="196" r="3" fill="#ff6688"/>
    <circle cx="160" cy="194" r="2.5" fill="#ffaa00"/>
    <circle cx="245" cy="196" r="3" fill="#ff6688"/>
    <circle cx="255" cy="194" r="2.5" fill="#ffaa00"/>
    <circle cx="265" cy="196" r="3" fill="#ff6688"/>
    <circle cx="275" cy="194" r="2.5" fill="#ffaa00"/>
