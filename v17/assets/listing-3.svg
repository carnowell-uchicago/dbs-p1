    <line x1="165" y1="104" x2="160" y2="112"/>
    <line x1="190" y1="104" x2="185" y2="112"/>
    <line x1="215" y1="104" x2="210" y2="112"/>
    <line x1="240" y1="104" x2="235" y2="112"/>
