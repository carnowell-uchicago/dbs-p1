  </g>
  <!-- Chimney cap -->
  <rect x="245" y="56" width="28" height="6" fill="#7a4a30" rx="1"/>
  <!-- Smoke wisp -->
  <path d="M 259 56 Q 265 45 255 35 Q 245 25 258 15" stroke="#ddd" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 262 56 Q 268 42 260 30" stroke="#ccc" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>

