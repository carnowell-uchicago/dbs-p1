<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f4a460" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <linearGradient id="skyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="40%" stop-color="#b21f1f" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#a8d8f0"/>
    </linearGradient>
    <linearGradient id="goldenHour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="50%" stop-color="#f5c77a"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="grass3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6aaa44"/>
      <stop offset="100%" stop-color="#4a8a28"/>
    </linearGradient>
    <linearGradient id="brickWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0503a"/>
      <stop offset="100%" stop-color="#a83820"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a6a"/>
      <stop offset="100%" stop-color="#3a3a4a"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0a0"/>
      <stop offset="100%" stop-color="#ffb830"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#00000044"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Golden hour sky -->
  <rect width="400" height="280" fill="url(#goldenHour)"/>
  <!-- Sun glow near horizon -->
  <ellipse cx="340" cy="200" rx="100" ry="60" fill="#ffb830" opacity="0.3"/>
  <ellipse cx="340" cy="200" rx="60" ry="40" fill="#ff8c00" opacity="0.25"/>

  <!-- Soft golden clouds -->
  <ellipse cx="70" cy="50" rx="70" ry="22" fill="#ffeebb" opacity="0.6"/>
  <ellipse cx="100" cy="38" rx="50" ry="18" fill="#fff0cc" opacity="0.5"/>
  <ellipse cx="45" cy="60" rx="40" ry="16" fill="#ffddaa" opacity="0.5"/>

  <ellipse cx="300" cy="60" rx="80" ry="24" fill="#ffeebb" opacity="0.55"/>
  <ellipse cx="330" cy="46" rx="55" ry="19" fill="#fff0cc" opacity="0.5"/>

  <!-- Ground with warm glow -->
