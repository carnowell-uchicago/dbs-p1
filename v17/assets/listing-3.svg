  <rect x="201" y="163" width="16" height="12" fill="#1a0e04" rx="1" opacity="0.5"/>
  <rect x="183" y="178" width="16" height="10" fill="#1a0e04" rx="1" opacity="0.5"/>
  <rect x="201" y="178" width="16" height="10" fill="#1a0e04" rx="1" opacity="0.5"/>
