    <rect x="111" y="146" width="28" height="10" rx="0.5"/>
    <rect x="141" y="146" width="28" height="10" rx="0.5"/>
    <rect x="171" y="146" width="28" height="10" rx="0.5"/>
    <rect x="201" y="146" width="28" height="10" rx="0.5"/>
    <rect x="231" y="146" width="28" height="10" rx="0.5"/>
    <rect x="261" y="146" width="28" height="10" rx="0.5"/>
    <rect x="291" y="146" width="14" height="10" rx="0.5"/>
