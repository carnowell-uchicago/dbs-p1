  <!-- Warm glow halo on brick -->
  <ellipse cx="135" cy="146" rx="35" ry="28" fill="#ffb830" opacity="0.12"/>

  <!-- Right window (glowing warm light) -->
  <rect x="240" y="126" width="50" height="40" fill="url(#windowGlow)" rx="3" filter="url(#glow)"/>
  <rect x="240" y="126" width="50" height="40" fill="none" stroke="white" stroke-width="3" rx="3"/>
  <line x1="265" y1="126" x2="265" y2="166" stroke="white" stroke-width="2.5"/>
  <line x1="240" y1="146" x2="290" y2="146" stroke="white" stroke-width="2.5"/>
  <rect x="237" y="165" width="56" height="5" fill="white" rx="1"/>
  <ellipse cx="265" cy="146" rx="35" ry="28" fill="#ffb830" opacity="0.12"/>

  <!-- Solid dark wood front door -->
