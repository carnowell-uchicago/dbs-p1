    <rect x="141" y="170" width="28" height="10" rx="0.5"/>
    <rect x="171" y="170" width="28" height="10" rx="0.5"/>
    <rect x="201" y="170" width="28" height="10" rx="0.5"/>
    <rect x="231" y="170" width="28" height="10" rx="0.5"/>
    <rect x="261" y="170" width="28" height="10" rx="0.5"/>
    <rect x="291" y="170" width="14" height="10" rx="0.5"/>
    <!-- Row 7 -->
    <rect x="95" y="182" width="28" height="10" rx="0.5"/>
    <rect x="125" y="182" width="28" height="10" rx="0.5"/>
    <rect x="155" y="182" width="28" height="10" rx="0.5"/>
