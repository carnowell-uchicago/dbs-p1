<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f0ede6"/>

  <!-- Title -->
  <text x="200" y="22" font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">PARTS LIST / DELFÖRTECKNING — HALMSTUGA</text>
  <line x1="20" y1="28" x2="380" y2="28" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ITEM 1: Straw bundle -->
  <g transform="translate(50, 70)">
    <!-- Straw bundle: parallel lines in a rounded bundle shape -->
    <ellipse cx="30" cy="40" rx="22" ry="10" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="30" cy="28" rx="22" ry="10" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Straw lines -->
    <line x1="12" y1="28" x2="12" y2="40" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="17" y1="20" x2="17" y2="48" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="22" y1="19" x2="22" y2="49" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="27" y1="18" x2="27" y2="50" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="32" y1="18" x2="32" y2="50" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="37" y1="19" x2="37" y2="49" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="42" y1="20" x2="42" y2="48" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="47" y1="28" x2="47" y2="40" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- Tie band -->
    <rect x="21" y="30" width="18" height="6" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1"/>
  </g>
  <!-- Callout line and label -->
  <line x1="100" y1="105" x2="150" y2="95" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="155" y="93" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">HALM × 1</text>
  <text x="155" y="104" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(straw bundle)</text>

  <!-- ITEM 2: Bucket/Mud -->
  <g transform="translate(50, 155)">
    <!-- Bucket trapezoid -->
    <polygon points="10,0 50,0 44,38 16,38" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Bucket handle -->
    <path d="M16,4 Q30,-8 44,4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Mud squiggles inside -->
    <path d="M18,14 Q25,10 32,14 Q39,18 44,14" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
    <path d="M18,22 Q24,18 30,22 Q36,26 42,22" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
  </g>
  <line x1="100" y1="185" x2="150" y2="178" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="155" y="176" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">MUD × 1 (LERA)</text>
  <text x="155" y="187" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(binding agent)</text>

  <!-- ITEM 3: Pig silhouette -->
  <g transform="translate(230, 65)">
    <!-- Body -->
    <ellipse cx="30" cy="42" rx="22" ry="18" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="52" cy="32" r="14" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Snout -->
    <ellipse cx="61" cy="35" rx="6" ry="4" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.2"/>
    <circle cx="59" cy="35" r="1" fill="#1a1a1a"/>
    <circle cx="63" cy="35" r="1" fill="#1a1a1a"/>
    <!-- Ear -->
    <polygon points="48,19 42,10 55,16" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- Legs -->
    <rect x="14" y="56" width="8" height="14" rx="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="26" y="56" width="8" height="14" rx="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Tail -->
    <path d="M8,40 Q0,35 4,28 Q8,21 4,16" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="55" cy="29" r="2" fill="#1a1a1a"/>
  </g>
  <line x1="295" y1="120" x2="310" y2="140" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="290" y="155" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">PIG × 1 (GRIS)</text>

  <!-- ITEM 4: Thought bubble (Optimism - not included) -->
  <g transform="translate(230, 165)">
    <!-- Small dots leading to bubble -->
    <circle cx="20" cy="40" r="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="27" cy="32" r="3" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="35" cy="22" r="4" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Cloud/thought bubble -->
    <ellipse cx="60" cy="12" rx="22" ry="12" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="42" cy="14" rx="10" ry="8" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="77" cy="16" rx="9" ry="7" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  <text x="230" y="218" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a">OPTIMISM × 1</text>
  <text x="230" y="229" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(OPTIMISTISK)</text>
  <text x="230" y="240" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a" font-style="italic">* not included</text>

  <!-- Item letters/numbers in circles -->
  <circle cx="50" cy="48" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>
  <circle cx="50" cy="145" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="50" y="149" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B</text>
  <circle cx="230" cy="50" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="230" y="54" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C</text>
  <circle cx="230" cy="155" r="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="230" y="159" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f0ede6" text-anchor="middle">D</text>

  <!-- Bottom note -->
  <line x1="20" y1="265" x2="380" y2="265" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="200" y="279" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">Check all parts before assembly. Contact store if parts missing (except D — we cannot help you).</text>
</svg>
