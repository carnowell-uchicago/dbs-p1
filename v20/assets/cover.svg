<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 566">
  <!-- Background -->
  <rect width="400" height="566" fill="#f0ede6"/>

  <!-- Top yellow strip -->
  <rect x="0" y="0" width="400" height="80" fill="#FFDA1A"/>

  <!-- GRIS text in yellow strip -->
  <text x="20" y="52" font-family="'Arial Black', Arial, sans-serif" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="2">GRIS</text>

  <!-- Art number -->
  <text x="380" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="end">Art. no. 793.481.22</text>

  <!-- Outer border -->
  <rect x="10" y="90" width="380" height="466" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Three houses in a row -->
  <!-- House 1: small straw house -->
  <g transform="translate(45, 200)">
    <!-- Straw walls (hatching) -->
    <rect x="0" y="40" width="60" height="50" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Straw texture lines -->
    <line x1="5" y1="40" x2="5" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="12" y1="40" x2="12" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="19" y1="40" x2="19" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="26" y1="40" x2="26" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="33" y1="40" x2="33" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="40" y1="40" x2="40" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="47" y1="40" x2="47" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="54" y1="40" x2="54" y2="90" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <!-- Roof -->
    <polygon points="30,0 -10,42 70,42" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="22" y="65" width="16" height="25" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Label A -->
    <text x="30" y="108" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>
  </g>

  <!-- House 2: medium sticks house -->
  <g transform="translate(160, 185)">
    <!-- Stick walls (cross-hatch) -->
    <rect x="0" y="50" width="80" height="65" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Cross-hatch texture -->
    <line x1="0" y1="60" x2="80" y2="60" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="72" x2="80" y2="72" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="84" x2="80" y2="84" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="96" x2="80" y2="96" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="108" x2="80" y2="108" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
    <line x1="16" y1="50" x2="16" y2="115" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
    <line x1="32" y1="50" x2="32" y2="115" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
    <line x1="48" y1="50" x2="48" y2="115" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
    <line x1="64" y1="50" x2="64" y2="115" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
    <!-- Roof -->
    <polygon points="40,0 -12,54 92,54" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="30" y="80" width="20" height="35" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Label B -->
    <text x="40" y="128" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B</text>
  </g>

  <!-- House 3: large brick house -->
  <g transform="translate(290, 165)">
    <!-- Brick walls -->
    <rect x="0" y="60" width="90" height="80" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Brick pattern -->
    <line x1="0" y1="75" x2="90" y2="75" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="0" y1="90" x2="90" y2="90" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="0" y1="105" x2="90" y2="105" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="0" y1="120" x2="90" y2="120" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="0" y1="135" x2="90" y2="135" stroke="#1a1a1a" stroke-width="0.8"/>
    <!-- Vertical brick joints offset rows -->
    <line x1="45" y1="60" x2="45" y2="75" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="22" y1="75" x2="22" y2="90" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="67" y1="75" x2="67" y2="90" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="45" y1="90" x2="45" y2="105" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="22" y1="105" x2="22" y2="120" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="67" y1="105" x2="67" y2="120" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="45" y1="120" x2="45" y2="135" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="22" y1="135" x2="22" y2="140" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="67" y1="135" x2="67" y2="140" stroke="#1a1a1a" stroke-width="0.8"/>
    <!-- Chimney -->
    <rect x="65" y="30" width="14" height="35" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Roof -->
    <polygon points="45,0 -14,65 104,65" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Window -->
    <rect x="10" y="80" width="18" height="18" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="10" y1="89" x2="28" y2="89" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="19" y1="80" x2="19" y2="98" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Door -->
    <rect x="35" y="105" width="20" height="35" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Label C -->
    <text x="45" y="153" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C</text>
  </g>

  <!-- Product names -->
  <text x="200" y="370" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">HALMSTUGA</text>
  <line x1="80" y1="374" x2="320" y2="374" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
  <text x="200" y="390" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">PINNHUSET</text>
  <line x1="80" y1="394" x2="320" y2="394" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
  <text x="200" y="410" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">TEGELBOENDE</text>

  <!-- Separator line -->
  <line x1="20" y1="430" x2="380" y2="430" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="200" y="450" font-family="Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Three shelter system / assembly required</text>
  <text x="200" y="464" font-family="Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Warning: wolf not included. Results may vary.</text>

  <!-- Barcode area -->
  <g transform="translate(20, 475)">
    <!-- Barcode bars -->
    <rect x="0" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="4" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="7" y="0" width="3" height="25" fill="#1a1a1a"/>
    <rect x="12" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="15" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="19" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="22" y="0" width="3" height="25" fill="#1a1a1a"/>
    <rect x="27" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="30" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="34" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="37" y="0" width="3" height="25" fill="#1a1a1a"/>
    <rect x="42" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="46" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="49" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="53" y="0" width="3" height="25" fill="#1a1a1a"/>
    <rect x="58" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="61" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="65" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="68" y="0" width="3" height="25" fill="#1a1a1a"/>
    <rect x="73" y="0" width="1" height="25" fill="#1a1a1a"/>
    <rect x="76" y="0" width="2" height="25" fill="#1a1a1a"/>
    <rect x="80" y="0" width="1" height="25" fill="#1a1a1a"/>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="7" fill="#1a1a1a" text-anchor="middle">7934812 2</text>
  </g>

  <!-- Copyright -->
  <text x="380" y="556" font-family="Arial, sans-serif" font-size="7" fill="#1a1a1a" text-anchor="end">©GRIS of Sweden AB</text>
</svg>
