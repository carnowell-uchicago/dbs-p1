<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f0ede6"/>

  <!-- Title -->
  <text x="200" y="22" font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">PARTS LIST / DELFÖRTECKNING — PINNHUSET</text>
  <line x1="20" y1="28" x2="380" y2="28" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ITEM A: Bundle of sticks -->
  <g transform="translate(35, 55)">
    <!-- Crossed stick bundle -->
    <!-- Sticks in bundle -->
    <line x1="5" y1="55" x2="65" y2="5" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="58" x2="72" y2="8" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="48" x2="55" y2="2" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="60" x2="75" y2="14" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="62" x2="78" y2="20" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Binding band -->
    <rect x="28" y="25" width="20" height="8" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.2" transform="rotate(-40 38 29)"/>
    <!-- Count tag -->
    <rect x="55" y="42" width="30" height="14" rx="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">×24</text>
  </g>
  <line x1="115" y1="90" x2="160" y2="82" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="165" y="80" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">PINNAR × 24</text>
  <text x="165" y="91" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(sticks, assorted)</text>

  <!-- ITEM B: Rope coil -->
  <g transform="translate(40, 155)">
    <!-- Rope coil circles -->
    <ellipse cx="35" cy="20" rx="30" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <ellipse cx="35" cy="25" rx="25" ry="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <ellipse cx="35" cy="30" rx="19" ry="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <ellipse cx="35" cy="34" rx="13" ry="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Rope end -->
    <path d="M60,22 Q68,15 65,8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  <line x1="110" y1="175" x2="155" y2="168" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="160" y="166" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">ROPE × 1 (REP)</text>
  <text x="160" y="177" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(for lashing sticks)</text>

  <!-- ITEM C: Pig silhouette -->
  <g transform="translate(230, 55)">
    <!-- Body -->
    <ellipse cx="30" cy="42" rx="22" ry="18" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="52" cy="32" r="14" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Snout -->
    <ellipse cx="61" cy="35" rx="6" ry="4" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.2"/>
    <circle cx="59" cy="35" r="1" fill="#1a1a1a"/>
    <circle cx="63" cy="35" r="1" fill="#1a1a1a"/>
    <!-- Ear -->
    <polygon points="48,19 42,10 55,16" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- Legs -->
    <rect x="14" y="56" width="8" height="14" rx="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="26" y="56" width="8" height="14" rx="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Tail -->
    <path d="M8,40 Q0,35 4,28 Q8,21 4,16" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="55" cy="29" r="2" fill="#1a1a1a"/>
  </g>
  <line x1="295" y1="110" x2="310" y2="130" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="285" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">PIG × 1 (GRIS)</text>

  <!-- ITEM D: Cloud / overconfidence -->
  <g transform="translate(232, 165)">
    <!-- Larger cloud shape -->
    <ellipse cx="52" cy="16" rx="24" ry="14" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="32" cy="18" rx="14" ry="10" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="72" cy="20" rx="12" ry="9" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Small dots below cloud -->
    <circle cx="20" cy="30" r="3" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="13" cy="38" r="2" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1"/>
  </g>
  <text x="230" y="215" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a">OVERCONFIDENCE × 1</text>
  <text x="230" y="226" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a">(ÖVERTROENDE)</text>
  <text x="230" y="237" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a" font-style="italic">* not included</text>

  <!-- Item circles -->
  <circle cx="40" cy="42" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>
  <circle cx="40" cy="145" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="40" y="149" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B</text>
  <circle cx="232" cy="42" r="9" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="232" y="46" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C</text>
  <circle cx="232" cy="152" r="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="232" y="156" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f0ede6" text-anchor="middle">D</text>

  <!-- Bottom note -->
  <line x1="20" y1="265" x2="380" y2="265" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="200" y="279" font-family="Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">Ensure all 24 sticks are present. We count them. You should too.</text>
</svg>
