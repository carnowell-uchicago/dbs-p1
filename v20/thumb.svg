<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Verdana', sans-serif">
  <!-- Page background -->
  <rect width="800" height="600" fill="#f5f0e8"/>

  <!-- The "page" itself -->
  <rect x="80" y="30" width="640" height="540" fill="white" rx="2" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="6" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- GRIS yellow header strip -->
  <rect x="80" y="30" width="640" height="70" fill="#FFDA1A" rx="2"/>

  <!-- GRIS logo text -->
  <text x="110" y="78" font-size="36" font-weight="900" fill="#0058A3" letter-spacing="4">GRIS</text>

  <!-- Art number -->
  <text x="580" y="58" font-size="11" fill="#003366" text-anchor="end">Art. no. 793.481.22</text>
  <text x="580" y="74" font-size="11" fill="#003366" text-anchor="end">Assembly Instructions</text>

  <!-- Three house illustrations -->
  <!-- Straw house (small, simple) -->
  <g transform="translate(140, 140)">
    <!-- roof -->
    <polygon points="60,0 0,50 120,50" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- walls with straw texture lines -->
    <rect x="15" y="50" width="90" height="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="15" y1="60" x2="105" y2="60" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="70" x2="105" y2="70" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="80" x2="105" y2="80" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="90" x2="105" y2="90" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="100" x2="105" y2="100" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="110" x2="105" y2="110" stroke="#888" stroke-width="0.8"/>
    <!-- door -->
    <rect x="45" y="90" width="30" height="30" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- Sticks house (medium) -->
  <g transform="translate(320, 120)">
    <polygon points="65,0 0,55 130,55" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="15" y="55" width="100" height="75" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- diagonal stick lines -->
    <line x1="15" y1="60" x2="115" y2="130" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="80" x2="115" y2="130" stroke="#888" stroke-width="0.8"/>
    <line x1="15" y1="55" x2="115" y2="100" stroke="#888" stroke-width="0.8"/>
    <line x1="55" y1="55" x2="15" y2="120" stroke="#888" stroke-width="0.8"/>
    <rect x="48" y="95" width="32" height="35" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- Brick house (tallest, most solid) -->
  <g transform="translate(520, 100)">
    <polygon points="65,0 0,60 130,60" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="10" y="60" width="110" height="90" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- brick grid -->
    <line x1="10" y1="75" x2="120" y2="75" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="90" x2="120" y2="90" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="105" x2="120" y2="105" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="120" x2="120" y2="120" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="135" x2="120" y2="135" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="65" y1="60" x2="65" y2="75" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="38" y1="75" x2="38" y2="90" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="93" y1="75" x2="93" y2="90" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="50" y1="90" x2="50" y2="105" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="80" y1="90" x2="80" y2="105" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="45" y="110" width="38" height="40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- chimney -->
    <rect x="88" y="42" width="16" height="22" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>

  <!-- Product names -->
  <text x="400" y="310" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">HALMSTUGA / PINNHUSET / TEGELBOENDE</text>

  <!-- Divider -->
  <line x1="110" y1="324" x2="690" y2="324" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Warning row -->
  <g transform="translate(160, 345)">
    <polygon points="20,0 0,35 40,35" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="18" y="28" font-size="14" font-weight="900" fill="#1a1a1a" text-anchor="middle">!</text>
    <text x="55" y="24" font-size="12" fill="#1a1a1a">VARNING: Do not expose to Canis lupus. See safety leaflet B.</text>
  </g>

  <!-- Step indicators row -->
  <g transform="translate(120, 405)">
    <circle cx="25" cy="20" r="20" fill="#FFDA1A"/>
    <text x="25" y="26" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
    <rect x="60" y="5" width="100" height="30" fill="#f0ede6" stroke="#cccccc" stroke-width="1" rx="2"/>

    <circle cx="205" cy="20" r="20" fill="#FFDA1A"/>
    <text x="205" y="26" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
    <rect x="240" y="5" width="100" height="30" fill="#f0ede6" stroke="#cccccc" stroke-width="1" rx="2"/>

    <circle cx="385" cy="20" r="20" fill="#FFDA1A"/>
    <text x="385" y="26" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
    <rect x="420" y="5" width="100" height="30" fill="#f0ede6" stroke="#cccccc" stroke-width="1" rx="2"/>
    <text x="462" y="26" font-size="13" fill="#999" text-anchor="middle">???</text>
  </g>

  <!-- Page counter -->
  <text x="400" y="490" font-size="13" fill="#888" text-anchor="middle">Page 1 / 11</text>

  <!-- Prev/Next buttons -->
  <rect x="200" y="505" width="100" height="34" rx="4" fill="#f0ede6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="250" y="527" font-size="13" fill="#1a1a1a" text-anchor="middle">← Prev</text>
  <rect x="500" y="505" width="100" height="34" rx="4" fill="#FFDA1A" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="527" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Next →</text>

  <!-- Fine print -->
  <text x="400" y="558" font-size="9" fill="#aaa" text-anchor="middle">©GRIS of Sweden AB · Art. no. 793.481.22 · Blärgenfärd, Sweden · GRIS takes no responsibility for wolf-related structural failures</text>
</svg>
