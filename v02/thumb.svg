  <text x="512" y="258" text-anchor="middle" fill="#1a1408" font-family="Georgia,serif" font-size="58" font-weight="bold">Three Local Pigs Strike Out</text>
  <text x="512" y="316" text-anchor="middle" fill="#1a1408" font-family="Georgia,serif" font-size="44" font-weight="bold">On Their Own</text>
  <text x="512" y="346" text-anchor="middle" fill="#4a4030" font-family="Georgia,serif" font-size="18" font-style="italic">Siblings depart family home; each to build shelter of their choosing. Wolf sightings reported.</text>
  <line x1="60" y1="360" x2="964" y2="360" stroke="#1a1408" stroke-width="1"/>

